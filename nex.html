  const teamPick = ME.admin && teams.length > 1 ? '<select class="nx-sel sm" id="trTeam" aria-label="Team">' + teams.map(t => '<option' + (t === team ? ' selected' : '') + '>' + esc(t) + '</option>').join('') + '</select>' : '';
  return pageHead('chart', team + ' team', 'Team report', teamPick) +
    (canEnter ? '<div class="nx-card nx-noprint"><div class="nx-card-h"><h3 id="trEntryH">Entry for ' + esc(trDay(TR.date)) + '</h3><input class="nx-in sm" type="date" id="trDate" aria-label="Day" max="' + today + '" value="' + esc(TR.date) + '"></div><div class="nx-card-b">' +
      (M.length ? '<div class="nx-form three">' + M.map(m => '<div><label class="nx-lbl" for="trM_' + esc(m.metric_key) + '">' + esc(m.label) + '</label><input class="nx-in" type="number" min="0" inputmode="numeric" id="trM_' + esc(m.metric_key) + '"></div>').join('') + '</div>' : '') +
      '<div style="margin-top:' + (M.length ? '14' : '0') + 'px"><label class="nx-lbl" for="trTasks">' + (shape === 'metrics' ? 'Other tasks' : 'What you worked on') + '</label><textarea class="nx-ta" id="trTasks" rows="5" placeholder="One task per line"></textarea></div>' +
      '<div class="nx-btnrow" style="margin-top:14px"><button class="nx-btn primary" id="trSave">Save entry</button><span class="nx-err" id="trMsg" role="alert"></span></div></div></div>' +
      '<div class="nx-card nx-noprint"><div class="nx-card-h"><div><h3>My week</h3><div class="nx-muted" id="trWeekL"></div></div><span class="nx-btnrow"><button class="nx-btn sm" id="trPrev">Previous</button><button class="nx-btn sm" id="trThis">This week</button><button class="nx-btn sm" id="trNext">Next</button></span></div><div id="trWeek"></div></div>'
      : '<div class="nx-card nx-noprint"><div class="nx-note">' + ico('lock') + 'You are viewing the ' + esc(team) + ' team. Daily entries are made by people in that team.</div></div>') +
    (isLead ? (shape === 'placement' ? '<div class="nx-card nx-noprint"><div class="nx-card-h"><div><h3>Weekly placement sections</h3><div class="nx-muted">Filled in by the team lead for the week chosen below.</div></div></div><div class="nx-card-b" id="trPl"></div></div>' : '') +
      '<div class="nx-card nx-printwrap"><div class="nx-card-h nx-noprint"><div><h3>Weekly team report</h3><div class="nx-muted">Monday to Saturday for everyone in ' + esc(team) + '.</div></div><span class="nx-btnrow"><input class="nx-in sm" type="date" id="trRepWeek" aria-label="Any day in the week" value="' + today + '"><button class="nx-btn primary sm" id="trGen">Generate</button><button class="nx-btn sm" id="trPrint" hidden>' + ico('print') + 'Print or save as PDF</button></span></div><div id="trOut"></div></div>'
      : '');
});
async function teamReportHtml(team, shape, M, mon) {
  const sun = trAdd(mon, TR_DAYS - 1), days = Array.from({ length: TR_DAYS }, (_, i) => trAdd(mon, i));
  const [members, reps] = await Promise.all([
    sel('staff_credentials', 'select=staff_name&team=eq.' + encodeURIComponent(team) + '&order=staff_name.asc'),
    sel('processing_reports', 'select=staff_name,report_date,metrics,tasks&report_date=gte.' + mon + '&report_date=lte.' + sun + '&order=staff_name.asc,report_date.asc')
  ]);
  const names = (members || []).map(m => m.staff_name).filter(Boolean);
  if (!names.length) return empty('No ' + team + ' staff found', 'Team membership is set in ShiftOps.');
  const by = {}; names.forEach(n => by[n] = {}); (reps || []).forEach(r => { if (by[r.staff_name]) by[r.staff_name][r.report_date] = r; });
  const head = '<div class="nx-rephead"><h2>' + esc(team) + ': ' + (shape === 'placement' ? 'weekly report' : shape === 'metrics' ? 'weekly report' : 'daily work log') + '</h2><div class="nx-muted">Week of ' + esc(trDay(mon)) + ' to ' + esc(trDay(sun)) + ' · prepared by ' + esc(ME.name) + '</div></div>';
  const tbl = (cols, rows) => '<div class="nx-tablewrap"><table class="nx-table tight auto"><thead><tr>' + cols.map(c => '<th' + (c[1] ? ' class="nx-right"' : '') + '>' + esc(c[0]) + '</th>').join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  let h = '<div class="nx-report">' + head;
  if (shape === 'placement') {
    const pr = await sel('placement_weekly', 'select=students,cancellations,facility_issues,student_issues&team=eq.' + encodeURIComponent(team) + '&week_start=eq.' + mon + '&limit=1');
    const sec = (pr && pr[0]) || {}, s = sec.students || {}, v = x => x != null ? esc(x) : '–';
    const list = (arr, cols) => Array.isArray(arr) && arr.length ? tbl(cols.map(c => [c[1]]), arr.map(r => '<tr>' + cols.map(c => '<td>' + esc((r || {})[c[0]] || '') + '</td>').join('') + '</tr>')) : '<div class="nx-muted">None this week.</div>';
    h += '<h3>1. Placement students</h3>' + tbl([['Measure'], ['Count', 1]], ['<tr><td>Total started</td><td class="nx-right nx-num">' + v(s.total) + '</td></tr>', '<tr><td>Within Sydney or NSW</td><td class="nx-right nx-num">' + v(s.within_nsw) + '</td></tr>', '<tr><td>Outside NSW or regional</td><td class="nx-right nx-num">' + v(s.outside_nsw) + '</td></tr>']) +
      '<h3>2. Placement cancellations</h3>' + list(sec.cancellations, [['student', 'Student'], ['facility', 'Facility'], ['reason', 'Reason'], ['action', 'Action taken']]) +
      '<h3>3. Facility issues</h3>' + list(sec.facility_issues, [['facility', 'Facility'], ['issue', 'Issue'], ['status', 'Status']]) +
      '<h3>4. Student issues</h3>' + list(sec.student_issues, [['student', 'Student'], ['issue', 'Issue'], ['status', 'Current status']]) +
      '<h3>5. Daily tasks by team member</h3>' + tbl([['Member']].concat(days.map(d => [trDay(d)])), names.map(n => '<tr><td><b>' + esc(n) + '</b></td>' + days.map(d => { const r = by[n][d], t = r ? trLines(r.tasks) : []; return '<td>' + (t.length ? t.map(esc).join('<br>') : '<span class="nx-muted">–</span>') + '</td>'; }).join('') + '</tr>'));
    return h + '</div>';
  }
  let calls = {};
  if (shape === 'metrics') { try { const cl = await sel('call_log', 'select=logged_by&deleted_at=is.null&created_at=gte.' + mon + '&created_at=lt.' + trAdd(mon, TR_DAYS)); (cl || []).forEach(r => { const w = (r.logged_by || '').trim(); if (w) calls[w] = (calls[w] || 0) + 1; }); } catch (e) { calls = {}; } }
  const grand = { calls: 0 }; M.forEach(m => grand[m.metric_key] = 0);
  names.forEach(n => {
    const rows = days.map(d => by[n][d]).filter(Boolean);
    h += '<h3>' + esc(n) + '</h3>';
    if (shape !== 'metrics') {
      h += rows.length ? tbl([['Day'], ['Tasks']], rows.map(r => '<tr><td class="nx-num">' + esc(trDay(r.report_date)) + '</td><td>' + (trLines(r.tasks).length ? trLines(r.tasks).map(esc).join('<br>') : '<span class="nx-muted">–</span>') + '</td></tr>')) : '<div class="nx-muted">No entries this week.</div>';
      return;
    }
    const c = calls[n] || 0; grand.calls += c;
    h += '<div class="nx-repline">Calls logged this week: <b>' + c + '</b></div>';
    if (!rows.length) { h += '<div class="nx-muted">No entries this week.</div>'; return; }
    const tot = {}; M.forEach(m => tot[m.metric_key] = 0);
    const body = rows.map(r => { const v = r.metrics || {}; return '<tr><td class="nx-num">' + esc(trDay(r.report_date)) + '</td>' + M.map(m => { const x = Number(v[m.metric_key] || 0); tot[m.metric_key] += x; return '<td class="nx-right nx-num">' + x + '</td>'; }).join('') + '</tr>'; });
    M.forEach(m => grand[m.metric_key] += tot[m.metric_key]);
    body.push('<tr class="nx-totrow"><td>Total</td>' + M.map(m => '<td class="nx-right nx-num">' + tot[m.metric_key] + '</td>').join('') + '</tr>');
    h += tbl([['Day']].concat(M.map(m => [m.label, 1])), body);
    const notes = []; rows.forEach(r => trLines(r.tasks).forEach(t => notes.push('<li>' + esc(trDay(r.report_date)) + ': ' + esc(t) + '</li>')));
    if (notes.length) h += '<div class="nx-repline">Other tasks</div><ul class="nx-replist">' + notes.join('') + '</ul>';
  });
  if (shape === 'metrics') h += '<h3>Team total</h3>' + tbl([['Measure'], ['Total', 1]], ['<tr><td>Calls logged</td><td class="nx-right nx-num">' + grand.calls + '</td></tr>'].concat(M.map(m => '<tr><td>' + esc(m.label) + '</td><td class="nx-right nx-num">' + grand[m.metric_key] + '</td></tr>')));
  return h + '</div>';
}

function nexiInit() {
  if ($('#nexiFab')) return;

  fab.innerHTML = '<img alt="" src="' + NEXI_IMG + '">';
  const panel = document.createElement('section'); panel.id = 'nexiPanel'; panel.className = 'nx-nexi nx-noprint'; panel.hidden = true; panel.setAttribute('aria-label', 'Nexi help');
  document.body.appendChild(fab); document.body.appendChild(panel);
  const first = (ME.name || '').split(' ')[0];
  const home = () => {
    panel.innerHTML = '<header><img alt="" src="' + NEXI_IMG + '"><div><b>Hi' + (first ? ' ' + esc(first) : '') + ', I\'m Nexi</b><span>Pick a question about using Nex.</span></div><button class="nx-btn icon quiet" data-x aria-label="Close help">' + ico('x') + '</button></header><div class="nx-nexibody">' +
      NEXI_FAQ.map((g, gi) => '<h4>' + esc(g[0]) + '</h4><div class="nx-nexiqs">' + g[1].map((q, qi) => '<button type="button" class="nx-chip" data-q="' + gi + '.' + qi + '">' + esc(q[0]) + '</button>').join('') + '</div>').join('') + '</div>';
    bind();
  };
  const answer = (gi, qi) => {
    const q = NEXI_FAQ[gi][1][qi];
    panel.innerHTML = '<header><img alt="" src="' + NEXI_IMG + '"><div><b>Nexi</b><span>' + esc(NEXI_FAQ[gi][0]) + '</span></div><button class="nx-btn icon quiet" data-x aria-label="Close help">' + ico('x') + '</button></header><div class="nx-nexibody"><div class="nx-nexiq">' + esc(q[0]) + '</div><div class="nx-nexia" tabindex="-1">' + esc(q[1]) + '</div><div class="nx-btnrow" style="margin-top:14px">' + (q[2] ? '<a class="nx-btn primary sm" data-go href="' + esc(q[2][0]) + '">' + esc(q[2][1]) + '</a>' : '') + '<button type="button" class="nx-btn sm" data-back>All questions</button></div></div>';
    bind(); const a = $('.nx-nexia', panel); if (a) a.focus();
  };
  const close = () => { if (panel.hidden) return; panel.hidden = true; fab.setAttribute('aria-expanded', 'false'); fab.focus(); };
  const bind = () => {
    $('[data-x]', panel).onclick = close;
    $$('[data-q]', panel).forEach(b => b.onclick = () => { const p = b.dataset.q.split('.'); answer(+p[0], +p[1]); });
    const bk = $('[data-back]', panel); if (bk) bk.onclick = () => { home(); const f = $('.nx-chip', panel); if (f) f.focus(); };
    const go = $('[data-go]', panel); if (go) go.onclick = () => { panel.hidden = true; fab.setAttribute('aria-expanded', 'false'); };
  };
  fab.onclick = () => { if (!panel.hidden) return close(); home(); panel.hidden = false; fab.setAttribute('aria-expanded', 'true'); const f = $('.nx-chip', panel); if (f) f.focus(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden && !modalStack.length) { e.stopPropagation(); close(); } });
  document.addEventListener('pointerdown', e => { if (!panel.hidden && !panel.contains(e.target) && !fab.contains(e.target)) { panel.hidden = true; fab.setAttribute('aria-expanded', 'false'); } });
}

/* ---------- Conversion report: the enrolment team's weekly numbers, worked out from Nex ----------
   Status table and pie: enrolments created in the range (enrolment date, else the day it was added), by stage now.
   Follow-ups: follow-ups marked done in the range, by step. Class: see the note printed under the block. */
const CR = { from: '', to: '' };
const CR_ORDER = ['processed', 'placement', 'not_interested', 'hold', 'docs_completed', 'blended', 'incomplete_docs', 'issue', 'checklist_sent', 'certificate_issued'];
const CR_COLORS = ['#2f6fed', '#e5484d', '#8b5e3c', '#f5a524', '#8e4ec6', '#12a594', '#d6409f', '#6e7787', '#30a46c', '#3a8eca', '#9aa3b2'];
function crOffset(d) {
  try {
    const p = new Intl.DateTimeFormat('en-US', { timeZone: TZ, timeZoneName: 'longOffset' }).formatToParts(new Date(d + 'T12:00:00Z')).find(x => x.type === 'timeZoneName');
    const m = /GMT([+-])(\d\d):?(\d\d)?/.exec(p ? p.value : '');
    return m ? m[1] + m[2] + ':' + (m[3] || '00') : '+10:00';
  } catch (e) { return '+10:00'; }
}
function crStart(d) { return d + 'T00:00:00' + crOffset(d); }
function crNext(d) { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + 1); return x.toISOString().slice(0, 10); }
function crShift(d, n) { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function crPreset(k) {
  const t = sydToday(), mon = trMonday(t);
  if (k === 'week') return [mon, t];
  if (k === 'last') return [crShift(mon, -7), crShift(mon, -1)];
  if (k === '7') return [crShift(t, -6), t];
  return [t.slice(0, 8) + '01', t];
}
function crLong(d) { const x = new Date(d + 'T12:00:00'); return x.toLocaleDateString('en-AU', { day: '2-digit', month: 'short', year: 'numeric' }).replace(/ /g, '-'); }

async function crData(from, to) {
  const A = crStart(from), B = crStart(crNext(to));
  const orQ = encodeURIComponent('(and(enrolled_on.gte.' + from + ',enrolled_on.lte.' + to + '),and(enrolled_on.is.null,created_at.gte.' + A + ',created_at.lt.' + B + '))');
  const [enr, fus, bks] = await Promise.all([
    sel('nex_enrolments', 'select=id,stage,student_id,nex_students!inner(outside_sydney)&nex_students.deleted_at=is.null&deleted_at=is.null&or=' + orQ + '&limit=1000'),
    sel('nex_followups', 'select=step,kind&done_at=gte.' + encodeURIComponent(A) + '&done_at=lt.' + encodeURIComponent(B) + '&limit=1000'),
    sel('nex_class_bookings', 'select=student_id,name&created_at=gte.' + encodeURIComponent(A) + '&created_at=lt.' + encodeURIComponent(B) + '&status=not.in.(cancelled,info_only)&limit=1000')
  ]);
  const people = Array.from(new Set(enr.map(e => e.student_id)));
  const booked = new Set();
  for (let i = 0; i < people.length; i += 80) {
    const rows = await sel('nex_class_bookings', 'select=student_id&status=not.in.(cancelled,info_only)&student_id=in.(' + people.slice(i, i + 80).join(',') + ')&limit=1000');
    rows.forEach(r => booked.add(r.student_id));
  }
  const byStage = {}; enr.forEach(e => { const k = e.stage || ''; byStage[k] = (byStage[k] || 0) + 1; });
  const steps = {}; let other = 0;
  fus.forEach(f => { if (f.kind === 'lead_cycle' && f.step) steps[f.step] = (steps[f.step] || 0) + 1; else other++; });
  const outside = new Set(enr.filter(e => e.nex_students && e.nex_students.outside_sydney).map(e => e.student_id)).size;
  const classBooked = new Set(bks.map(b => b.student_id || ('n:' + String(b.name || '').toLowerCase()))).size;
  return { total: enr.length, byStage, steps, other, fuTotal: fus.length, without: people.filter(p => !booked.has(p)).length, classBooked, outside, capped: enr.length >= 1000 || fus.length >= 1000 };
}

function crPie(rows, total) {
  const live = rows.filter(r => r.n > 0);
  if (!total || !live.length) return '<div class="nx-muted" style="padding:40px 0;text-align:center">Nothing in this range yet.</div>';
  let a0 = -Math.PI / 2, out = '';
  const pt = a => (100 + 90 * Math.cos(a)).toFixed(2) + ' ' + (100 + 90 * Math.sin(a)).toFixed(2);
  live.forEach(r => {
    const f = r.n / total, tip = '<title>' + esc(r.label) + ': ' + r.n + ' (' + Math.round(f * 1000) / 10 + '%)</title>';
    if (f >= 0.9999) { out += '<circle cx="100" cy="100" r="90" fill="' + r.color + '">' + tip + '</circle>'; return; }
    const a1 = a0 + f * 2 * Math.PI;
    out += '<path d="M100 100 L' + pt(a0) + ' A90 90 0 ' + (f > 0.5 ? 1 : 0) + ' 1 ' + pt(a1) + ' Z" fill="' + r.color + '">' + tip + '</path>'; a0 = a1;
  });
  return '<svg class="nx-pie" viewBox="0 0 200 200" role="img" aria-label="Share of each stage: ' + esc(live.map(r => r.label + ' ' + r.n).join(', ')) + '">' + out + '</svg>';
}

function crHtml(d, from, to) {
  const known = CR_ORDER.filter(k => (REF.status.enrolment || []).some(o => o.key === k));
  const extra = (REF.status.enrolment || []).map(o => o.key).filter(k => !known.includes(k) && d.byStage[k]);
  const keys = known.concat(extra);
  const rows = keys.map((k, i) => ({ label: statusLabel('enrolment', k), n: d.byStage[k] || 0, color: CR_COLORS[i % CR_COLORS.length] }));
  const none = d.byStage[''] || 0; if (none) rows.push({ label: 'No stage set', n: none, color: CR_COLORS[10] });
  const pct = n => d.total ? (Math.round(n / d.total * 1000) / 10) + '%' : '–';
  const statusTable = '<div class="nx-tablewrap"><table class="nx-table auto tight"><thead><tr><th>Status</th><th class="nx-num">Number</th><th class="nx-num">Share</th></tr></thead><tbody>' +
    rows.map(r => '<tr><td><span class="nx-swatch" style="background:' + r.color + '"></span>' + esc(r.label) + '</td><td class="nx-num">' + r.n + '</td><td class="nx-num">' + (r.n ? pct(r.n) : '–') + '</td></tr>').join('') +
    '<tr class="nx-totrow"><td>Total</td><td class="nx-num">' + d.total + '</td><td class="nx-num"></td></tr></tbody></table></div>';
  const ord = n => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');
  let fu = '<tr class="nx-totrow"><td>Follow-ups done</td><td class="nx-num">' + d.fuTotal + '</td></tr>';
  for (let i = 1; i <= 9; i++) fu += '<tr><td>' + ord(i) + ' follow-up</td><td class="nx-num">' + (d.steps[i] || 0) + '</td></tr>';
  fu += '<tr><td>Other (added by hand)</td><td class="nx-num">' + d.other + '</td></tr>';
  const cls = '<tr><td>Without First Aid and CPR</td><td class="nx-num">' + d.without + '</td></tr><tr><td>Class booked</td><td class="nx-num">' + d.classBooked + '</td></tr><tr><td>Outside Sydney</td><td class="nx-num">' + d.outside + '</td></tr>';
  return '<div class="nx-report nx-crep">' +
    '<div class="nx-crhead"><div><span class="nx-muted">From</span><b>' + esc(crLong(from)) + '</b></div><div><span class="nx-muted">To</span><b>' + esc(crLong(to)) + '</b></div></div>' +
    (d.capped ? '<div class="nx-note">This range has more rows than Nex can count in one go (1,000). Pick a shorter range for exact numbers.</div>' : '') +
    '<div class="nx-crgrid"><div><h3>Student conversion</h3>' + statusTable + '</div><div class="nx-crpie">' + crPie(rows, d.total) + '</div></div>' +
    '<div class="nx-crgrid2"><div><h3>Follow-ups</h3><div class="nx-tablewrap"><table class="nx-table auto tight"><thead><tr><th>Follow-up</th><th class="nx-num">Number</th></tr></thead><tbody>' + fu + '</tbody></table></div></div>' +
    '<div><h3>Class status</h3><div class="nx-tablewrap"><table class="nx-table auto tight"><thead><tr><th>Class status</th><th class="nx-num">Number</th></tr></thead><tbody>' + cls + '</tbody></table></div>' +
    '<p class="nx-muted nx-crnote">Status: enrolments added in these dates, by the stage they are in now. Follow-ups: marked done in these dates. Class booked: people with a First Aid and CPR booking made in these dates. Without: people added in these dates with no booking yet. Outside Sydney: added in these dates and ticked Outside Sydney on their record.</p></div></div></div>';
}

route(/^\/convreport$/, async () => {
  if (!CR.from) { const p = crPreset('week'); CR.from = p[0]; CR.to = p[1]; }
  afterRender(() => {
    const out = $('#crOut'), f = $('#crFrom'), t = $('#crTo'), pr = $('#crPrint');
    let seq = 0;
    const run = async () => {
      if (!f.value || !t.value) return;
      if (f.value > t.value) { out.innerHTML = empty('Check the dates', 'The From date is after the To date.'); pr.hidden = true; return; }
      CR.from = f.value; CR.to = t.value;
      const my = ++seq; out.setAttribute('aria-busy', 'true');
      try { const d = await crData(CR.from, CR.to); if (my !== seq) return; out.innerHTML = crHtml(d, CR.from, CR.to); pr.hidden = false; }
      catch (e) { if (my === seq) { out.innerHTML = empty('Could not build the report', e.message); pr.hidden = true; } }
      out.removeAttribute('aria-busy');
    };
    f.onchange = t.onchange = run;
    $$('[data-crp]').forEach(b => { b.onclick = () => { const p = crPreset(b.dataset.crp); f.value = p[0]; t.value = p[1]; run(); }; });
    pr.onclick = () => { document.body.classList.add('nx-print-report'); const done = () => { document.body.classList.remove('nx-print-report'); window.removeEventListener('afterprint', done); }; window.addEventListener('afterprint', done); window.print(); };
    run();
  });
  const today = sydToday();
  return pageHead('chart', 'Enrolment team', 'Conversion report', '') +
    '<div class="nx-card nx-noprint"><div class="nx-card-h"><div><h3>Dates</h3><div class="nx-muted">Numbers are worked out from Nex for the dates you pick.</div></div><span class="nx-btnrow"><button class="nx-btn sm" data-crp="week">This week</button><button class="nx-btn sm" data-crp="last">Last week</button><button class="nx-btn sm" data-crp="7">Last 7 days</button><button class="nx-btn sm" data-crp="month">This month</button></span></div>' +
    '<div class="nx-card-b"><div class="nx-form"><div><label class="nx-lbl" for="crFrom">From</label><input class="nx-in" type="date" id="crFrom" max="' + today + '" value="' + esc(CR.from) + '"></div><div><label class="nx-lbl" for="crTo">To</label><input class="nx-in" type="date" id="crTo" max="' + today + '" value="' + esc(CR.to) + '"></div></div></div></div>' +
    '<div class="nx-card nx-printwrap"><div class="nx-card-h nx-noprint"><div><h3>Report</h3></div><span class="nx-btnrow"><button class="nx-btn sm" id="crPrint" hidden>' + ico('print') + 'Print or save as PDF</button></span></div><div id="crOut"><div class="nx-skel" style="height:240px;margin:16px"></div></div></div>';
});

/* ---------- Calls: the Nexus Call Log, copied into Nex ----------
   Logging a call for someone already in Nex adds it to their Activity. A number Nex has never seen starts an UNFINISHED lead,
   flagged to whoever logged the call. All of that happens in the database function nex_log_call, so it is one step.
   The "clocked in and inside office hours" lock is a convenience on this page only. The database does not enforce it. */
const CL = { view: 'wait', scope: 'team', q: '', today: false, rows: [], teams: null, gate: null };
const CL_DAYS = 60, CL_EDIT_MIN = 15, CL_MAX_WORDS = 8;

/* Australian numbers only. Same rule as the Nexus call log: +61 + nine digits, typed as 04xx, 4xx, 61 4xx or +61 4xx. */
function callE164(v) {
  let d = String(v || '').replace(/\D/g, '');
  if (d.startsWith('61') && d.length >= 11) d = d.slice(2);
  if (d.length === 9 && d[0] !== '0') d = '0' + d;
  return /^0\d{9}$/.test(d) ? '+61' + d.slice(1) : null;
}
function callLocal(e) { return e && /^\+61\d{9}$/.test(e) ? '0' + e.slice(3) : (e || ''); }
function callPhoneFmt(e) { const l = callLocal(e); return /^0[2-9]\d{8}$/.test(l) ? (l[1] === '4' ? l.replace(/(\d{4})(\d{3})(\d{3})/, '$1 $2 $3') : l.replace(/(\d{2})(\d{4})(\d{4})/, '$1 $2 $3')) : l; }
function callWords(t) { return String(t || '').trim().split(/\s+/).filter(Boolean); }
const callIsPlc = t => /^placement$/i.test(String(t || '').trim());

/* office hours in Sydney: Mon to Fri 9:00 to 19:00, Sat and Sun 9:00 to 16:00 */
function callOpenNow(now) {
  const p = new Intl.DateTimeFormat('en-AU', { timeZone: TZ, weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(now || new Date());
  const g = t => (p.find(x => x.type === t) || {}).value || '';
  const wd = g('weekday').slice(0, 3), mins = (Number(g('hour')) % 24) * 60 + Number(g('minute'));
  const weekend = wd === 'Sat' || wd === 'Sun';
  return mins >= 9 * 60 && mins < (weekend ? 16 : 19) * 60;
}
async function callGate() {
  if (ME.admin) return { ok: true, admin: true };
  if (!callOpenNow()) return { ok: false, why: 'Calls are logged between 9:00 am and 7:00 pm on weekdays, and 9:00 am to 4:00 pm on weekends (Sydney time).' };
  try {
    const r = await sel('clock_log', 'select=action,ts&staff_name=eq.' + encodeURIComponent(ME.name) + '&order=ts.desc&limit=1');
    if (!r.length || r[0].action !== 'in') return { ok: false, why: 'Clock in on Nexus first, then you can log calls here.' };
  } catch (e) { return { ok: true, unsure: true }; }   /* if the clock cannot be read, do not block the work */
  return { ok: true };
}

async function callTeams() {
  if (CL.teams) return CL.teams;
  try { const r = await sel('staff_credentials', 'select=team'); CL.teams = Array.from(new Set((r || []).map(x => x.team).filter(Boolean))).sort(); }
  catch (e) { CL.teams = []; }
  return CL.teams;
}
async function callLoad() {
  const since = new Date(Date.now() - CL_DAYS * 86400000).toISOString();
  CL.rows = await sel('call_log', 'select=*&deleted_at=is.null&created_at=gte.' + encodeURIComponent(since) + '&order=created_at.desc&limit=600');
}
function callMyTeam() { return STAFF.team || ''; }
function callVisible() {
  const my = callMyTeam().toLowerCase(), q = CL.q.trim().toLowerCase(), today = sydToday();
  return CL.rows.filter(r => {
    if (CL.view === 'wait' && r.resolved_at) return false;
    if (CL.view === 'done' && !r.resolved_at) return false;
    if (CL.scope === 'mine' && r.logged_by !== ME.name) return false;
    if (CL.scope === 'team' && my && String(r.for_team || r.team || '').toLowerCase() !== my) return false;
    if (CL.today && new Date(r.created_at).toLocaleDateString('en-CA', { timeZone: TZ }) !== today) return false;
    if (q && ![r.caller_name, r.phone_e164, callLocal(r.phone_e164), r.reason, r.note, r.logged_by, r.for_team].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
}

function lbOpts(list, cur) { const l = list.slice(); if (cur && !l.includes(cur)) l.unshift(cur); return l.map(n => '<option' + (n === cur ? ' selected' : '') + '>' + esc(n) + '</option>').join(''); }

    '<div class="full"><label class="nx-lbl" for="lbCom">Comments</label><textarea class="nx-ta" id="lbCom" placeholder="Optional. Anything the next person should know."></textarea></div>' +
    '</div><div class="nx-btnrow" style="margin-top:14px"><button class="nx-btn primary" id="lbSave" type="submit">' + ico('check') + 'Save receipt</button></div></form></div></div>' +
    '<div class="nx-card"><div class="nx-toolbar" style="border-top:0"><input class="nx-in sm" id="lbSearch" type="search" placeholder="Search name, email, comments" aria-label="Search logbook receipts" value="' + esc(LB.q) + '">' +
    '<select class="nx-sel sm" id="lbDays" aria-label="Period"><option value="30"' + (LB.days === '30' ? ' selected' : '') + '>Last 30 days</option><option value="60"' + (LB.days === '60' ? ' selected' : '') + '>Last 60 days</option><option value="180"' + (LB.days === '180' ? ' selected' : '') + '>Last 6 months</option><option value="all"' + (LB.days === 'all' ? ' selected' : '') + '>All</option></select>' +
    '<label class="nx-check"><input type="checkbox" id="lbMine"' + (LB.mine ? ' checked' : '') + '> Received by me</label><span class="nx-muted" id="lbCount"></span><span class="nx-grow"></span><button class="nx-btn sm" id="lbRefresh" type="button">' + ico('refresh') + 'Refresh</button></div><div id="lbTable"></div></div>';
});

/* ---------- Motion: tabs slide, pages arrive, nothing snaps ----------
   Corporate personality: one easing (ease-out, no overshoot), three speeds (quick 110, standard 260-320, slow 400).
   - The underline under the active tab, and the thumb behind the active pill button, are ONE element that glides to the next one.
     It starts moving on press, not on release, and it can be interrupted: a new press just re-targets it from where it is.
   - A page leaves quickly (110ms, ease-in) and the next one rises into place (280ms, ease-out) top to bottom, 45ms apart.
   - Content inside a page (record tabs, the pill-button lists) does the same short rise when it changes.
   Everything here is progressive: without it, tabs and pages still work, they just do not glide. */
const INK = [
  { box: '.nx-nav', item: 'a[aria-current="page"], #navMisc.on', pad: 10 },
  { box: '.nx-tabs', item: '.nx-tab[aria-selected="true"]', pad: 8 },
  { box: '.nx-seg', item: 'button[aria-pressed="true"]', pad: 0 }
];
function inkPlace(box, it, pad) {
  if (!it || !it.offsetWidth) return;
  const x = it.offsetLeft + pad, w = Math.max(0, it.offsetWidth - pad * 2), y = it.offsetTop, h = it.offsetHeight;
  const s = box.style;
  if (s.getPropertyValue('--ink-x') === x + 'px' && s.getPropertyValue('--ink-w') === w + 'px' && s.getPropertyValue('--ink-y') === y + 'px') return;
  s.setProperty('--ink-x', x + 'px'); s.setProperty('--ink-w', w + 'px'); s.setProperty('--ink-y', y + 'px'); s.setProperty('--ink-h', h + 'px');
  if (!box.dataset.ink) {
    /* first placement: put it there without gliding from nowhere, then allow gliding from the next change on */
    box.dataset.ink = 'set'; void box.offsetWidth;
    requestAnimationFrame(() => { box.dataset.ink = 'on'; });
  }
}
function inkRefresh() {
  INK.forEach(k => document.querySelectorAll(k.box).forEach(box => {
    if (box.closest('[hidden]')) return;
    inkPlace(box, box.querySelector(k.item), k.pad);
  }));
}
/* a short rise for content that has just changed. Restarting it mid-way is fine. */
function swapIn(el) {
  if (!el || window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.classList.remove('nx-swapin'); void el.offsetWidth; el.classList.add('nx-swapin');
  setTimeout(() => el.classList.remove('nx-swapin'), 360);
}
let swapWatch = null, inkQueued = false;
function motionInit() {
  if (document.body.dataset.motion) return; document.body.dataset.motion = '1';
  const queue = () => { if (inkQueued) return; inkQueued = true; requestAnimationFrame(() => { inkQueued = false; inkRefresh(); }); };
  /* press: the indicator moves now. If the press turns out not to be a click, the next refresh puts it back. */
  document.addEventListener('pointerdown', e => {
    const t = e.target.closest && e.target.closest('.nx-nav a, .nx-nav #navMisc, .nx-tab, .nx-seg button'); if (!t) return;
    const k = INK.find(x => t.closest(x.box)); if (!k) return;
    const box = t.closest(k.box); if (box.dataset.ink === 'on' || box.dataset.ink === 'set') inkPlace(box, t, k.pad);
    if (!t.matches('.nx-nav a, .nx-nav #navMisc')) {
      const card = t.closest('.nx-card'); if (card) swapWatch = { card, until: Date.now() + 900, seen: new WeakSet() };
    }
  }, true);
  document.addEventListener('pointerup', () => setTimeout(inkRefresh, 450), true);
  document.addEventListener('pointercancel', () => setTimeout(inkRefresh, 50), true);
  new MutationObserver(muts => {
    if (swapWatch && Date.now() < swapWatch.until) {
      for (const m of muts) {
        if (m.type !== 'childList' || !m.addedNodes.length) continue;
        const t = m.target; if (!(t instanceof Element) || !swapWatch.card.contains(t) || t.closest('.nx-toolbar, .nx-tabs, .nx-seg, .nx-card-h')) continue;
        if (swapWatch.seen.has(t)) continue; swapWatch.seen.add(t); swapIn(t);
      }
    }
    queue();
  }).observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['aria-pressed', 'aria-selected', 'aria-current', 'class', 'hidden'] });
  let rz = 0;
  window.addEventListener('resize', () => { document.documentElement.classList.add('nx-ink-still'); clearTimeout(rz); rz = setTimeout(() => { inkRefresh(); document.documentElement.classList.remove('nx-ink-still'); }, 160); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { document.documentElement.classList.add('nx-ink-still'); inkRefresh(); setTimeout(() => document.documentElement.classList.remove('nx-ink-still'), 60); });
  queue();
}

/* =========================================================
   Two-step login, Nex side. The 6-digit code is asked in Nexus (it holds the refresh token that a code
   check swaps), so Nex never confirms codes itself. It only (1) refuses to open without a code-verified
   session when the switch is on, and (2) shows the admin card: switch, who has set up, reset.
   The database enforces the rule (nex_open() needs aal2), this file only explains it.
   ========================================================= */
function aalNow() { const c = tokenPayload(ss.get('nex_sb_at')); return (c && c.aal) || 'aal1'; }
async function authApi(path) {
  const r = await fetch(SB + '/auth/v1/' + path, { headers: { apikey: KEY, Authorization: 'Bearer ' + await bearer() } });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok && j && (j.error_code === 'session_not_found' || /session from session_id claim.*does not exist/i.test(j.msg || j.message || ''))) { endSession('gone'); throw new Error('session'); }
  if (!r.ok) { const e = new Error((j && (j.msg || j.message)) || ('Request failed (' + r.status + ')')); e.status = r.status; throw e; }
  return j;
}
/* the token stays valid for up to an hour after Supabase ends the session, so ask the login service now and then */
async function sessionAlive() { if (locked) return; try { await authApi('user'); } catch (e) { /* only a dead session locks (authApi does that); a network blip does not */ } }
async function mfaList() { const u = await authApi('user'); return ((u && u.factors) || []).filter(f => f.factor_type === 'totp' && f.status === 'verified'); }
/* runs once before the app is drawn; never resolves when a code is needed and missing */
function mfaGate() {
  return new Promise(async resolve => {
    try {
      const st = await (await api('rpc/nex_mfa_state', { method: 'POST', body: {} })).json();
      if (st && st.required && aalNow() !== 'aal2') {
        const box = $('#mfa'), card = $('#mfaCard');
        card.innerHTML = '<div class="gate-t mfa-t">Enter your code in Nexus</div><p class="mfa-p">Nex needs your 6-digit code. Go back to Nexus, open the Nex card on the Nodes page, and enter the code from your authenticator app (or set it up if this is your first time).</p>';
        box.hidden = false; return;
      }
    } catch (e) { if (e.message === 'session') return; }
    resolve(true);
  });
}

/* ---------- Admin page card ---------- */
function secCard() {
  return '<div class="nx-card"><div class="nx-card-h"><div><h3>Two-step login</h3><div class="nx-muted">A 6-digit code from an authenticator app, asked in Nexus once per sign-in when a person opens Nex.</div></div></div><div id="adSec" class="nx-card-b"><div class="nx-skel" style="width:50%"></div></div></div>';
}
async function bindSec() {
  const box = $('#adSec'); if (!box) return;
  try {
    const st = await (await api('rpc/nex_mfa_state', { method: 'POST', body: {} })).json();
    const mine = (await mfaList())[0] || null, strong = aalNow() === 'aal2';
    let h = '<div class="nx-row-s"><div><b>Your account</b><div class="nx-muted">' + (mine ? 'Two-step login is set up for you.' : 'Not set up yet. Open Nex from the Nexus Nodes page to set it up.') + '</div></div></div>';
    if (ME.admin) {
      let roster = [];
      try { roster = await (await api('rpc/nex_mfa_roster', { method: 'POST', body: {} })).json(); } catch (e) {} if (!Array.isArray(roster)) roster = [];
      const unset = roster.filter(r => !r.enrolled).length;
      h += '<hr class="nx-hr"><div class="nx-row-s"><div><b>Required for everyone: ' + (st.required ? 'On' : 'Off') + '</b><div class="nx-muted">' +
        (st.required ? 'Nex shows nothing to anyone who has not entered a code this sign-in.' : (mine && strong ? 'Once you turn this on, each person is walked through setup when they next open Nex from Nexus.' + (unset ? ' ' + unset + ' of ' + roster.length + ' have not set up yet.' : '') : 'Set up your own code first (open Nex from Nexus), then you can turn this on.')) +
        '</div></div><div class="nx-btnrow"><button class="nx-btn ' + (st.required ? '' : 'primary') + ' sm" id="secReq"' + (!st.required && !(mine && strong) ? ' disabled' : '') + '>' + (st.required ? 'Turn off' : 'Require for everyone') + '</button></div></div>';
      h += roster.length ? '<div class="nx-tablewrap" style="margin-top:10px"><table class="nx-table auto tight"><thead><tr><th>Staff member</th><th>Code</th><th></th></tr></thead><tbody>' +
        roster.map(r => '<tr><td>' + esc(r.staff_name) + '</td><td>' + (r.enrolled ? '<span class="nx-pill ok">Set up</span>' : '<span class="nx-pill">Not yet</span>') + '</td><td>' + (r.enrolled && r.staff_name !== ME.name ? '<button class="nx-btn sm" data-reset="' + esc(r.staff_name) + '">Reset</button>' : '') + '</td></tr>').join('') + '</tbody></table></div>' : '';
    }
    box.innerHTML = h;
    const again = () => bindSec();
    if ($('#secReq')) $('#secReq').onclick = async () => {
      const on = !st.required;
      if (!await confirmBox(on ? 'Require the 6-digit code for everyone?' : 'Stop requiring the code?', on ? 'Each person sets up an authenticator app the next time they open Nex from Nexus (about a minute). Until they do, they see nothing in Nex.' : 'Nex goes back to protecting student data with passwords only.', on ? 'Require it' : 'Turn off', !on)) return;
      try { await api('rpc/nex_set_mfa_required', { method: 'POST', body: { p_on: on } }); toast(on ? 'Required for everyone' : 'No longer required'); } catch (e) { toast(e.message, true); }
      again();
    };
    $$('[data-reset]', box).forEach(b => b.onclick = async () => {
      const who = b.dataset.reset;
      if (!await confirmBox('Reset ' + who + '\'s code?', 'Use this when they have lost their phone. They set up a new code the next time they open Nex from Nexus.', 'Reset', true)) return;
      try { await api('rpc/nex_admin_reset_mfa', { method: 'POST', body: { p_staff: who } }); toast('Reset'); } catch (e) { toast(e.message, true); }
      again();
    });
  } catch (e) { if (e.message !== 'session') box.innerHTML = empty('Could not load', e.message); }
}

/* start only after every route is registered */
if (ss.get('ngate_nex') === '1') boot(); else window.addEventListener('nex-unlocked', boot, { once: true });

</script>
