<title>Nex · Student management</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232fb5ad'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Arial' font-weight='700' font-size='20' fill='%2308201f'%3EN%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Nex design system v0.1 — "Quiet ledger"
   Light, warm-neutral surfaces, one deep-teal accent, status colours that always pair a tint with a dark label. */
:root{
  --nx-bg:#f1f2ef; --nx-surface:#ffffff; --nx-sunken:#f7f8f6; --nx-hover:#f3f6f5;
  --nx-line:#dcdfd9; --nx-line-strong:#c3c8c0;
  --nx-ink:#171c1a; --nx-ink-2:#424a46; --nx-ink-3:#5d6761;
  --nx-shell:#12201f; --nx-shell-ink:#e8efed; --nx-shell-dim:#9db3ae;
  --nx-accent:#0e6663; --nx-accent-hover:#0a5250; --nx-accent-weak:#e1efee; --nx-accent-line:#a9cfcc;
  --nx-ok:#1c7343; --nx-ok-weak:#e2f3e8; --nx-warn:#8a4f00; --nx-warn-weak:#fbefd9;
  --nx-bad:#a8271f; --nx-bad-weak:#fae7e4; --nx-info:#2f4f9c; --nx-info-weak:#e6ebf8; --nx-mute-weak:#eceeea;
  --nx-r:6px; --nx-r-lg:10px;
  --nx-shadow:0 1px 2px rgba(23,28,26,.06),0 1px 1px rgba(23,28,26,.04);
  --nx-shadow-pop:0 8px 24px rgba(23,28,26,.14),0 2px 6px rgba(23,28,26,.08);
  --nx-font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nx-display:"Space Grotesk","Inter",system-ui,sans-serif;
}
*{box-sizing:border-box}html,body{margin:0}
.nx{font-family:var(--nx-font);font-size:13px;line-height:1.45;color:var(--nx-ink);background:var(--nx-bg);min-height:100%;-webkit-font-smoothing:antialiased}
.nx a{color:var(--nx-accent);text-decoration:none}
.nx a:hover{text-decoration:underline}
.nx h1,.nx h2,.nx h3{margin:0;font-family:var(--nx-display);font-weight:600;letter-spacing:-.01em}
.nx svg{flex:none}
.nx-ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nx-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.nx-top{display:flex;align-items:center;gap:20px;height:52px;padding:0 20px;background:var(--nx-shell);color:var(--nx-shell-ink)}
.nx-brand{display:flex;align-items:center;gap:10px;font-family:var(--nx-display);font-weight:600;font-size:17px;color:#fff!important;text-decoration:none!important}
.nx-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:#2fb5ad;color:#08201f;font-family:var(--nx-display);font-weight:700;font-size:15px}
.nx-search{flex:1;max-width:520px;position:relative;margin:0 auto 0 12px}
.nx-search input{width:100%;height:34px;padding:0 12px 0 34px;border:1px solid #2c4442;border-radius:var(--nx-r);background:#1b2e2c;color:#fff;font:inherit}
.nx-search input::placeholder{color:var(--nx-shell-dim)}
.nx-search input:focus{outline:2px solid #2fb5ad;outline-offset:1px}
.nx-search .nx-ico{position:absolute;left:10px;top:9px;color:var(--nx-shell-dim)}
.nx-lock{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:99px;background:#1b2e2c;border:1px solid #2c4442;font-size:12px;color:var(--nx-shell-ink)}
.nx-lock i{width:8px;height:8px;border-radius:50%;background:#4fd08a;box-shadow:0 0 0 3px rgba(79,208,138,.2)}
.nx-avatar{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;background:var(--nx-accent-weak);color:var(--nx-accent);font-weight:600;font-size:12px;border:1px solid var(--nx-accent-line)}
.nx-top .nx-avatar{background:#2fb5ad;color:#08201f;border:0}
.nx-nav{display:flex;gap:2px;padding:0 16px;background:var(--nx-surface);border-bottom:1px solid var(--nx-line);overflow-x:auto}
.nx-nav a{position:relative;display:flex;align-items:center;height:44px;padding:0 14px;color:var(--nx-ink-2);font-weight:500;white-space:nowrap}
.nx-nav a:hover{color:var(--nx-ink);background:var(--nx-hover);text-decoration:none}
.nx-nav a[aria-current="page"]{color:var(--nx-accent);font-weight:600}
.nx-nav a[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--nx-accent)}
.nx-count{margin-left:8px;padding:0 6px;border-radius:99px;background:var(--nx-mute-weak);color:var(--nx-ink-2);font-size:11px;font-weight:600;line-height:18px}

/* ---------- page ---------- */
.nx-main{max-width:1360px;margin:0 auto;padding:16px 20px 40px;display:flex;flex-direction:column;gap:12px}
.nx-card{background:var(--nx-surface);border:1px solid var(--nx-line);border-radius:var(--nx-r-lg);box-shadow:var(--nx-shadow)}
.nx-card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--nx-line)}
.nx-card-h h3{font-size:14px}
.nx-card-b{padding:16px}
.nx-pagehead{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 16px}
.nx-objico{display:grid;place-items:center;width:40px;height:40px;border-radius:9px;background:var(--nx-accent);color:#fff}
.nx-objico .nx-ico{width:20px;height:20px}
.nx-eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--nx-ink-3);font-weight:600}
.nx-title{font-size:22px;display:flex;align-items:center;gap:6px}
.nx-grow{flex:1}
.nx-muted{color:var(--nx-ink-3)}
.nx-crumbs{display:flex;gap:6px;align-items:center;color:var(--nx-ink-3);font-size:12px}

/* ---------- buttons ---------- */
.nx-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--nx-line-strong);border-radius:var(--nx-r);background:var(--nx-surface);color:var(--nx-ink);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.nx-btn:hover{background:var(--nx-hover);text-decoration:none}
.nx-btn:focus-visible,.nx-tab:focus-visible,.nx-seat:focus-visible,.nx-chip:focus-visible,.nx-seg button:focus-visible{outline:2px solid var(--nx-accent);outline-offset:2px}
.nx-btn.primary{background:var(--nx-accent);border-color:var(--nx-accent);color:#fff}
.nx-btn.primary:hover{background:var(--nx-accent-hover)}
.nx-btn.quiet{border-color:transparent;background:transparent;color:var(--nx-ink-2)}
.nx-btn.quiet:hover{background:var(--nx-mute-weak)}
.nx-btn.icon{width:32px;padding:0}
.nx-btn.sm{height:26px;padding:0 9px;font-size:12px}
.nx-btnrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- pills, chips, segmented ---------- */
.nx-pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--nx-mute-weak);color:var(--nx-ink-2)}
.nx-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.nx-pill.ok{background:var(--nx-ok-weak);color:var(--nx-ok)}
.nx-pill.warn{background:var(--nx-warn-weak);color:var(--nx-warn)}
.nx-pill.bad{background:var(--nx-bad-weak);color:var(--nx-bad)}
.nx-pill.info{background:var(--nx-info-weak);color:var(--nx-info)}
.nx-pill.accent{background:var(--nx-accent-weak);color:var(--nx-accent)}
.nx-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--nx-line-strong);border-radius:99px;background:var(--nx-surface);color:var(--nx-ink-2);font:inherit;font-size:12px;font-weight:500;cursor:pointer}
.nx-chip:hover{background:var(--nx-hover)}
.nx-chip[aria-pressed="true"]{background:var(--nx-accent-weak);border-color:var(--nx-accent-line);color:var(--nx-accent)}
.nx-seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--nx-mute-weak);gap:2px;flex-wrap:wrap}
.nx-seg button{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--nx-ink-2);font:inherit;font-weight:500;cursor:pointer}
.nx-seg button[aria-pressed="true"]{background:var(--nx-surface);color:var(--nx-ink);box-shadow:var(--nx-shadow);font-weight:600}
.nx-seg .nx-count{background:var(--nx-surface);margin-left:0}

/* ---------- table ---------- */
.nx-tablewrap{overflow-x:auto}
.nx-table{width:100%;border-collapse:separate;border-spacing:0;min-width:1040px}
.nx-table th{position:sticky;top:0;height:36px;padding:0 12px;text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--nx-ink-3);background:var(--nx-sunken);border-bottom:1px solid var(--nx-line);white-space:nowrap}
.nx-table td{height:56px;padding:0 12px;border-bottom:1px solid var(--nx-line);vertical-align:middle}
.nx-table tr:last-child td{border-bottom:0}
.nx-table tbody tr:hover td{background:var(--nx-hover)}
.nx-table tr.sel td{background:var(--nx-accent-weak)}
.nx-table .w-check{width:44px;padding-left:16px}
.nx-table input[type=checkbox]{width:16px;height:16px;accent-color:var(--nx-accent);cursor:pointer}
.nx-who{display:flex;align-items:center;gap:10px;min-width:0}
.nx-who b{display:block;font-weight:600}
.nx-who span{display:block;color:var(--nx-ink-3);font-size:12px}
.nx-num{font-variant-numeric:tabular-nums}
.nx-bulk{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--nx-accent);color:#fff;border-radius:var(--nx-r-lg) var(--nx-r-lg) 0 0}
.nx-bulk .nx-btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.nx-bulk .nx-btn:hover{background:rgba(255,255,255,.24)}
.nx-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--nx-line);color:var(--nx-ink-3);font-size:12px}
.nx-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--nx-line)}

/* ---------- meters ---------- */
.nx-meter{width:120px}
.nx-meter-bar{height:6px;border-radius:99px;background:var(--nx-mute-weak);overflow:hidden}
.nx-meter-bar i{display:block;height:100%;border-radius:99px;background:var(--nx-accent)}
.nx-meter-bar i.warn{background:#c47a12}
.nx-meter small{display:block;margin-top:4px;color:var(--nx-ink-3);font-size:11px}

/* ---------- stage path ---------- */
.nx-path{display:flex;list-style:none;margin:0;padding:0;gap:0}
.nx-path li{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 20px 0 26px;background:var(--nx-mute-weak);color:var(--nx-ink-2);font-weight:600;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);margin-left:-6px}
.nx-path li:first-child{margin-left:0;padding-left:16px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%)}
.nx-path li.done{background:var(--nx-accent-weak);color:var(--nx-accent)}
.nx-path li.now{background:var(--nx-accent);color:#fff}
.nx-path .nx-ico{width:14px;height:14px;stroke-width:2.2}
.nx-mini{display:flex;gap:3px}
.nx-mini i{width:14px;height:5px;border-radius:3px;background:var(--nx-line-strong)}
.nx-mini i.on{background:var(--nx-accent)}

/* ---------- record page ---------- */
.nx-hl{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;padding:16px}
.nx-hl .nx-avatar{width:52px;height:52px;font-size:18px;font-family:var(--nx-display)}
.nx-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 24px;flex:1;min-width:300px}
.nx-facts dt,.nx-field dt{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--nx-ink-3);font-weight:600;margin-bottom:2px}
.nx-facts dd,.nx-field dd{margin:0;font-weight:500}
.nx-cols{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.nx-colmain{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:12px}
.nx-colside{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:12px}
.nx-tabs{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--nx-line);overflow-x:auto}
.nx-tab{position:relative;height:42px;padding:0 12px;border:0;background:transparent;color:var(--nx-ink-2);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.nx-tab:hover{color:var(--nx-ink)}
.nx-tab[aria-selected="true"]{color:var(--nx-accent);font-weight:600}
.nx-tab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--nx-accent)}
.nx-sec{border-bottom:1px solid var(--nx-line)}
.nx-sec:last-child{border-bottom:0}
.nx-sec-h{display:flex;align-items:center;gap:8px;width:100%;padding:12px 16px;border:0;background:var(--nx-sunken);font:inherit;font-weight:600;color:var(--nx-ink);cursor:pointer;text-align:left}
.nx-sec-h .nx-ico{transition:transform .15s}
.nx-sec-h[aria-expanded="false"] .nx-ico{transform:rotate(-90deg)}
.nx-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px 32px;padding:16px;margin:0}
.nx-field{margin:0}
.nx-note{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--nx-info-weak);color:var(--nx-info);font-size:12px;font-weight:500}
.nx-feed{list-style:none;margin:0;padding:4px 16px 8px}
.nx-feed li{position:relative;display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--nx-line)}
.nx-feed li:last-child{border-bottom:0}
.nx-feed .dot{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:var(--nx-accent-weak);color:var(--nx-accent)}
.nx-feed .dot .nx-ico{width:14px;height:14px}
.nx-feed .dot.warn{background:var(--nx-warn-weak);color:var(--nx-warn)}
.nx-feed .dot.info{background:var(--nx-info-weak);color:var(--nx-info)}
.nx-feed b{font-weight:600}
.nx-feed time{display:block;color:var(--nx-ink-3);font-size:12px}
.nx-related{display:flex;flex-direction:column}
.nx-related > div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--nx-line)}
.nx-related > div:last-child{border-bottom:0}
.nx-related small{display:block;color:var(--nx-ink-3);font-size:12px}
.nx-big{font-family:var(--nx-display);font-size:26px;font-weight:600;letter-spacing:-.02em}

/* ---------- payments queue ---------- */
.nx-split{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.nx-split > .nx-card:first-child{flex:999 1 640px;min-width:0}
.nx-drawer{flex:1 1 360px;min-width:0;position:sticky;top:12px}
.nx-steps{display:flex;gap:3px;align-items:center}
.nx-steps i{width:18px;height:6px;border-radius:3px;background:var(--nx-line-strong)}
.nx-steps i.on{background:var(--nx-accent)}
.nx-steps i.part{background:var(--nx-accent-line)}
.nx-match{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--nx-line);border-radius:var(--nx-r);background:var(--nx-surface)}
.nx-match.best{border-color:var(--nx-accent-line);background:var(--nx-accent-weak)}
.nx-why{display:flex;flex-wrap:wrap;gap:6px}
.nx-why span{height:20px;padding:0 8px;border-radius:4px;background:var(--nx-surface);border:1px solid var(--nx-line);font-size:11px;font-weight:600;color:var(--nx-ink-2);line-height:18px}
.nx-why span.hit{background:var(--nx-ok-weak);border-color:transparent;color:var(--nx-ok)}
.nx-tr{cursor:pointer}

/* ---------- first aid seat map ---------- */
.nx-days{display:flex;gap:8px;flex-wrap:wrap}
.nx-day{display:flex;flex-direction:column;gap:2px;min-width:112px;padding:8px 12px;border:1px solid var(--nx-line-strong);border-radius:var(--nx-r);background:var(--nx-surface);font:inherit;text-align:left;cursor:pointer}
.nx-day[aria-pressed="true"]{border-color:var(--nx-accent);box-shadow:inset 0 0 0 1px var(--nx-accent);background:var(--nx-accent-weak)}
.nx-day b{font-family:var(--nx-display);font-size:15px}
.nx-day span{font-size:12px;color:var(--nx-ink-3)}
.nx-cap{height:10px;border-radius:99px;background:var(--nx-mute-weak);overflow:hidden;display:flex}
.nx-cap i{display:block;height:100%}
.nx-cap .a{background:var(--nx-accent)}
.nx-cap .b{background:var(--nx-accent-line)}
.nx-day-plan{display:grid;grid-template-columns:2fr 5fr 1fr;gap:3px}
.nx-day-plan div{padding:8px 10px;border-radius:var(--nx-r);background:var(--nx-mute-weak);font-size:12px;font-weight:600;color:var(--nx-ink-2)}
.nx-day-plan div small{display:block;font-weight:500;color:var(--nx-ink-3)}
.nx-day-plan div:nth-child(2){background:var(--nx-accent-weak);color:var(--nx-accent)}
.nx-seats{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
.nx-seat{position:relative;display:grid;place-items:center;height:44px;border:1.5px solid var(--nx-line-strong);border-radius:var(--nx-r);background:var(--nx-surface);color:var(--nx-ink-2);font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.nx-seat:hover{border-color:var(--nx-accent)}
.nx-seat.booked{background:var(--nx-accent-weak);border-color:var(--nx-accent-line);color:var(--nx-accent)}
.nx-seat.here{background:var(--nx-accent);border-color:var(--nx-accent);color:#fff}
.nx-seat.walk{border-style:dashed;border-color:var(--nx-info);background:var(--nx-info-weak);color:var(--nx-info)}
.nx-seat.pick{box-shadow:0 0 0 3px var(--nx-surface),0 0 0 5px var(--nx-ink)}
.nx-legend{display:flex;flex-wrap:wrap;gap:16px;color:var(--nx-ink-2);font-size:12px}
.nx-legend span{display:flex;align-items:center;gap:6px}
.nx-legend i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--nx-line-strong);background:var(--nx-surface)}
.nx-legend i.booked{background:var(--nx-accent-weak);border-color:var(--nx-accent-line)}
.nx-legend i.here{background:var(--nx-accent);border-color:var(--nx-accent)}
.nx-legend i.walk{border-style:dashed;border-color:var(--nx-info);background:var(--nx-info-weak)}
.nx-flags{display:flex;gap:4px}
.nx-flag{display:grid;place-items:center;width:22px;height:22px;border-radius:5px;background:var(--nx-mute-weak);color:var(--nx-ink-3);font-size:10px;font-weight:700}
.nx-flag.on{background:var(--nx-ok-weak);color:var(--nx-ok)}

@media (max-width:760px){
  .nx-top{gap:10px;padding:0 12px}.nx-lock span{display:none}.nx-main{padding:12px}
  .nx-path{flex-direction:column;gap:4px}.nx-path li,.nx-path li:first-child{margin:0;clip-path:none;border-radius:var(--nx-r);justify-content:flex-start}
  .nx-seats{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){.nx *{transition:none!important}}

/* ---------- gate + lock ---------- */
.lockov,#__gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(800px 500px at 80% -10%,rgba(47,181,173,.25),transparent 60%),linear-gradient(160deg,#12201f,#0a1413);font-family:var(--nx-font)}
.lockov[hidden]{display:none}
#__gate{z-index:99999}.lockov{z-index:99998}
.gate-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:36px 32px;width:min(400px,92vw);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.gate-ic{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 14px;border-radius:14px;background:#2fb5ad;color:#08201f;font-family:var(--nx-display);font-weight:700;font-size:26px}

    const m = /^(\$?)(\d[\d,]*)(\.\d+)?$/.exec(el.textContent.trim()); if (!m) return;

const AUD_NAMES = { nex_students: 'student', nex_student_details: 'student details', nex_enrolments: 'enrolment', nex_payments: 'payment', nex_payment_queue: 'payment queue', nex_refunds: 'refund', nex_class_sessions: 'class', nex_class_bookings: 'booking', nex_placement_requests: 'placement request', nex_placements: 'placement', nex_facilities: 'facility', nex_blacklist: 'blacklist entry' };
const SKIP_KEYS = new Set(['updated_at', 'created_at', 'created_by', 'id', 'updated_by']);
function diffHtml(a) {
  if (a.action !== 'UPDATE' || !a.old_row || !a.new_row) return '';
  const ch = Object.keys(a.new_row).filter(k => !SKIP_KEYS.has(k) && JSON.stringify(a.new_row[k]) !== JSON.stringify(a.old_row[k]));
  return ch.slice(0, 6).map(k => '<div class="nx-diff">' + esc(k.replace(/_/g, ' ')) + ': <s>' + esc(a.old_row[k] == null ? 'empty' : a.old_row[k]) + '</s> → <ins>' + esc(a.new_row[k] == null ? 'empty' : a.new_row[k]) + '</ins></div>').join('');
}
function feedItem(a) {
  const what = AUD_NAMES[a.table_name] || a.table_name;
  const verb = a.action === 'INSERT' ? 'Added' : a.action === 'DELETE' ? 'Deleted' : 'Updated';
  return '<li><span class="dot ' + (a.action === 'DELETE' ? 'warn' : a.action === 'INSERT' ? '' : 'info') + '">' + ico(a.action === 'INSERT' ? 'plus' : a.action === 'DELETE' ? 'x' : 'edit') + '</span><div><b>' + esc(a.changed_by || 'Someone') + '</b> ' + verb.toLowerCase() + ' a ' + esc(what) + diffHtml(a) + '<time>' + fmtDT(a.changed_at) + '</time></div></li>';
}

function studentFields(s) {
  s = s || {};
  return [
    { k: 'first_name', label: 'First name', value: s.first_name, required: true }, { k: 'last_name', label: 'Last name', value: s.last_name },
    { k: 'email', label: 'Email', type: 'email', value: s.email }, { k: 'phone', label: 'Phone', type: 'tel', value: s.phone },
    { k: 'phone2', label: 'Second phone', type: 'tel', value: s.phone2 }, { k: 'agent_id', label: 'Agent', type: 'select', options: REF.agents.filter(a => a.active), value: s.agent_id, blank: 'Self / no agent' }
  ];
}
function tidyStudent(v) {
  if (v.email) v.email = v.email.toLowerCase();
  if (v.phone) v.phone = cleanPhone(v.phone) || v.phone;
  if (v.phone2) v.phone2 = cleanPhone(v.phone2) || v.phone2;
  return v;
}
async function findDupes(v) {
  const parts = [];
  if (v.email) parts.push('email.eq.' + v.email);
  if (v.phone && v.phone.length >= 8) parts.push('phone.eq.' + v.phone);
  if (!parts.length) return [];
  return sel('nex_students', 'select=id,first_name,last_name,email,phone&deleted_at=is.null&or=(' + parts.join(',') + ')&limit=5');
}
function newStudent() {
  const f = studentFields().concat([
    { k: 'qualification_id', label: 'Qualification', type: 'select', options: REF.quals.filter(q => q.active), blank: 'Add later' },
    { k: 'fee', label: 'Agreed fee ($)', type: 'number' },
    { k: 'stage', label: 'Stage', type: 'select', options: opts('enrolment', true), value: 'checklist_sent', blank: 'Not set' },
    { k: 'enrolled_on', label: 'Enrolled on', type: 'date', value: sydToday() }
  ]);
  let warned = false;
  formModal('New student', f, async (v, m) => {
    tidyStudent(v);
    if (!warned) {
      const d = await findDupes(v);
      if (d.length) {
        warned = true;
        let b = $('.nx-warnbox', m.el); if (!b) { b = document.createElement('div'); b.className = 'nx-warnbox'; b.style.marginBottom = '12px'; $('.modal-b', m.el).prepend(b); }
        b.innerHTML = 'This looks like someone already in Nex: ' + d.map(x => '<a href="#/students/' + x.id + '">' + esc(fullName(x)) + '</a>').join(', ') + '. Press Create student again if this is a different person.';
        return false;
      }
    }
    const { qualification_id, fee, stage, enrolled_on, ...stu } = v;
    const s = await ins('nex_students', Object.assign(stu, { created_by: ME.name }));
    if (qualification_id || fee != null || stage) await ins('nex_enrolments', { student_id: s.id, qualification_id, fee, stage, enrolled_on, year: new Date().getFullYear(), created_by: ME.name }, true);
    toast('Student added'); go('#/students/' + s.id);
  }, 'Create student');
}

  const s = stu[0]; if (!s) return empty('Student not found', 'They may have been archived.');
  /* the sensitive details come through a function that logs who looked (admins see this) and stops bulk opening */

    eids.length ? sel('nex_placement_requests', 'select=*,nex_facilities(name)&enrolment_id=in.' + inList(eids) + '&order=created_at.desc') : [],
    eids.length ? sel('nex_placements', 'select=*,nex_facilities(name)&enrolment_id=in.' + inList(eids) + '&order=created_at.desc') : [],
    eids.length ? sel('nex_status_history', 'select=*&entity_id=in.' + inList(eids) + '&order=changed_at.desc&limit=40') : [],
    sel('nex_audit', 'select=*&row_id=in.' + inList([id].concat(eids, pays.map(p => p.id))) + '&order=changed_at.desc&limit=40')
  ]);

    '<dl class="nx-facts">' + fact('Email', esc(s.email || '')) + fact('Phone', esc(fmtPhone(s.phone))) + fact('Agent', esc(agentName(s.agent_id))) + fact('Fee and paid', totalFee || totalPaid ? money(totalPaid) + ' of ' + money(totalFee) : '') + fact('Added', esc(fmtDate(s.created_at))) + '</dl>' +

    '<div class="nx-cols"><div class="nx-colmain"><div class="nx-card"><div class="nx-tabs" role="tablist">' +

function bindStudent(c) {
  const view = $('#view');
  const tabBody = $('#srTab');
  const showTab = () => {
    $$('.nx-tab', view).forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === SR.tab)));
    tabBody.innerHTML = SR.tab === 'details' ? tabDetails(c) : SR.tab === 'money' ? tabMoney(c) : tabActivity(c);
  };
  showTab();
  view.onclick = async e => {
    const tb = e.target.closest('.nx-tab'); if (tb) { SR.tab = tb.dataset.tab; showTab(); return; }
    const sh = e.target.closest('.nx-sec-h'); if (sh) { const open = sh.getAttribute('aria-expanded') !== 'false'; sh.setAttribute('aria-expanded', String(!open)); sh.nextElementSibling.hidden = open; return; }
    const b = e.target.closest('[data-a]'); if (!b) return;
    try { await studentAction(b.dataset.a, b.dataset, c); } catch (err) { toast(err.message, true); }
  };
  view.onchange = async e => {
    const sel_ = e.target.closest('[data-stage]'); if (!sel_) return;
    try { await upd('nex_enrolments', 'id=eq.' + sel_.dataset.stage, { stage: sel_.value || null }); toast('Stage updated'); render(); } catch (err) { toast(err.message, true); }
  };
}

function tabMoney(c) {
  if (!c.enr.length) return empty('No enrolments', 'Add an enrolment to track the fee, stage and payments.') + '<div style="padding:0 16px 16px;text-align:center"><button class="nx-btn primary" data-a="addEnr">' + ico('plus') + 'Add enrolment</button></div>';
  const linked = new Set();
  const cards = c.enr.map(e => {
    const ps = c.pays.filter(p => p.enrolment_id === e.id); ps.forEach(p => linked.add(p.id));
    const rf = c.refunds.filter(r => r.enrolment_id === e.id);
    const paid = ps.reduce((t, p) => t + Number(p.amount), 0) - rf.reduce((t, r) => t + Number(r.amount), 0);
    const fee = Number(e.fee || 0); const bal = fee - paid;
    return section((qualName(e.qualification_id) || 'Enrolment') + (e.year ? ' · ' + e.year : ''),
      '<div style="padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center"><div><label class="nx-lbl">Stage</label><select class="nx-sel sm" data-stage="' + e.id + '">' + selectOpts(opts('enrolment', true), e.stage, 'Not set') + '</select></div>' +
      '<div><div class="nx-lbl">Agreed fee</div><div class="nx-money">' + (fee ? money(fee) : '–') + '</div></div><div><div class="nx-lbl">Paid</div><div class="nx-money">' + money(paid) + '</div></div><div><div class="nx-lbl">Balance</div><div class="nx-money ' + (bal > 0 ? 'nx-neg' : 'nx-pos') + '">' + (fee ? money(bal) : '–') + '</div></div><div class="nx-grow"></div>' +
      '<div class="nx-btnrow"><button class="nx-btn sm" data-a="addPay" data-id="' + e.id + '">' + ico('plus') + 'Payment</button><button class="nx-btn sm" data-a="refund" data-id="' + e.id + '">Refund</button><button class="nx-btn sm" data-a="editEnr" data-id="' + e.id + '">' + ico('edit') + 'Edit</button></div></div>' +
      (e.notes || e.follow_up_note ? '<div style="padding:0 16px 12px" class="nx-muted">' + esc(e.notes || '') + '</div>' : '') +
      (ps.length || rf.length ? '<div class="nx-tablewrap"><table class="nx-table auto tight"><thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Reference</th><th>Processing</th></tr></thead><tbody>' +
        ps.map(p => { const q = c.queue.find(x => x.payment_id === p.id); return '<tr><td>' + esc(fmtDate(p.paid_on)) + '</td><td class="nx-money">' + money(p.amount) + '</td><td>' + esc(p.method || '–') + '</td><td>' + esc(p.reference || p.payer_name || '–') + '</td><td>' + (q ? pill('payment_queue', q.queue_status) + ' ' + pill('processing', q.processing_step) : '<span class="nx-muted">–</span>') + '</td></tr>'; }).join('') +
        rf.map(r => '<tr><td>' + esc(fmtDate(r.refunded_on)) + '</td><td class="nx-money nx-neg">-' + money(r.amount).replace('-', '') + '</td><td>Refund</td><td>' + esc(r.reason || '–') + '</td><td>Approved by ' + esc(r.approved_by || '–') + '</td></tr>').join('') + '</tbody></table></div>' : '<div style="padding:0 16px 16px" class="nx-muted">No payments recorded.</div>'));
  }).join('');
  const orphan = c.pays.filter(p => !linked.has(p.id));
  return cards + (orphan.length ? section('Payments not linked to an enrolment', '<div class="nx-tablewrap"><table class="nx-table auto tight"><tbody>' + orphan.map(p => '<tr><td>' + esc(fmtDate(p.paid_on)) + '</td><td class="nx-money">' + money(p.amount) + '</td><td>' + esc(p.reference || p.payer_name || '–') + '</td></tr>').join('') + '</tbody></table></div>') : '');
}
function tabActivity(c) {
  const items = [];
  c.hist.forEach(h => items.push({ t: h.changed_at, html: '<li><span class="dot">' + ico('list') + '</span><div><b>' + esc(h.changed_by || 'Someone') + '</b> moved ' + esc(h.context.replace(/_/g, ' ')) + (h.from_status ? ' from <b>' + esc(statusLabel(h.context, h.from_status)) + '</b>' : '') + ' to <b>' + esc(statusLabel(h.context, h.to_status)) + '</b><time>' + fmtDT(h.changed_at) + '</time></div></li>' }));
  c.aud.forEach(a => { if (a.action === 'UPDATE' && !diffHtml(a)) return; items.push({ t: a.changed_at, html: feedItem(a) }); });
  items.sort((a, b) => String(b.t).localeCompare(String(a.t)));
  return items.length ? '<ul class="nx-feed">' + items.slice(0, 60).map(i => i.html).join('') + '</ul>' : empty('No activity yet');
}

async function studentAction(a, ds, c) {
  const s = c.s;
  if (a === 'editStu') return formModal('Edit contact', studentFields(s), async v => { tidyStudent(v); await upd('nex_students', 'id=eq.' + s.id, v); toast('Saved'); render(); });
  if (a === 'editDet') {
    const d = c.d;
    const f = [{ k: 'dob', label: 'Date of birth', type: 'date', value: d.dob }, { k: 'usi', label: 'USI', value: d.usi, help: 'Unique Student Identifier, 10 characters' },
      { k: 'address', label: 'Street address', value: d.address, full: true }, { k: 'suburb', label: 'Suburb', value: d.suburb }, { k: 'state', label: 'State', value: d.state }, { k: 'postcode', label: 'Postcode', value: d.postcode },
      { k: 'emergency_name', label: 'Emergency contact', value: d.emergency_name }, { k: 'emergency_phone', label: 'Emergency phone', type: 'tel', value: d.emergency_phone }, { k: 'emergency_relation', label: 'Relationship', value: d.emergency_relation },
      { k: 'disability', label: 'Disability', value: d.disability }, { k: 'indigenous_status', label: 'Indigenous status', value: d.indigenous_status }];
    return formModal('Edit personal details', f, async v => {
      if (v.usi) v.usi = v.usi.replace(/\s/g, '').toUpperCase();
      await api('rpc/nex_save_details', { method: 'POST', body: { p_student: s.id, p: v } });
      toast('Saved'); render();
    });
  }
  if (a === 'archive') { if (await confirmBox('Archive student', fullName(s) + ' will be hidden from lists. Their records are kept.', 'Archive', true)) { await upd('nex_students', 'id=eq.' + s.id, { deleted_at: new Date().toISOString() }); toast('Archived'); go('#/students'); } return; }
  if (a === 'addEnr') return enrolmentForm(s, null);
  if (a === 'editEnr') return enrolmentForm(s, c.enr.find(e => e.id === ds.id));
  if (a === 'addPay') return paymentForm({ student: s, enrolment: c.enr.find(e => e.id === ds.id) });
  if (a === 'refund') return refundForm(c.enr.find(e => e.id === ds.id), c.pays);
  if (a === 'addFu') return followupForm({ student: s, enrolments: c.enr });
  if (a === 'doneFu') { await upd('nex_followups', 'id=eq.' + ds.id, { done_at: new Date().toISOString(), done_by: ME.name }); toast('Done'); return render(); }
  if (a === 'bookFA') return go('#/firstaid');
}

/* =========================================================
   Payments and First Aid
   ========================================================= */
const PY = { view: 'toprocess', q: '', page: 0, size: 50, sel: null };
const PROBLEM = ['no_docs', 'not_found', 'issues', 'less_payment', 'no_plc_issues', 'yes_plc_less_payment', 'confirmed_no_plc_less'];

route(/^\/payments(?:\?(.*))?$/, async m => {
  const qs = new URLSearchParams(m[1] || '');
  if (qs.get('view')) { PY.view = qs.get('view'); PY.page = 0; PY.sel = null; history.replaceState(null, '', '#/payments'); }
  const [cTo, cProb, cDone, cUnm] = await Promise.all([
    count('nex_payment_queue', 'processing_step=neq.processed'),
    count('nex_payment_queue', 'queue_status=in.(' + PROBLEM.join(',') + ')'),
    count('nex_payment_queue', 'processing_step=eq.processed'),
    count('nex_payments', 'student_id=is.null')
  ]);
  afterRender(() => bindPayments());
  const seg = [['toprocess', 'To process', cTo], ['attention', 'Needs attention', cProb], ['processed', 'Processed', cDone], ['unmatched', 'Unmatched', cUnm], ['all', 'All payments', null]];
  return pageHead('cash', 'Payments', 'Payment queue', '<button class="nx-btn primary" id="pyAdd">' + ico('plus') + 'Record payment</button>') +
    '<div class="nx-split"><div class="nx-card"><div class="nx-toolbar" style="border-top:0"><div class="nx-seg" id="pySeg">' + seg.map(([k, l, n]) => '<button data-v="' + k + '" aria-pressed="' + (PY.view === k) + '">' + l + (n != null ? ' <span class="nx-count">' + n + '</span>' : '') + '</button>').join('') + '</div><input class="nx-in sm" id="pyQ" style="min-width:220px" placeholder="Search name or reference" value="' + esc(PY.q) + '"></div>' +
    '<div id="pyBody"></div><div class="nx-foot" id="pyFoot"><span></span></div></div><div class="nx-drawer" id="pyDrawer" hidden></div></div>';
});

function bindPayments() {
  const body = $('#pyBody'); let rowsCache = [];
  const load = async () => {
    body.innerHTML = '<div class="nx-card-b"><div class="nx-skel" style="width:60%"></div><div class="nx-skel" style="width:80%;margin-top:12px"></div></div>';
    try {
      const q = safeQ(PY.q); let rows, total;
      const from = PY.page * PY.size, to = from + PY.size - 1;
      if (PY.view === 'unmatched' || PY.view === 'all') {
        let query = 'select=*&order=paid_on.desc.nullslast,created_at.desc';
        if (PY.view === 'unmatched') query += '&student_id=is.null';
        if (q) query += '&or=(payer_name.ilike.*' + q + '*,reference.ilike.*' + q + '*)';
        ({ rows, total } = await selPage('nex_payments', query, from, to));
        rowsCache = rows;
        body.innerHTML = rows.length ? '<div class="nx-tablewrap"><table class="nx-table tight"><thead><tr><th>Date</th><th>Paid by</th><th>Amount</th><th>Method</th><th>Reference</th><th>Student</th><th></th></tr></thead><tbody>' +
          rows.map(p => '<tr><td>' + esc(fmtDate(p.paid_on)) + '</td><td>' + esc(p.payer_name || '–') + '</td><td class="nx-money">' + money(p.amount) + '</td><td>' + esc(p.method || '–') + '</td><td>' + esc(p.reference || '–') + '</td><td>' + (p.student_id ? '<a href="#/students/' + p.student_id + '">Open</a>' : '<span class="nx-pill warn">Unmatched</span>') + '</td><td>' + (p.student_id ? '' : '<button class="nx-btn sm" data-link="' + p.id + '">Link to student</button>') + '</td></tr>').join('') + '</tbody></table></div>' : empty(PY.view === 'unmatched' ? 'Every payment is linked to a student' : 'No payments found');
      } else {
        let query = 'select=*,nex_payments(id,amount,paid_on,payer_name,reference,method,student_id),nex_enrolments(id,student_id,qualification_id,fee,nex_students(id,first_name,last_name,email))&order=updated_at.desc';
        if (PY.view === 'toprocess') query += '&processing_step=neq.processed';
        else if (PY.view === 'attention') query += '&queue_status=in.(' + PROBLEM.join(',') + ')';
        else query += '&processing_step=eq.processed';
        ({ rows, total } = await selPage('nex_payment_queue', query, from, to));
        if (q) { const lq = q.toLowerCase(); rows = rows.filter(r => JSON.stringify([(r.nex_payments || {}).payer_name, (r.nex_payments || {}).reference, ((r.nex_enrolments || {}).nex_students || {}).first_name, ((r.nex_enrolments || {}).nex_students || {}).last_name]).toLowerCase().includes(lq)); }
        rowsCache = rows;
        const stepIdx = k => ['draft_not_made', 'draft_made', 'ready_to_process', 'processed'].indexOf(k);
        body.innerHTML = rows.length ? '<div class="nx-tablewrap"><table class="nx-table tight"><thead><tr><th>Student</th><th>Paid</th><th>Amount</th><th>Queue status</th><th>Processing</th><th>Updated</th></tr></thead><tbody>' +
          rows.map(r => { const p = r.nex_payments || {}, e = r.nex_enrolments || {}, s = e.nex_students || null; const si = stepIdx(r.processing_step);
            return '<tr class="nx-tr ' + (PY.sel === r.id ? 'sel' : '') + '" data-id="' + r.id + '"><td><div class="nx-who"><span class="nx-avatar">' + esc(initials(s ? fullName(s) : p.payer_name)) + '</span><div><b>' + esc(s ? fullName(s) : (p.payer_name || 'Unknown')) + '</b><span>' + esc(s ? s.email || '' : 'Not matched') + '</span></div></div></td><td>' + esc(fmtDate(p.paid_on)) + '</td><td class="nx-money">' + money(p.amount) + '</td><td>' + pill('payment_queue', r.queue_status) + '</td><td>' + pill('processing', r.processing_step) + '<div class="nx-steps" style="margin-top:6px">' + [0, 1, 2, 3].map(i => '<i class="' + (i <= si ? 'on' : '') + '"></i>').join('') + '</div></td><td>' + esc(fmtDT(r.updated_at)) + '</td></tr>'; }).join('') + '</tbody></table></div>' : empty('Nothing here', PY.view === 'toprocess' ? 'The queue is clear.' : 'No entries in this list.');
        $$('.nx-tr', body).forEach(tr => tr.onclick = () => openQueueDrawer(rowsCache.find(x => x.id === tr.dataset.id), load));
      }
      const fromN = total ? from + 1 : 0, toN = from + rows.length;
      $('#pyFoot').innerHTML = '<span>' + (total != null ? fromN + '–' + toN + ' of ' + total.toLocaleString('en-AU') : rows.length + ' shown') + '</span><span class="nx-btnrow"><button class="nx-btn sm" id="pyPrev"' + (PY.page ? '' : ' disabled') + '>Previous</button><button class="nx-btn sm" id="pyNext"' + (total != null && toN >= total ? ' disabled' : '') + '>Next</button></span>';
      $('#pyPrev').onclick = () => { PY.page--; load(); }; $('#pyNext').onclick = () => { PY.page++; load(); };
      $$('[data-link]', body).forEach(b => b.onclick = () => linkPayment(rowsCache.find(x => x.id === b.dataset.link)));
    } catch (e) { body.innerHTML = empty('Could not load payments', e.message); }
  };
  $$('#pySeg button').forEach(b => b.onclick = () => { PY.view = b.dataset.v; PY.page = 0; PY.sel = null; $('#pyDrawer').hidden = true; $$('#pySeg button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); load(); });
  let t = 0; $('#pyQ').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { PY.q = e.target.value; PY.page = 0; load(); }, 300); });
  $('#pyAdd').onclick = () => globalAddPayment();
  load();
}

function openQueueDrawer(r, reload) {
  if (!r) return;
  PY.sel = r.id; $$('#pyBody .nx-tr').forEach(tr => tr.classList.toggle('sel', tr.dataset.id === r.id));
  const p = r.nex_payments || {}, e = r.nex_enrolments || {}, s = e.nex_students || null;
  const d = $('#pyDrawer'); d.hidden = false;
  d.innerHTML = '<div class="nx-card"><div class="nx-card-h"><h3>' + esc(s ? fullName(s) : (p.payer_name || 'Payment')) + '</h3><button class="nx-btn quiet icon" id="pdX" aria-label="Close">' + ico('x') + '</button></div><div class="nx-card-b" style="display:flex;flex-direction:column;gap:14px">' +
    '<div><div class="nx-lbl">Payment</div><div class="nx-big">' + money(p.amount) + '</div><div class="nx-muted">' + esc(fmtDate(p.paid_on)) + (p.method ? ' · ' + esc(p.method) : '') + (p.reference ? ' · ' + esc(p.reference) : '') + '</div></div>' +
    (e.fee ? '<div class="nx-muted">Agreed fee ' + money(e.fee) + (Number(p.amount) < Number(e.fee) ? ' · this payment is ' + money(Number(e.fee) - Number(p.amount)) + ' short' : '') + '</div>' : '') +
    '<div><label class="nx-lbl" for="pdQs">Queue status</label><select class="nx-sel" id="pdQs">' + selectOpts(opts('payment_queue', true), r.queue_status, 'Not set') + '</select></div>' +
    '<div><label class="nx-lbl" for="pdSt">Processing step</label><select class="nx-sel" id="pdSt">' + selectOpts(opts('processing', true), r.processing_step) + '</select></div>' +
    '<div><label class="nx-lbl" for="pdAs">Assigned to</label><select class="nx-sel" id="pdAs">' + selectOpts(REF.staff, r.assigned_to, 'Nobody') + '</select></div>' +
    '<div><label class="nx-lbl" for="pdNote">Note</label><textarea class="nx-ta" id="pdNote">' + esc(r.note || '') + '</textarea></div>' +
    '<div class="nx-btnrow"><button class="nx-btn primary" id="pdSave">Save</button>' + (s ? '<a class="nx-btn" href="#/students/' + s.id + '">Open student</a>' : '<button class="nx-btn" id="pdLink">Link to student</button>') + '</div><div class="nx-err" id="pdErr"></div></div></div>';
  $('#pdX').onclick = () => { d.hidden = true; PY.sel = null; $$('#pyBody .nx-tr').forEach(tr => tr.classList.remove('sel')); };
  $('#pdSave').onclick = async () => {
    try { await upd('nex_payment_queue', 'id=eq.' + r.id, { queue_status: $('#pdQs').value || null, processing_step: $('#pdSt').value || null, assigned_to: $('#pdAs').value || null, note: $('#pdNote').value.trim() || null, updated_by: ME.name }); toast('Saved'); d.hidden = true; PY.sel = null; render(); }
    catch (err) { $('#pdErr').textContent = err.message; }
  };
  const lk = $('#pdLink'); if (lk) lk.onclick = () => linkPayment(p, r);
}

function linkPayment(p, queueRow) {
  if (!p) return;
  pickStudent('Link payment to a student', async st => {
    try {
      const en = await sel('nex_enrolments', 'select=id,qualification_id,year,stage&student_id=eq.' + st.id + '&deleted_at=is.null&order=enrolled_on.desc.nullslast');
      const finish = async enrId => {
        await upd('nex_payments', 'id=eq.' + p.id, { student_id: st.id, enrolment_id: enrId });
        if (queueRow) await upd('nex_payment_queue', 'id=eq.' + queueRow.id, { enrolment_id: enrId, updated_by: ME.name });
        toast('Linked to ' + fullName(st)); render();
      };
      if (en.length <= 1) return finish(en[0] ? en[0].id : null);
      const m = openModal({ title: 'Which enrolment?', footer: false, body: '<div class="nx-sel-opt">' + en.map(e => '<button type="button" class="nx-pick" data-id="' + e.id + '"><span><b>' + esc(qualName(e.qualification_id) || 'Enrolment') + '</b><small>' + esc(e.year || '') + ' · ' + esc(statusLabel('enrolment', e.stage)) + '</small></span><span class="nx-tag">Choose</span></button>').join('') + '</div>' });
      $$('.nx-pick', m.el).forEach(b => b.onclick = async () => { m.close(); try { await finish(b.dataset.id); } catch (err) { toast(err.message, true); } });
    } catch (err) { toast(err.message, true); }
  }, p.payer_name || '');
}

function globalAddPayment() {
  pickStudent('Who is the payment for?', async st => {
    const en = await sel('nex_enrolments', 'select=*&student_id=eq.' + st.id + '&deleted_at=is.null&order=enrolled_on.desc.nullslast');
    if (en.length <= 1) return paymentForm({ student: st, enrolment: en[0] });

function bindFirstAid(cur, books) {
  const view = $('#view');
  if ($('#faNew')) $('#faNew').onclick = () => classForm(null);
  if ($('#faJump')) $('#faJump').onclick = () => formModal('Go to a past class', [{ k: 'd', label: 'Class date', type: 'date', required: true }], async v => {
    const r = await sel('nex_class_sessions', 'select=id&class_date=eq.' + v.d + '&limit=1'); if (!r[0]) throw new Error('No class on that date.'); go('#/firstaid/' + r[0].id); }, 'Go');
  if (!cur) return;
  $$('#faDays .nx-day').forEach(b => b.onclick = () => go('#/firstaid/' + b.dataset.id));
  $('#faEdit').onclick = () => classForm(cur);
  $('#faAdd').onclick = () => bookingForm(cur, null, books);
  $$('#faSeats .nx-seat').forEach(b => b.onclick = () => { const n = Number(b.dataset.seat); const ex = books.find(x => x.seat_no === n && x.status !== 'cancelled'); bookingForm(cur, ex || null, books, n); });
  $$('[data-edit]').forEach(b => b.onclick = e => { e.stopPropagation(); bookingForm(cur, books.find(x => x.id === b.dataset.edit), books); });
}

function classForm(c) {
  c = c || {};
  const f = [{ k: 'class_date', label: 'Class date', type: 'date', value: c.class_date, required: true }, { k: 'kind', label: 'Type', type: 'select', options: [{ id: 'full', label: 'Full class (First Aid and CPR)' }, { id: 'renewal', label: 'Renewal and signature' }], value: c.kind || 'full' },
    { k: 'trainer', label: 'Trainer', value: c.trainer }, { k: 'seats', label: 'Seats', type: 'number', value: c.seats || 50, required: true },
    { k: 'start_time', label: 'Starts', type: 'time', value: c.start_time }, { k: 'end_time', label: 'Ends', type: 'time', value: c.end_time }, { k: 'note', label: 'Note', type: 'textarea', value: c.note, full: true }];
  return formModal(c.id ? 'Edit class day' : 'New class day', f, async v => {
    if (c.id) { await upd('nex_class_sessions', 'id=eq.' + c.id, v); toast('Saved'); render(); }
    else { const s = await ins('nex_class_sessions', v); toast('Class added'); go('#/firstaid/' + s.id); }
  });
}

function bookingForm(cur, b, books, seat) {
  b = b || {}; let studentId = b.student_id || null;
  const takenBy = n => books.find(x => x.seat_no === n && x.status !== 'cancelled' && x.id !== b.id);
  const f = [{ k: 'name', label: 'Name', value: b.name, required: true }, { k: 'phone', label: 'Phone', type: 'tel', value: b.phone }, { k: 'email', label: 'Email', type: 'email', value: b.email },
    { k: 'seat_no', label: 'Seat', type: 'number', value: b.seat_no || seat || '', help: 'Leave empty for the waiting list' },
    { k: 'booking_type', label: 'Booking type', type: 'select', options: [{ id: 'student', label: 'Student' }, { id: 'walk_in', label: 'Walk-in' }, { id: 'agent_group', label: 'Agent group' }], value: b.booking_type || 'student' },
    { k: 'agent_id', label: 'Agent', type: 'select', options: REF.agents.filter(a => a.active), value: b.agent_id, blank: 'None' },
    { k: 'status', label: 'Status', type: 'select', options: opts('booking', true), value: b.status || 'booked', blank: 'Not set' },
    { k: 'quiz_sent', label: 'Quiz link sent', type: 'check', value: b.quiz_sent }, { k: 'quiz_done', label: 'Quiz done', type: 'check', value: b.quiz_done }, { k: 'paid', label: 'Paid', type: 'check', value: b.paid }];
  if (cur.kind === 'renewal') f.push({ k: 'signature_done', label: 'Signature done', type: 'check', value: b.signature_done });
  f.push({ k: 'note', label: 'Note', type: 'textarea', value: b.note, full: true });
  const top = b.id ? '' : '<div style="margin-bottom:14px"><button type="button" class="nx-btn" id="bkFind">' + ico('search') + 'Find an existing student</button><div class="nx-help">Walk-ins and agent groups can be typed in directly without a student record.</div></div>';
  const m = formModal(b.id ? 'Edit booking' : 'Add booking', f, async v => {
    if (v.seat_no != null) { v.seat_no = Math.round(v.seat_no); if (v.seat_no < 1 || v.seat_no > cur.seats) throw new Error('Seat must be between 1 and ' + cur.seats + '.'); const t = takenBy(v.seat_no); if (t) throw new Error('Seat ' + v.seat_no + ' is already taken by ' + t.name + '.'); }
    if (v.phone) v.phone = cleanPhone(v.phone) || v.phone; if (v.email) v.email = v.email.toLowerCase();
    if (v.status === 'cancelled') v.seat_no = null;
    try {
      if (b.id) await upd('nex_class_bookings', 'id=eq.' + b.id, Object.assign(v, { student_id: studentId }));
      else await ins('nex_class_bookings', Object.assign({ session_id: cur.id, student_id: studentId, created_by: ME.name }, v), true);
    } catch (e) { if (/duplicate|unique/i.test(e.message)) throw new Error('That seat was just taken. Choose another.'); throw e; }
    toast('Booking saved'); render();
  }, 'Save booking', top);
  if (b.id) {
    const foot = $('.modal-f', m.el); const cb = document.createElement('button'); cb.className = 'nx-btn'; cb.style.marginRight = 'auto'; cb.textContent = 'Cancel booking';
    cb.onclick = async () => { try { await upd('nex_class_bookings', 'id=eq.' + b.id, { status: 'cancelled', seat_no: null }); m.close(); toast('Booking cancelled'); render(); } catch (e) { showErr(m, e); } };
    foot.prepend(cb);
  } else {
    const fb = $('#bkFind', m.el);
    if (fb) fb.onclick = () => pickStudent('Find a student', s => { studentId = s.id; $('#f_name', m.el).value = fullName(s); $('#f_phone', m.el).value = s.phone || ''; $('#f_email', m.el).value = s.email || ''; $('#f_booking_type', m.el).value = 'student'; toast('Student attached: ' + fullName(s)); });
  }
}

/* =========================================================
   Two-step login, Nex side. The 6-digit code is asked in Nexus (it holds the refresh token that a code
   check swaps), so Nex never confirms codes itself. It only (1) refuses to open without a code-verified
   session when the switch is on, and (2) shows the admin card: switch, who has set up, reset.
   The database enforces the rule (nex_open() needs aal2), this file only explains it.
   ========================================================= */
function aalNow() { const c = tokenPayload(ss.get('nex_sb_at')); return (c && c.aal) || 'aal1'; }
async function authApi(path) {
  const r = await fetch(SB + '/auth/v1/' + path, { headers: { apikey: KEY, Authorization: 'Bearer ' + await bearer() } });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error((j && (j.msg || j.message)) || ('Request failed (' + r.status + ')')); e.status = r.status; throw e; }
  return j;
}
async function mfaList() { const u = await authApi('user'); return ((u && u.factors) || []).filter(f => f.factor_type === 'totp' && f.status === 'verified'); }
/* runs once before the app is drawn; never resolves when a code is needed and missing */
function mfaGate() {
  return new Promise(async resolve => {
    try {
      const st = await (await api('rpc/nex_mfa_state', { method: 'POST', body: {} })).json();
      if (st && st.required && aalNow() !== 'aal2') {
        const box = $('#mfa'), card = $('#mfaCard');
        card.innerHTML = '<div class="gate-t mfa-t">Enter your code in Nexus</div><p class="mfa-p">Nex needs your 6-digit code. Go back to Nexus, open the Nex card on the Nodes page, and enter the code from your authenticator app (or set it up if this is your first time).</p>';
        box.hidden = false; return;
      }
    } catch (e) { if (e.message === 'session') return; }
    resolve(true);
  });
}

/* ---------- Admin page card ---------- */
function secCard() {
  return '<div class="nx-card"><div class="nx-card-h"><div><h3>Two-step login</h3><div class="nx-muted">A 6-digit code from an authenticator app, asked in Nexus once per sign-in when a person opens Nex.</div></div></div><div id="adSec" class="nx-card-b"><div class="nx-skel" style="width:50%"></div></div></div>';
}
async function bindSec() {
  const box = $('#adSec'); if (!box) return;
  try {
    const st = await (await api('rpc/nex_mfa_state', { method: 'POST', body: {} })).json();
    const mine = (await mfaList())[0] || null, strong = aalNow() === 'aal2';
    let h = '<div class="nx-row-s"><div><b>Your account</b><div class="nx-muted">' + (mine ? 'Two-step login is set up for you.' : 'Not set up yet. Open Nex from the Nexus Nodes page to set it up.') + '</div></div></div>';
    if (ME.admin) {
      let roster = [];
      try { roster = await (await api('rpc/nex_mfa_roster', { method: 'POST', body: {} })).json(); } catch (e) {}
      const unset = roster.filter(r => !r.enrolled).length;
      h += '<hr class="nx-hr"><div class="nx-row-s"><div><b>Required for everyone: ' + (st.required ? 'On' : 'Off') + '</b><div class="nx-muted">' +
        (st.required ? 'Nex shows nothing to anyone who has not entered a code this sign-in.' : (mine && strong ? 'Once you turn this on, each person is walked through setup when they next open Nex from Nexus.' + (unset ? ' ' + unset + ' of ' + roster.length + ' have not set up yet.' : '') : 'Set up your own code first (open Nex from Nexus), then you can turn this on.')) +
        '</div></div><div class="nx-btnrow"><button class="nx-btn ' + (st.required ? '' : 'primary') + ' sm" id="secReq"' + (!st.required && !(mine && strong) ? ' disabled' : '') + '>' + (st.required ? 'Turn off' : 'Require for everyone') + '</button></div></div>';
      h += roster.length ? '<div class="nx-tablewrap" style="margin-top:10px"><table class="nx-table auto tight"><thead><tr><th>Staff member</th><th>Code</th><th></th></tr></thead><tbody>' +
        roster.map(r => '<tr><td>' + esc(r.staff_name) + '</td><td>' + (r.enrolled ? '<span class="nx-pill ok">Set up</span>' : '<span class="nx-pill">Not yet</span>') + '</td><td>' + (r.enrolled && r.staff_name !== ME.name ? '<button class="nx-btn sm" data-reset="' + esc(r.staff_name) + '">Reset</button>' : '') + '</td></tr>').join('') + '</tbody></table></div>' : '';
    }
    box.innerHTML = h;
    const again = () => bindSec();
    if ($('#secReq')) $('#secReq').onclick = async () => {
      const on = !st.required;
      if (!await confirmBox(on ? 'Require the 6-digit code for everyone?' : 'Stop requiring the code?', on ? 'Each person sets up an authenticator app the next time they open Nex from Nexus (about a minute). Until they do, they see nothing in Nex.' : 'Nex goes back to protecting student data with passwords only.', on ? 'Require it' : 'Turn off', !on)) return;
      try { await api('rpc/nex_set_mfa_required', { method: 'POST', body: { p_on: on } }); toast(on ? 'Required for everyone' : 'No longer required'); } catch (e) { toast(e.message, true); }
      again();
    };
    $$('[data-reset]', box).forEach(b => b.onclick = async () => {
      const who = b.dataset.reset;
      if (!await confirmBox('Reset ' + who + '\'s code?', 'Use this when they have lost their phone. They set up a new code the next time they open Nex from Nexus.', 'Reset', true)) return;
      try { await api('rpc/nex_admin_reset_mfa', { method: 'POST', body: { p_staff: who } }); toast('Reset'); } catch (e) { toast(e.message, true); }
      again();
    });
  } catch (e) { if (e.message !== 'session') box.innerHTML = empty('Could not load', e.message); }
}
