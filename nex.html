<style>
/* Nex design system v0.1 — "Quiet ledger"
   Light, warm-neutral surfaces, one deep-blue accent, status colours that always pair a tint with a dark label. */
:root{
  --nx-bg:#eef3fa; --nx-surface:#ffffff; --nx-sunken:#f5f8fc; --nx-hover:#f0f5fc;
  --nx-line:#dbe3ef; --nx-line-strong:#c0cce0;
  --nx-ink:#101a2e; --nx-ink-2:#3b4863; --nx-ink-3:#56637f;
  --nx-shell:#0b1f4b; --nx-shell-ink:#e8effc; --nx-shell-dim:#9fb4dc;
  --nx-accent:#1559d6; --nx-accent-hover:#0f46ac; --nx-accent-weak:#e4edfc; --nx-accent-line:#a9c3f1;
  --nx-ok:#1c7343; --nx-ok-weak:#e2f3e8; --nx-warn:#8a4f00; --nx-warn-weak:#fbefd9;
  --nx-bad:#a8271f; --nx-bad-weak:#fae7e4; --nx-info:#2f4f9c; --nx-info-weak:#e6ebf8; --nx-mute-weak:#e9eef7;
  --nx-r:6px; --nx-r-lg:10px;
  --nx-shadow:0 1px 2px rgba(16,26,46,.06),0 1px 1px rgba(16,26,46,.04);
  --nx-shadow-pop:0 8px 24px rgba(16,26,46,.14),0 2px 6px rgba(16,26,46,.08);
  --nx-font:"Inter","Inter Fallback",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --nx-display:var(--nx-font);
}
*{box-sizing:border-box}html,body{margin:0}
.nx{font-family:var(--nx-font);font-size:13px;line-height:1.45;color:var(--nx-ink);background:var(--nx-bg);min-height:100%;-webkit-font-smoothing:antialiased}
.nx a{color:var(--nx-accent);text-decoration:none}
.nx a:hover{text-decoration:underline}
.nx h1,.nx h2,.nx h3{margin:0;font-family:var(--nx-display);font-weight:600;letter-spacing:-.01em}
.nx svg{flex:none}
.nx-ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nx-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.nx-top{display:flex;align-items:center;gap:20px;height:52px;padding:0 var(--nx-gutter);background:var(--nx-shell);color:var(--nx-shell-ink)}
.nx-brand{display:flex;align-items:center;gap:10px;font-family:var(--nx-display);font-weight:600;font-size:17px;color:#fff!important;text-decoration:none!important}
.nx-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:#5aa9ff;color:#071a44;font-family:var(--nx-display);font-weight:700;font-size:15px}
.nx-search{flex:1;max-width:520px;position:relative;margin:0 auto 0 12px}
.nx-search input{width:100%;height:34px;padding:0 12px 0 34px;border:1px solid #2a427c;border-radius:var(--nx-r);background:#162b5e;color:#fff;font:inherit}
.nx-search input::placeholder{color:var(--nx-shell-dim)}
.nx-search input:focus{outline:2px solid #5aa9ff;outline-offset:1px}
.nx-search .nx-ico{position:absolute;left:10px;top:9px;color:var(--nx-shell-dim)}
.nx-lock{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:99px;background:#162b5e;border:1px solid #2a427c;font-size:12px;color:var(--nx-shell-ink)}
.nx-lock i{width:8px;height:8px;border-radius:50%;background:#4fd08a;box-shadow:0 0 0 3px rgba(79,208,138,.2)}
.nx-avatar{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;background:var(--nx-accent-weak);color:var(--nx-accent);font-weight:600;font-size:12px;border:1px solid var(--nx-accent-line)}
.nx-top .nx-avatar{background:#5aa9ff;color:#071a44;border:0}
.nx-nav{display:flex;gap:2px;padding:0 16px;background:var(--nx-surface);border-bottom:1px solid var(--nx-line);overflow-x:auto}
.nx-nav a{position:relative;display:flex;align-items:center;height:44px;padding:0 14px;color:var(--nx-ink-2);font-weight:500;white-space:nowrap}
.nx-nav a:hover{color:var(--nx-ink);background:var(--nx-hover);text-decoration:none}
.nx-nav a[aria-current="page"]{color:var(--nx-accent);font-weight:600}
.nx-nav a[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--nx-accent)}
.nx-count{margin-left:8px;padding:0 6px;border-radius:99px;background:var(--nx-mute-weak);color:var(--nx-ink-2);font-size:11px;font-weight:600;line-height:18px}

/* ---------- page ---------- */
.nx-main{width:100%;margin:0;padding:16px var(--nx-gutter) 40px;display:flex;flex-direction:column;gap:12px}
.nx-card{background:var(--nx-surface);border:1px solid var(--nx-line);border-radius:var(--nx-r-lg);box-shadow:var(--nx-shadow)}
.nx-card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--nx-line)}
.nx-card-h h3{font-size:15px}
.nx-card-b{padding:16px}
.nx-pagehead{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 16px}
.nx-objico{display:grid;place-items:center;width:40px;height:40px;border-radius:9px;background:var(--nx-accent);color:#fff}
.nx-objico .nx-ico{width:20px;height:20px}
.nx-eyebrow{font-size:12px;color:var(--nx-ink-3);font-weight:500}
.nx-title{font-size:24px;letter-spacing:-.02em;line-height:1.15;display:flex;align-items:center;gap:6px}
.nx-grow{flex:1}
.nx-muted{color:var(--nx-ink-3)}
.nx-crumbs{display:flex;gap:6px;align-items:center;color:var(--nx-ink-3);font-size:12px}

/* ---------- buttons ---------- */
.nx-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--nx-line-strong);border-radius:var(--nx-r);background:var(--nx-surface);color:var(--nx-ink);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.nx-btn:hover{background:var(--nx-hover);text-decoration:none}
.nx-btn:focus-visible,.nx-tab:focus-visible,.nx-seat:focus-visible,.nx-chip:focus-visible,.nx-seg button:focus-visible{outline:2px solid var(--nx-accent);outline-offset:2px}
.nx-btn.primary{background:var(--nx-accent);border-color:var(--nx-accent);color:#fff;font-weight:600}
.nx-btn.primary:hover{background:var(--nx-accent-hover)}
.nx-btn.quiet{border-color:transparent;background:transparent;color:var(--nx-ink-2)}
.nx-btn.quiet:hover{background:var(--nx-mute-weak)}
.nx-btn.icon{width:32px;padding:0}
.nx-btn.sm{height:26px;padding:0 9px;font-size:12px}
.nx-btnrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- pills, chips, segmented ---------- */
.nx-pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--nx-mute-weak);color:var(--nx-ink-2)}
.nx-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.nx-pill.ok{background:var(--nx-ok-weak);color:var(--nx-ok)}
.nx-pill.warn{background:var(--nx-warn-weak);color:var(--nx-warn)}
.nx-pill.bad{background:var(--nx-bad-weak);color:var(--nx-bad)}
.nx-pill.info{background:var(--nx-info-weak);color:var(--nx-info)}
.nx-pill.accent{background:var(--nx-accent-weak);color:var(--nx-accent)}
.nx-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--nx-line-strong);border-radius:var(--nx-r);background:var(--nx-surface);color:var(--nx-ink-2);font:inherit;font-size:12px;font-weight:500;cursor:pointer}
.nx-chip:hover{background:var(--nx-hover)}
.nx-chip[aria-pressed="true"]{background:var(--nx-accent-weak);border-color:var(--nx-accent-line);color:var(--nx-accent)}
.nx-seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--nx-mute-weak);gap:2px;flex-wrap:wrap}
.nx-seg button{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--nx-ink-2);font:inherit;font-weight:500;cursor:pointer}
.nx-seg button[aria-pressed="true"]{background:var(--nx-surface);color:var(--nx-ink);box-shadow:var(--nx-shadow);font-weight:600}
.nx-seg .nx-count{background:var(--nx-surface);margin-left:0}

/* ---------- table ---------- */
.nx-tablewrap{overflow-x:auto}
.nx-table{width:100%;border-collapse:separate;border-spacing:0;min-width:1040px}
.nx-table th{position:sticky;top:0;height:36px;padding:0 12px;text-align:left;font-size:12px;font-weight:600;color:var(--nx-ink-3);background:var(--nx-sunken);border-bottom:1px solid var(--nx-line);white-space:nowrap}
.nx-table td{height:56px;padding:0 12px;border-bottom:1px solid var(--nx-line);vertical-align:middle}
.nx-table tr:last-child td{border-bottom:0}
.nx-table tbody tr:hover td{background:var(--nx-hover)}
.nx-table tr.sel td{background:var(--nx-accent-weak)}
.nx-table .w-check{width:44px;padding-left:16px}
.nx-table input[type=checkbox]{width:16px;height:16px;accent-color:var(--nx-accent);cursor:pointer}
.nx-who{display:flex;align-items:center;gap:10px;min-width:0}
.nx-who b{display:block;font-weight:600}
.nx-who span{display:block;color:var(--nx-ink-3);font-size:12px}
.nx-num{font-variant-numeric:tabular-nums}
.nx-bulk{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--nx-accent);color:#fff;border-radius:var(--nx-r-lg) var(--nx-r-lg) 0 0}
.nx-bulk .nx-btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.nx-bulk .nx-btn:hover{background:rgba(255,255,255,.24)}
.nx-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--nx-line);color:var(--nx-ink-3);font-size:12px}
.nx-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--nx-line)}

/* ---------- meters ---------- */
.nx-meter{width:120px}
.nx-meter-bar{height:6px;border-radius:99px;background:var(--nx-mute-weak);overflow:hidden}
.nx-meter-bar i{display:block;height:100%;border-radius:99px;background:var(--nx-accent)}
.nx-meter-bar i.warn{background:#c47a12}
.nx-meter small{display:block;margin-top:4px;color:var(--nx-ink-3);font-size:11px}

/* ---------- stage path ---------- */
.nx-path{display:flex;list-style:none;margin:0;padding:0;gap:0}
.nx-path li{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 20px 0 26px;background:var(--nx-mute-weak);color:var(--nx-ink-2);font-weight:600;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);margin-left:-6px}
.nx-path li:first-child{margin-left:0;padding-left:16px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%)}
.nx-path li.done{background:var(--nx-accent-weak);color:var(--nx-accent)}
.nx-path li.now{background:var(--nx-accent);color:#fff}
.nx-path .nx-ico{width:14px;height:14px;stroke-width:2.2}
.nx-mini{display:flex;gap:3px}
.nx-mini i{width:14px;height:5px;border-radius:3px;background:var(--nx-line-strong)}
.nx-mini i.on{background:var(--nx-accent)}

/* ---------- record page ---------- */
.nx-hl{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;padding:16px}
.nx-hl .nx-avatar{width:52px;height:52px;font-size:18px;font-family:var(--nx-display)}
.nx-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 24px;flex:1;min-width:300px}
.nx-facts dt,.nx-field dt{font-size:12px;color:var(--nx-ink-3);font-weight:500;margin-bottom:2px}
.nx-facts dd,.nx-field dd{margin:0;font-weight:500}
.nx-cols{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.nx-colmain{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:12px}
.nx-colside{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:12px}
.nx-tabs{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--nx-line);overflow-x:auto}
.nx-tab{position:relative;height:42px;padding:0 12px;border:0;background:transparent;color:var(--nx-ink-2);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.nx-tab:hover{color:var(--nx-ink)}
.nx-tab[aria-selected="true"]{color:var(--nx-accent);font-weight:600}
.nx-tab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--nx-accent)}
.nx-sec{border-bottom:1px solid var(--nx-line)}
.nx-sec:last-child{border-bottom:0}
.nx-sec-h{display:flex;align-items:center;gap:8px;width:100%;padding:12px 16px;border:0;background:var(--nx-sunken);font:inherit;font-weight:600;color:var(--nx-ink);cursor:pointer;text-align:left}
.nx-sec-h .nx-ico{transition:transform .15s}
.nx-sec-h[aria-expanded="false"] .nx-ico{transform:rotate(-90deg)}
.nx-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px 32px;padding:16px;margin:0}
.nx-field{margin:0}
.nx-note{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--nx-info-weak);color:var(--nx-info);font-size:12px;font-weight:500}
.nx-feed{list-style:none;margin:0;padding:4px 16px 8px}
.nx-feed li{position:relative;display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--nx-line)}
.nx-feed li:last-child{border-bottom:0}
.nx-feed .dot{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:var(--nx-accent-weak);color:var(--nx-accent)}
.nx-feed .dot .nx-ico{width:14px;height:14px}
.nx-feed .dot.warn{background:var(--nx-warn-weak);color:var(--nx-warn)}
.nx-feed .dot.info{background:var(--nx-info-weak);color:var(--nx-info)}
.nx-feed b{font-weight:600}
.nx-feed time{display:block;color:var(--nx-ink-3);font-size:12px}
.nx-related{display:flex;flex-direction:column}
.nx-related > div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--nx-line)}
.nx-related > div:last-child{border-bottom:0}
.nx-related small{display:block;color:var(--nx-ink-3);font-size:12px}
.nx-big{font-family:var(--nx-display);font-size:26px;font-weight:600;letter-spacing:-.02em}

/* ---------- payments queue ---------- */
.nx-split{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.nx-split > .nx-card:first-child{flex:999 1 640px;min-width:0}
.nx-drawer{flex:1 1 360px;min-width:0;position:sticky;top:12px}
.nx-steps{display:flex;gap:3px;align-items:center}
.nx-steps i{width:18px;height:6px;border-radius:3px;background:var(--nx-line-strong)}
.nx-steps i.on{background:var(--nx-accent)}
.nx-steps i.part{background:var(--nx-accent-line)}
.nx-match{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--nx-line);border-radius:var(--nx-r);background:var(--nx-surface)}
.nx-match.best{border-color:var(--nx-accent-line);background:var(--nx-accent-weak)}
.nx-why{display:flex;flex-wrap:wrap;gap:6px}
.nx-why span{height:20px;padding:0 8px;border-radius:4px;background:var(--nx-surface);border:1px solid var(--nx-line);font-size:11px;font-weight:600;color:var(--nx-ink-2);line-height:18px}
.nx-why span.hit{background:var(--nx-ok-weak);border-color:transparent;color:var(--nx-ok)}
.nx-tr{cursor:pointer}

/* ---------- first aid seat map ---------- */
.nx-days{display:flex;gap:8px;flex-wrap:wrap}
.nx-day{display:flex;flex-direction:column;gap:2px;min-width:112px;padding:8px 12px;border:1px solid var(--nx-line-strong);border-radius:var(--nx-r);background:var(--nx-surface);font:inherit;text-align:left;cursor:pointer}
.nx-day[aria-pressed="true"]{border-color:var(--nx-accent);box-shadow:inset 0 0 0 1px var(--nx-accent);background:var(--nx-accent-weak)}
.nx-day b{font-family:var(--nx-display);font-size:15px}
.nx-day span{font-size:12px;color:var(--nx-ink-3)}
.nx-cap{height:10px;border-radius:99px;background:var(--nx-mute-weak);overflow:hidden;display:flex}
.nx-cap i{display:block;height:100%}
.nx-cap .a{background:var(--nx-accent)}
.nx-cap .b{background:var(--nx-accent-line)}
.nx-day-plan{display:grid;grid-template-columns:2fr 5fr 1fr;gap:3px}
.nx-day-plan div{padding:8px 10px;border-radius:var(--nx-r);background:var(--nx-mute-weak);font-size:12px;font-weight:600;color:var(--nx-ink-2)}
.nx-day-plan div small{display:block;font-weight:500;color:var(--nx-ink-3)}
.nx-day-plan div:nth-child(2){background:var(--nx-accent-weak);color:var(--nx-accent)}
.nx-seats{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
.nx-seat{position:relative;display:grid;place-items:center;height:44px;border:1.5px solid var(--nx-line-strong);border-radius:var(--nx-r);background:var(--nx-surface);color:var(--nx-ink-2);font:inherit;font-size:12px;font-weight:600;cursor:default}
.nx-seat.booked{background:var(--nx-accent-weak);border-color:var(--nx-accent-line);color:var(--nx-accent)}
.nx-seat.here{background:var(--nx-accent);border-color:var(--nx-accent);color:#fff}
.nx-seat.walk{border-style:dashed;border-color:var(--nx-info);background:var(--nx-info-weak);color:var(--nx-info)}
.nx-seat.pick{box-shadow:0 0 0 3px var(--nx-surface),0 0 0 5px var(--nx-ink)}
.nx-legend{display:flex;flex-wrap:wrap;gap:16px;color:var(--nx-ink-2);font-size:12px}
.nx-legend span{display:flex;align-items:center;gap:6px}
.nx-legend i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--nx-line-strong);background:var(--nx-surface)}

.nx-eyebrow{font-size:13px}

.nx-main{gap:16px;padding-top:20px}

.nx-card-b{padding:20px}
.nx-toolbar{padding:12px 20px}
.nx-table th,.nx-table td{padding:0 14px}
.nx-table th:first-child,.nx-table td:first-child{padding-left:20px}
.nx-stack,.nx-colside{gap:16px}
.nx-two,.nx-cols,.nx-split{gap:16px}
.nx-btn{height:36px;padding:0 18px;border-radius:var(--nx-r);border:1.5px solid var(--nx-accent);background:transparent;color:var(--nx-accent);font-weight:700}
.nx-btn:hover{background:var(--nx-accent-weak)}

.nx-list li,.nx-related > div,.nx-att,.nx-sec-h,.nx-note,.nx-foot,.nx-flaglegend{padding-left:20px;padding-right:20px}
.nx-feed{padding:4px 20px 8px}
.nx-tiplist{padding:4px 20px 10px}
.nx-fields,.nx-hl{padding:20px}
.nx-tabs{padding:0 12px}
.nx-empty-s{padding:14px 20px}

/* ---------- 15 Nov 2026: loading order, pills, press feedback, logo ---------- */
[hidden]{display:none!important}

/* Loading order. A page is built off screen and shown once its first data is in, top to bottom in one step.
   The heading is already on screen (from the placeholder or the page before), so only the content below it fades. */
.nx-main.nx-enter>*:not(.nx-pagehead){animation:nxfade .18s var(--nx-ease) both}
.nx-main.nx-enter .nx-meter-bar i,.nx-main.nx-enter .nx-cap i{transform-origin:left center;animation:nxgrow .4s var(--nx-ease) both}
#viewSkel{animation:nxfade .14s ease-out both}
#viewSkel .nx-avatar{background:var(--nx-mute-weak);border-color:transparent}
.nx-skrow{display:flex;align-items:center;height:56px;padding:0 20px;border-bottom:1px solid var(--nx-line)}
.nx-skrow:last-child{border-bottom:0}
.nx-skel{border-radius:6px}
.nx-reloading{opacity:.5;pointer-events:none;transition:opacity .12s ease-out}
/* a pager with nowhere to go, or a footer with nothing to say, is not shown */
.nx-foot .nx-btnrow:not(:has(button:not(:disabled))){display:none}
.nx-foot:has(>span:first-child:empty):not(:has(button:not(:disabled))){display:none}

/* Pills. One system: status pills carry a dot, tags do not, counts are round. All sit on the text baseline at one height. */
.nx-pill{height:24px;padding:0 10px 0 9px;gap:6px;font-family:var(--nx-font);font-size:12px;font-weight:600;line-height:1;letter-spacing:0;vertical-align:middle;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 18%,transparent)}
.nx-pill::before{width:6px;height:6px;opacity:1;flex:none}
.nx-who .nx-pill{display:inline-flex;height:20px;padding:0 8px 0 7px;margin-left:6px;font-size:11px;color:var(--nx-ink-2)}
.nx-who .nx-pill.accent{color:var(--nx-accent)}
.nx-who .nx-pill.info{color:var(--nx-info)}
.nx-title .nx-pill{margin-left:8px}
.nx-tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;font-size:12px;line-height:1;vertical-align:middle;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 14%,transparent)}
.nx-count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;line-height:1;font-variant-numeric:tabular-nums}
.nx-count:empty{display:none}
.nx-stagecell{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.nx-flag{border-radius:6px}

/* Press feedback. Controls answer on press, not release: the pressed state snaps in (60ms) and eases back out. */
.nx-btn,.nx-chip,.nx-seg button,.nx-tab,.nx-nav a,.nx-att,.nx-day,.nx-pick{-webkit-tap-highlight-color:transparent}
.nx-btn{user-select:none;transition:background-color .16s var(--nx-ease),border-color .16s var(--nx-ease),color .16s var(--nx-ease),box-shadow .2s var(--nx-ease),transform .3s cubic-bezier(.2,.8,.2,1),opacity .16s}
.nx-btn .nx-ico{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.nx-btn:hover:not(:disabled) .nx-ico{transform:scale(1.12)}
.nx-btn:not(.primary):not(.quiet):hover:not(:disabled){background:var(--nx-accent-weak);border-color:var(--nx-accent-hover);color:var(--nx-accent-hover)}
.nx-btn.primary:hover:not(:disabled){background:var(--nx-accent-hover);border-color:var(--nx-accent-hover);box-shadow:0 4px 12px rgba(21,89,214,.24);transform:translateY(-1px)}
.nx-btn.is-down:not(:disabled),.nx-btn:active:not(:disabled){transform:scale(.96);transition-duration:.06s}
.nx-btn.primary.is-down:not(:disabled),.nx-btn.primary:active:not(:disabled){background:#0c3a94;border-color:#0c3a94;box-shadow:none;transform:scale(.96)}
.nx-btn:not(.primary):not(.quiet).is-down:not(:disabled){background:var(--nx-accent-line)}
.nx-btn.quiet.is-down{background:var(--nx-line)}
.nx-btn:disabled{opacity:.45;cursor:not-allowed}
.nx-seg button,.nx-chip,.nx-day,.nx-pick{transition:background-color .16s var(--nx-ease),color .16s var(--nx-ease),border-color .16s var(--nx-ease),transform .3s cubic-bezier(.2,.8,.2,1)}
.nx-seg button:hover:not([aria-pressed="true"]){background:color-mix(in srgb,var(--nx-surface) 55%,transparent);color:var(--nx-ink)}
.nx-seg button.is-down,.nx-chip.is-down,.nx-day.is-down,.nx-pick.is-down{transform:scale(.97);transition-duration:.06s}
.nx-nav a.is-down,.nx-tab.is-down{background:var(--nx-mute-weak)}
.nx-att>.nx-ico{transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.nx-att:hover>.nx-ico{transform:translateX(3px);color:var(--nx-accent)}
.nx-att.is-down{background:var(--nx-accent-weak)}
.nx-sec-h{cursor:pointer;transition:background-color .16s var(--nx-ease)}
.nx-sec-h:hover{background:var(--nx-mute-weak)}
.nx-sec-h.is-down{background:var(--nx-line)}
.nx-tr{cursor:pointer}
.nx-table tbody tr.nx-tr:active td{background:var(--nx-accent-weak)}
.nx-table tbody tr.nx-tr:hover .nx-who b{color:var(--nx-accent)}

/* Logo: a forward mark (Nex, next), not a letter */
.nx-mark svg{width:19px;height:19px;display:block}
.gate-ic svg{width:32px;height:32px;display:block}


/* ---------- 15 Nov 2026: staff pages copied from Nexus (Quizzes, Documents, Profile, Team report, Nexi) ---------- */
.nx-navsep{flex:none;align-self:center;width:1px;height:20px;margin:0 8px;background:var(--nx-line-strong)}
.nx-me{display:flex;align-items:center;gap:10px;border-radius:99px;color:inherit;text-decoration:none!important}
.nx-me:hover .nx-lock{background:rgba(255,255,255,.12)}
.nx-me:focus-visible{outline:2px solid #5aa9ff;outline-offset:3px}
.nx-avatar.has-photo{background-size:cover;background-position:center;color:transparent}
.nx-right{text-align:right}
.nx-form.three{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.nx-totrow td{font-weight:600;background:var(--nx-sunken)}
.nx-card-h .nx-in.sm{width:auto}

/* quizzes */
.nx-qzprog{display:flex;align-items:center;gap:24px}
.nx-qzprog .nx-meter-bar{flex:1;height:8px}
.nx-qzlist li{align-items:center;padding-top:14px;padding-bottom:14px}
.nx-qz{min-width:0;display:flex;flex-direction:column;gap:2px}
.nx-qz b{font-weight:600}
.nx-qz small{color:var(--nx-ink-3);font-size:12px}
.nx-qztop{display:flex;align-items:center;gap:16px;color:var(--nx-ink-3);font-size:12px;font-weight:500}
.nx-qztop .nx-meter-bar{flex:1}
.nx-qzq{margin:18px 0 14px;font-family:var(--nx-display);font-size:19px;font-weight:500;line-height:1.35;letter-spacing:-.01em;text-wrap:balance}
.nx-qzopts{display:flex;flex-direction:column;gap:8px}
.nx-qzopt{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 14px;border:1.5px solid var(--nx-line-strong);border-radius:var(--nx-r);background:var(--nx-surface);color:var(--nx-ink);font:inherit;text-align:left;cursor:pointer}
.nx-qzopt:hover{border-color:var(--nx-accent-line);background:var(--nx-hover)}
.nx-qzopt i{flex:none;width:18px;height:18px;margin-top:1px;border:1.5px solid var(--nx-line-strong);border-radius:50%;background:var(--nx-surface);transition:border-color .14s var(--nx-ease),box-shadow .14s var(--nx-ease)}
.nx-qzopt[aria-checked="true"]{border-color:var(--nx-accent);background:var(--nx-accent-weak)}
.nx-qzopt[aria-checked="true"] i{border-color:var(--nx-accent);box-shadow:inset 0 0 0 4px var(--nx-accent)}
.nx-qzopt:focus-visible{outline:2px solid var(--nx-accent);outline-offset:2px}
.nx-qzres{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 18px;text-align:center}
.nx-qzres .nx-big{font-size:40px}
.nx-qzres.ok b{color:var(--nx-ok)}.nx-qzres.bad b{color:var(--nx-bad)}
.nx-qzrev{margin:0;padding:0;list-style:none;border-top:1px solid var(--nx-line)}
.nx-qzrev li{padding:12px 0;border-bottom:1px solid var(--nx-line);display:flex;flex-direction:column;gap:2px}
.nx-qzrev li b{font-weight:600}
.nx-qzrev li span{font-size:13px;color:var(--nx-ink-2)}
.nx-qzrev li.bad span:first-of-type{color:var(--nx-bad)}
.nx-qzrev li.ok span{color:var(--nx-ok)}

/* profile */
.nx-hl .nx-pfava{width:72px;height:72px;font-size:24px}

/* team report */
.nx-plsec{margin-bottom:18px}
.nx-plsec h4,.nx-report h3{margin:0 0 8px;font-family:var(--nx-font);font-size:14px;font-weight:600;letter-spacing:0}
.nx-report{padding:20px}
.nx-report h3{margin-top:22px}
.nx-rephead h2{font-size:22px}
.nx-repline{margin:6px 0;color:var(--nx-ink-2)}
.nx-replist{margin:0 0 6px;padding-left:18px;color:var(--nx-ink-2);line-height:1.6}
.nx-report .nx-table{border:1px solid var(--nx-line)}
.nx-report .nx-table td{vertical-align:top;padding-top:8px;padding-bottom:8px;height:auto}

/* Nexi */
.nx-nexifab{position:fixed;right:20px;bottom:20px;z-index:8000;width:52px;height:52px;padding:0;border:1.5px solid var(--nx-line-strong);border-radius:50%;background:#fff;cursor:pointer;overflow:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .16s var(--nx-ease)}
.nx-nexifab:hover{border-color:var(--nx-accent);transform:translateY(-2px)}
.nx-nexifab:active{transform:scale(.94);transition-duration:.06s}
.nx-nexifab:focus-visible{outline:2px solid var(--nx-accent);outline-offset:3px}
.nx-nexifab img{width:100%;height:100%;display:block;image-rendering:pixelated}
.nx-nexi{position:fixed;right:20px;bottom:84px;z-index:8000;width:min(400px,calc(100vw - 24px));max-height:min(620px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--nx-surface);border:1px solid var(--nx-line-strong);border-radius:var(--nx-r-lg,0);box-shadow:var(--nx-shadow-pop);transform-origin:bottom right;animation:nxnexi .2s var(--nx-ease) both}
@keyframes nxnexi{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
.nx-nexi header{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--nx-line)}
.nx-nexi header img{width:36px;height:36px;border-radius:50%;border:1px solid var(--nx-line);background:#fff;image-rendering:pixelated}
.nx-nexi header div{flex:1;min-width:0;display:flex;flex-direction:column}
.nx-nexi header b{font-weight:600}
.nx-nexi header span{color:var(--nx-ink-3);font-size:12px}
.nx-nexibody{padding:6px 16px 18px;overflow:auto}
.nx-nexibody h4{margin:14px 0 8px;font-family:var(--nx-font);font-size:12px;font-weight:600;color:var(--nx-ink-3);letter-spacing:0}
.nx-nexiqs{display:flex;flex-wrap:wrap;gap:6px}
.nx-nexiqs .nx-chip{height:auto;min-height:30px;padding:6px 12px;text-align:left;line-height:1.3;font-size:13px}
.nx-nexiq{margin:14px 0 10px;font-weight:600}
.nx-nexia{padding:12px 14px;border-radius:var(--nx-r);background:var(--nx-accent-weak);color:var(--nx-ink);line-height:1.55;text-wrap:pretty}
.nx-nexia:focus{outline:0}

/* printing the weekly team report: only the report leaves the screen */
@media print{
  .nx-top,.nx-nav,.nx-noprint,.toasts,#modalRoot,body::before{display:none!important}
  body.nx-print-report .nx-main>*:not(.nx-printwrap){display:none!important}
  .nx,.nx-main{background:#fff!important}
  .nx-main{padding:0!important}
  .nx-printwrap{border:0!important}
  .nx-report{padding:0}
  .nx-report h3{break-after:avoid}
  .nx-report .nx-tablewrap{overflow:visible}
}

.nx-lbl{font-size:12.5px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--nx-ink-2)}
.nx-table th:last-child,.nx-table td:last-child{padding-right:20px}
.nx-form.three{grid-template-columns:repeat(auto-fit,minmax(170px,220px))}
/* team achievements */
.nx-glowrow{display:flex;flex-wrap:wrap;gap:12px 28px}
.nx-glowrow .nx-who b{font-weight:600}
.nx-achlist li{padding-top:12px;padding-bottom:12px}
.nx-achlist li:hover{background:none}
.nx-who .nx-achtxt{display:block;color:var(--nx-ink-2);font-size:14px}
.nx-who .nx-achtxt b{display:inline;color:var(--nx-ink)}
.nx-achago{min-width:96px;text-align:right;font-size:12px}

.nx-main{padding-bottom:96px}

/* staff profile view (the Nexus profile-view page) */
.nx-pv{overflow:hidden}
.nx-pvband{position:relative;height:112px;overflow:hidden}
.nx-pvband span{position:absolute;right:16px;bottom:-18px;font-family:var(--nx-display);font-size:84px;font-weight:700;line-height:1;letter-spacing:-.04em;color:rgba(255,255,255,.2);white-space:nowrap;user-select:none}
.nx-pvbody{position:relative;padding:0 24px 24px}
.nx-avatar.nx-pvava{width:104px;height:104px;margin-top:-52px;font-size:34px;font-family:var(--nx-display);border:4px solid var(--nx-surface);background-color:var(--nx-accent-weak)}
.nx-pvhead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 20px;margin-top:12px}
.nx-pvhead .nx-title{display:block}
.nx-pvaka{font-family:var(--nx-font);font-size:15px;font-style:italic;font-weight:500;letter-spacing:0;color:var(--nx-ink-3)}
.nx-pvtitle{margin-top:2px;font-weight:600;color:var(--nx-ok)}
.nx-pvmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.nx-pvmoves{list-style:none;margin:12px 0 0;padding:0;color:var(--nx-ink-3);font-size:13px;line-height:1.6}
.nx-pvmoves b{color:var(--nx-ink-2);font-weight:600}
.nx-pvknown{margin-top:18px}
.nx-pvknown>div:last-child{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.nx-pvstats{display:flex;flex-wrap:wrap;gap:12px 40px;margin:20px 0 0;padding-top:18px;border-top:1px solid var(--nx-line)}
.nx-pvstats div{display:flex;flex-direction:column}
.nx-pvstats dd{margin:0;font-size:28px;line-height:1.1}
.nx-pvstats dt{margin-top:2px;color:var(--nx-ink-3);font-size:12.5px}
.nx-pvbio{margin:0;max-width:70ch;font-size:16px;line-height:1.6;color:var(--nx-ink-2);white-space:pre-wrap;text-wrap:pretty}
.nx-achrows li{padding-top:12px;padding-bottom:12px}
.nx-achrows li:hover{background:none}
.nx-achrows li.locked b{font-weight:500;color:var(--nx-ink-3)}
.nx-wholink{color:inherit;text-decoration:none!important;border-radius:var(--nx-r)}
.nx-wholink:hover b{color:var(--nx-accent)}
.nx-wholink:focus-visible{outline:2px solid var(--nx-accent);outline-offset:3px}
.nx-dir{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px 28px}
.nx-dirnames{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.nx-dirnames a{font-weight:500}

/* Misc menu in the tab bar */
.nx-navbtn{position:relative;display:flex;align-items:center;gap:4px;height:44px;padding:0 14px;border:0;background:transparent;color:var(--nx-ink-2);font:inherit;font-weight:500;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .14s var(--nx-ease),color .14s var(--nx-ease)}
.nx-navbtn:hover,.nx-navbtn[aria-expanded="true"]{color:var(--nx-ink);background:var(--nx-hover)}
.nx-navbtn.is-down{background:var(--nx-mute-weak)}
.nx-navbtn .nx-ico{width:14px;height:14px;transition:transform .2s var(--nx-ease)}
.nx-navbtn[aria-expanded="true"] .nx-ico{transform:rotate(180deg)}
.nx-navbtn.on{color:var(--nx-accent);font-weight:600}
.nx-navbtn.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--nx-accent);transform-origin:left center;animation:nxline .28s var(--nx-ease) both}
.nx-navbtn:focus-visible{outline:2px solid var(--nx-accent);outline-offset:-2px}
@media (pointer:coarse){.nx-navbtn{height:48px}}
.nx-menu{position:fixed;z-index:8500;min-width:200px;padding:6px;background:var(--nx-surface);border:1px solid var(--nx-line-strong);border-radius:var(--nx-r);box-shadow:var(--nx-shadow-pop);transform-origin:top left;animation:nxmenu .14s var(--nx-ease) both}
@keyframes nxmenu{from{opacity:0;transform:scale(.97) translateY(-4px)}to{opacity:1;transform:none}}
.nx .nx-menu a,.nx-menu a{display:flex;align-items:center;height:38px;padding:0 12px;border-radius:4px;color:var(--nx-ink);font-weight:500;text-decoration:none;transition:background-color .12s var(--nx-ease)}
.nx-menu a:hover,.nx-menu a:focus{background:var(--nx-hover);outline:0;text-decoration:none}
.nx-menu a:focus-visible{background:var(--nx-accent-weak)}
.nx-menu a.is-down{background:var(--nx-mute-weak)}
.nx-menu a[aria-current="page"]{color:var(--nx-accent);font-weight:600}
@media (pointer:coarse){.nx-menu a{height:44px}}

/* the page area takes keyboard focus after a page change so screen readers and Tab start there; it is not a control, so it gets no focus ring (Safari drew a blue one) */
.nx-main:focus,.nx-main:focus-visible{outline:none}

/* ===== Existing-person lookup inside add forms (type a phone or email, details fill in) ===== */
.nx-idbox{grid-column:1/-1;margin:2px 0 4px;min-height:0}
.nx-idbox:empty{display:none}
.nx-idfound{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--nx-accent-line);background:var(--nx-accent-weak);border-radius:var(--nx-r);font-size:13px}

.nx-idfound .nx-grow{flex:1}
.nx-idfound a{font-weight:600}
.nx-idpick{display:flex;flex-direction:column;gap:6px;padding:8px 12px;border:1px solid var(--nx-line);background:var(--nx-sunken);border-radius:var(--nx-r);font-size:13px}
.nx-idpick .nx-pick{padding:6px 10px}
.nx-idnew{color:var(--nx-ink-3);font-size:12px}

/* ===== Document checklist ===== */
.nx-doclist li{padding:6px 12px;gap:16px}
.nx-doclist .nx-check{display:flex;align-items:flex-start;gap:10px;flex:1;min-width:0;cursor:pointer}
.nx-doclist .nx-check input{margin-top:3px;flex:none}
.nx-doclist .nx-check span{display:flex;flex-direction:column}
.nx-doclist .nx-check small{display:block;color:var(--nx-ink-3);font-size:12px}
.nx-doclist li>.nx-muted{white-space:nowrap;font-size:12px}

/* Conversion report */
.nx-crep{padding:20px}

/* =====================================================================================================
   v29 CALM PASS. Nothing on screen moves unless it has to.
   Why text jumped before: (1) the active tab went from weight 500 to 600, so it got wider and shoved its neighbours;
   (2) Inter and Space Grotesk arrive late from Google Fonts and the page was drawn first in a different font;
   (3) buttons scaled, lifted and rescaled their icons on hover and press; (4) the loading rows were 56px tall but
   real rows are 32px, so the whole page snapped shorter when data landed; (5) the page gained a scrollbar mid-load.
   ===================================================================================================== */
@font-face{font-family:"Inter Fallback";src:local("Arial"),local("Helvetica Neue"),local("Liberation Sans");size-adjust:107.4%;ascent-override:90.2%;descent-override:22.5%;line-gap-override:0%}
:root{--nx-font:"Inter","Inter Fallback",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--nx-display:var(--nx-font);
  --nx-t-fast:.12s;--nx-t:.18s;--nx-out:cubic-bezier(.22,1,.36,1)}
html{scrollbar-gutter:stable;overflow-y:scroll}
body{font-variant-numeric:tabular-nums;text-rendering:optimizeLegibility}
.nx-title,.nx-card-h h3,.nx-big{font-feature-settings:"tnum" 1}

/* one weight per control, whatever its state. State is shown with colour, background and the underline. */
.nx-nav a,.nx-nav a[aria-current="page"],.nx-navbtn,.nx-navbtn.on,.nx-menu a,.nx-menu a[aria-current="page"],
.nx-tab,.nx-tab[aria-selected="true"],.nx-seg button,.nx-seg button[aria-pressed="true"],.nx-chip,.nx-chip[aria-pressed="true"]{font-weight:500}
.nx-nav a[aria-current="page"],.nx-navbtn.on,.nx-tab[aria-selected="true"]{color:var(--nx-accent)}
.nx-seg button[aria-pressed="true"]{box-shadow:0 0 0 1px var(--nx-line) inset,0 1px 2px rgba(16,26,46,.06);color:var(--nx-ink)}

/* the active-tab underline is simply there; it no longer redraws on every page change */
.nx-nav a[aria-current="page"]::after,.nx-navbtn.on::after,.nx-tab[aria-selected="true"]::after{animation:none;transform:none}

/* controls answer with colour only. No scale, lift or icon pop, so labels never move under the pointer. */
.nx-btn,.nx-seg button,.nx-chip,.nx-day,.nx-pick,.nx-att,.nx-tab,.nx-nav a,.nx-navbtn,.nx-menu a{transition:background-color var(--nx-t-fast) var(--nx-out),border-color var(--nx-t-fast) var(--nx-out),color var(--nx-t-fast) var(--nx-out),box-shadow var(--nx-t) var(--nx-out),opacity var(--nx-t-fast) var(--nx-out)}
.nx-btn,.nx-btn:hover,.nx-btn:active,.nx-btn.is-down,.nx-btn.primary:hover:not(:disabled),.nx-btn.primary:active:not(:disabled),.nx-btn.primary.is-down:not(:disabled),
.nx-seg button:active,.nx-seg button.is-down,.nx-chip:active,.nx-chip.is-down,.nx-day.is-down,.nx-pick:active,.nx-pick.is-down,.nx-seat:active{transform:none}
.nx-btn .nx-ico,.nx-btn:hover:not(:disabled) .nx-ico,.nx-att>.nx-ico,.nx-att:hover>.nx-ico{transform:none;transition:color var(--nx-t-fast) var(--nx-out)}
.nx-btn:active:not(:disabled),.nx-btn.is-down:not(:disabled){filter:brightness(.94)}
.nx-btn.primary:active:not(:disabled),.nx-btn.primary.is-down:not(:disabled){filter:none}
.nx-btn.primary:hover:not(:disabled){box-shadow:0 1px 3px rgba(21,89,214,.28)}
.nx-att:hover>.nx-ico{color:var(--nx-accent)}
.nx-navbtn[aria-expanded="true"]>.nx-ico:last-child{transform:rotate(180deg)}
.nx-navbtn>.nx-ico:last-child{transition:transform var(--nx-t) var(--nx-out)}

/* loading rows are the size of real rows, so the page does not shrink when data arrives */
.nx-skrow{height:33px;padding:0 20px}
.nx-skel{animation-duration:1.6s}
#viewSkel{animation-duration:.14s}

@keyframes nxmodal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.nx-nav a:focus-visible,.nx-navbtn:focus-visible{outline-offset:-3px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .nx-skel{animation:none}
  body.nx-busy::before{animation:none}
}

/* =====================================================================================================
   v30 MOTION. Corporate personality: ease-out, no bounce. Quick 110ms (leaving), standard 260-320ms (arriving, gliding).
   ===================================================================================================== */
:root{--nx-move:cubic-bezier(.2,0,0,1);--nx-in:cubic-bezier(.4,0,1,1)}

/* the tab indicators are one element that glides. The old per-tab underlines are retired. */
.nx-nav a[aria-current="page"]::after,.nx-navbtn.on::after,.nx-tab[aria-selected="true"]::after{content:none;display:none}
.nx-nav,.nx-tabs,.nx-seg{position:relative}
.nx-nav[data-ink]::after,.nx-tabs[data-ink]::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:var(--ink-w,0);transform:translateX(var(--ink-x,0));background:var(--nx-accent);border-radius:3px 3px 0 0;pointer-events:none;will-change:transform,width}
.nx-tabs[data-ink]::after{bottom:0}
.nx-seg[data-ink]::before{content:"";position:absolute;left:0;top:0;width:var(--ink-w,0);height:var(--ink-h,0);transform:translate(var(--ink-x,0),var(--ink-y,0));background:var(--nx-surface);border-radius:7px;box-shadow:0 0 0 1px var(--nx-line) inset,0 1px 2px rgba(16,26,46,.07);pointer-events:none;will-change:transform,width}
.nx-seg[data-ink=on]::before,.nx-nav[data-ink=on]::after,.nx-tabs[data-ink=on]::after{transition:transform .32s var(--nx-move),width .32s var(--nx-move),height .32s var(--nx-move)}
.nx-ink-still [data-ink]::before,.nx-ink-still [data-ink]::after{transition:none!important}
.nx-seg[data-ink] button{position:relative;z-index:1}
.nx-seg[data-ink] button[aria-pressed="true"]{background:transparent;box-shadow:none}
.nx-seg[data-ink] button[aria-pressed="true"]:hover{background:transparent}
.nx-seg button{transition:color .2s var(--nx-move)}
.nx-tab{transition:color .2s var(--nx-move)}

/* a page leaves quickly and the next one rises into place, top to bottom, 45ms apart */
.nx-leaving{opacity:0;transform:translateY(-3px);transition:opacity .11s var(--nx-in),transform .11s var(--nx-in);pointer-events:none}
@keyframes nxrise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nx-main.nx-enter>*,.nx-main.nx-enter>*:not(.nx-pagehead){animation:nxrise .28s var(--nx-move) both;animation-delay:calc(var(--i,3) * 45ms)}
.nx-main.nx-enter>:nth-child(1){--i:0}.nx-main.nx-enter>:nth-child(2){--i:1}.nx-main.nx-enter>:nth-child(3){--i:2}
.nx-main.nx-enter-sk>.nx-pagehead,.nx-main.nx-enter-sk>.nx-pagehead:not(.x){animation:none}
.nx-main.nx-enter-sk>:nth-child(2){--i:0}.nx-main.nx-enter-sk>:nth-child(3){--i:1}.nx-main.nx-enter-sk>:nth-child(n+4){--i:2}
#viewSkel{animation-duration:.24s}
.nx-reloading{opacity:.55}

/* content that changes inside a page (record tabs, pill-button lists) does the same short rise */
@keyframes nxswapin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.nx-swapin{animation:nxswapin .26s var(--nx-move) both}

@media (prefers-reduced-motion:reduce){
  .nx-leaving{transform:none}
  .nx-main.nx-enter>*,.nx-swapin{animation:nxfade .12s linear both;animation-delay:0s}
  [data-ink]::before,[data-ink]::after{transition:none!important}
}

/* =====================================================================================================
   v45 MOTION PASS: the 12 principles of animation and the UX laws, applied to a working tool.
   Everything here is transform / opacity only (no layout shift) and sits inside prefers-reduced-motion:no-preference,
   so anyone who asks their device for less motion gets none of it.
   Squash and stretch  buttons, cards and chips flatten on press and spring back past rest (the pointer handler adds .is-down)
   Anticipation        dialogs and toasts dip a little before they rise
   Staging             the dialog backdrop blurs the page so the one thing that matters is in focus
   Pose to pose        the entrances below are keyframed poses (dip, overshoot, settle), not one tween
   Follow-through      a dialog's header leads, its body and footer follow 50ms apart; list rows settle in turn
   Slow in, slow out   moves that travel use ease-in-out; entrances ease out; exits ease in
   Arcs                toasts travel along a curve: x eases out while y springs, on separate properties
   Secondary action    arrows nudge, icons lean in, the all-clear tick pops, while the main action happens
   Timing              nothing over .46s; hovers .12 to .3s
   Exaggeration        invalid fields, errors and failed toasts shake; saved toasts send out a ring
   Solid drawing       one elevation system: clickable cards lift on hover and sink on press
   Appeal              the spring is shared, so everything moves like it belongs to the same family
   UX laws             Fitts: small buttons get a larger invisible hit area. Doherty: the busy bar starts at once and the cursor says so.
   ===================================================================================================== */
:root{--nx-spring:cubic-bezier(.34,1.56,.64,1);--nx-inout:cubic-bezier(.65,0,.35,1);--nx-snap:cubic-bezier(.2,.9,.3,1)}
@keyframes nxm2{0%{opacity:0;transform:translateY(14px) scale(.95)}22%{opacity:1;transform:translateY(18px) scale(.94)}62%{transform:translateY(-4px) scale(1.012)}82%{transform:translateY(1px) scale(.998)}100%{opacity:1;transform:none}}
@keyframes nxmcalm{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes nxm2out{to{opacity:0;transform:translateY(8px) scale(.97)}}
@keyframes nxfollow{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes nxt2{0%{opacity:0;transform:translateY(14px) scale(.96)}22%{opacity:1;transform:translateY(18px) scale(.97,.92)}62%{transform:translateY(-5px) scale(1.02,1.05)}82%{transform:translateY(1px) scale(.995,.99)}100%{opacity:1;transform:none}}
@keyframes nxarcx{from{translate:-26px 0}to{translate:0 0}}
@keyframes nxshakex{0%,100%{translate:0 0}18%{translate:-7px 0}38%{translate:6px 0}58%{translate:-4px 0}78%{translate:3px 0}}
@keyframes nxring{from{box-shadow:0 0 0 0 rgba(90,169,255,.55)}to{box-shadow:0 0 0 12px rgba(90,169,255,0)}}
@keyframes nxtick{from{opacity:0;transform:scale(0) rotate(-35deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){

  body .nx-btn,body .nx-chip,body .nx-att,body .nx-pick,body .nx-day{transition:transform .12s var(--nx-out),background-color .12s var(--nx-out),border-color .12s var(--nx-out),color .12s var(--nx-out),box-shadow .2s var(--nx-out),filter .12s;transform-origin:50% 62%}
  body .nx-btn.is-down:not(:disabled),body .nx-chip.is-down,body .nx-att.is-down,body .nx-pick.is-down,body .nx-day.is-down,
  body .nx-btn:active:not(:disabled),body .nx-chip:active,body .nx-att:active,body .nx-pick:active,body .nx-day:active{transform:scale(.97);transition:transform .06s ease-out,background-color .12s var(--nx-out),border-color .12s var(--nx-out),color .12s var(--nx-out),filter .12s}

  .modal-bg{backdrop-filter:blur(2.5px);-webkit-backdrop-filter:blur(2.5px)}
  .modal{animation:nxmcalm .16s ease-out both}
  .modal-bg.is-closing .modal{animation:nxm2out .12s ease-in both}
  /* follow-through: header leads, body and footer follow */
  /* arcs and anticipation: toasts dip, then travel along a curve; failures shake, successes ring */
  .toast{animation:nxfollow .18s ease-out both}

  .nx-main.nx-enter .nx-att.zero .nx-big svg{animation:nxtick .5s var(--nx-spring) .18s both}

  .nx-meter-bar i,.nx-cap i{transition:width .6s var(--nx-inout)}

    try{console.error('YatraLine: could not load pipeline/'+n+'.js');}catch(e){}
    var l=document.getElementById('lock'), t=document.getElementById('lockMsg');
    if(t) t.textContent='YatraLine could not load all of its files. Refresh the page; if it keeps happening, tell the admin which file: pipeline/'+n+'.js';
    if(l) l.hidden=false;
  }
  PL_FILES.forEach(function(n){
    var s=document.createElement('script');
    s.src='pipeline/'+n+'.js?v='+encodeURIComponent(v);
    s.async=false;   /* download together, run in this order */
    s.onerror=function(){broke(n);};
    document.body.appendChild(s);
  });
})();
</script>
</body>
</html>
