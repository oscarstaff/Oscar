<div id="__gate" style="position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#0f1117,#1a1d27);display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;">
  <div style="background:#1e2230;border:1px solid #2e3344;border-radius:18px;padding:40px 36px;width:min(380px,90vw);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);">
    <div id="__gateLock" style="font-size:42px;margin-bottom:14px;cursor:default;user-select:none;">🔒</div>
    <div style="font-size:20px;font-weight:700;color:#fff;margin-bottom:8px;">Arena Doubles</div>
    <div id="__gateMsg" style="font-size:13.5px;color:#8b94a8;line-height:1.5;">Checking access…</div>
  </div>
</div>
<script>
(function(){
  var APP='vgc';
  var SECRET='oscars_nexus_gate_v1_8f3a2c91';
  var SB='https://jcfgldqrdbfkgbixszds.supabase.co';
  var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjZmdsZHFyZGJma2diaXhzemRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1Nzc3NzEsImV4cCI6MjA5MDE1Mzc3MX0.Wj8cCpnlsoZOPj5sKWeEdfvgjG4Nc-UuTTYgbcrPfeI';
  window.NEXUS_SB=SB; window.NEXUS_KEY=KEY;
  function fail(m){var el=document.getElementById('__gateMsg');if(el){el.innerHTML=m+'<br><br><span style=\"color:#6b7585;font-size:12px;\">Open this app from the Nodes page in Nexus.</span>';}}
  function pass(){var g=document.getElementById('__gate');if(g)g.remove();}
  async function hmacHex(secret,msg){var enc=new TextEncoder();var k=await crypto.subtle.importKey('raw',enc.encode(secret),{name:'HMAC',hash:'SHA-256'},false,['verify','sign']);var s=await crypto.subtle.sign('HMAC',k,enc.encode(msg));return Array.from(new Uint8Array(s)).map(x=>x.toString(16).padStart(2,'0')).join('');}
  if(sessionStorage.getItem('ngate_'+APP)==='1'){ window.NEXUS_USER=window.NEXUS_USER||sessionStorage.getItem('ngate_user_'+APP)||''; if(window.NEXUS_ADMIN!==true){window.NEXUS_ADMIN=sessionStorage.getItem('ngate_admin_'+APP)==='1';} pass();return;}
  (async function(){
    try{
      var hash=location.hash||'';
      if(/[#&?]debug=1/.test(hash)||/[#&?]debug=1/.test(location.search)){window.FC_DEBUG=true;}
      var m=hash.match(/t=([^&]+)/);
      if(!m){fail('No access token.');return;}
      var token=decodeURIComponent(m[1]);
      var parts=token.split('.');
      if(parts.length!==2){fail('Invalid token.');return;}
      var b64=parts[0], sig=parts[1];
      var want=await hmacHex(SECRET,b64);
      if(want!==sig){fail('Token signature invalid.');return;}
      var payload=JSON.parse(decodeURIComponent(escape(atob(b64))));
      if(payload.app!==APP){fail('Token is for a different app.');return;}
      if(Date.now()>payload.exp){fail('Token expired — relaunch from Nexus.');return;}
      var name=payload.name||'';
      window.NEXUS_USER=name;
      window.NEXUS_ADMIN=(payload.is_admin===true);
      var r=await fetch(SB+'/rest/v1/app_access?app=eq.'+APP+'&staff_name=eq.'+encodeURIComponent(name)+'&select=staff_name',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
      var rows=r.ok?await r.json():[];
      if(!rows.length){fail('You no longer have access to this app.');return;}
      sessionStorage.setItem('ngate_'+APP,'1');
      try{sessionStorage.setItem('ngate_user_'+APP,name);}catch(e){}
      try{sessionStorage.setItem('ngate_admin_'+APP,(payload.is_admin===true)?'1':'0');}catch(e){}
      try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
      pass();
    }catch(e){ fail('Access check failed.'); console.warn('gate',e); }
  })();
})();
</script>
<style>
:root{
  --bg0:#080A10; --bg1:#0D131E; --bg2:#111927;
  --panel:#151E2C; --panel2:#1C2839; --panel3:#26364B;
  --line:rgba(150,175,210,.12); --line2:rgba(150,175,210,.22);
  --txt:#EAF1FA; --txt-dim:#93A2B8; --txt-mute:#5F6F86;
  --cyan:#2FE3C4; --cyan-deep:#0FB49B; --blue:#3D8BFF;
  --red:#FF5B76; --red-deep:#C33350; --magenta:#FF3DA5;
  --gold:#FFC847; --tera:#FF48B0;
  --hp-hi:#48D06A; --hp-mid:#FFC642; --hp-lo:#FF5751;
  --hud:#F2ECD8; --hud-line:#C9BE9C; --hud-ink:#1B2016;
  --good:#48D06A; --warn:#FFC642; --bad:#FF5751;
  --r:14px; --r-sm:9px; --r-lg:22px;
  --shadow:0 18px 44px rgba(0,0,0,.5);
  --dispf:'Chakra Petch',system-ui,sans-serif;
  --bodyf:'Rubik',system-ui,sans-serif;
  --monof:'Space Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{font-family:var(--bodyf)}
body{
  margin:0; color:var(--txt); min-height:100vh; padding:12px;
  background:
    radial-gradient(1100px 560px at 15% -10%, rgba(47,227,196,.10), transparent 60%),
    radial-gradient(1000px 520px at 85% -5%, rgba(255,91,118,.12), transparent 60%),
    var(--bg0);
}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;outline:none;background:none;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
h1,h2,h3,h4{margin:0;font-family:var(--dispf);font-weight:700;letter-spacing:.01em}
.mono{font-family:var(--monof)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
[hidden]{display:none!important}

.app{
  width:min(1180px,100%); margin:auto; background:linear-gradient(180deg,var(--bg1),var(--bg0));
  border:1px solid var(--line2); border-radius:var(--r-lg); overflow:hidden;
  box-shadow:var(--shadow); position:relative;
}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:14px 18px; background:linear-gradient(180deg,rgba(255,255,255,.03),transparent); border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--dispf);font-weight:700;font-size:20px;letter-spacing:.02em}
.brand .mk{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--cyan),var(--blue));color:#04121A;font-size:18px;box-shadow:0 6px 16px rgba(47,227,196,.35)}
.brand .sub{font-family:var(--monof);font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--txt-dim);
  border:1px solid var(--line2);padding:3px 7px;border-radius:6px;text-transform:uppercase}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line2);
  color:var(--txt);padding:9px 13px;border-radius:10px;font-weight:600;font-size:13px;transition:.15s}
.tbtn:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}
.tbtn.live{color:var(--red);border-color:rgba(255,91,118,.4);background:rgba(255,91,118,.08)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--txt);padding:12px 20px;border-radius:12px;
  font-weight:700;font-size:14px;transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover:not(:disabled){transform:translateY(-1px);border-color:var(--line2)}
.btn:disabled{opacity:.4}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));color:#04141A;border:none;box-shadow:0 8px 22px rgba(47,227,196,.3)}
.btn.primary:hover:not(:disabled){box-shadow:0 12px 28px rgba(47,227,196,.42)}
.btn.rose{background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;border:none}
.btn.blue{background:linear-gradient(135deg,var(--blue),#2C63C7);color:#fff;border:none}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:9px}

/* ---------- home / builder ---------- */
.screen{padding:22px}
.hero{position:relative;overflow:hidden;border:1px solid var(--line2);border-radius:var(--r-lg);
  background:linear-gradient(135deg,rgba(47,227,196,.14),transparent 46%),linear-gradient(245deg,rgba(255,91,118,.16),transparent 48%),var(--bg2);
  padding:30px 30px 26px}
.hero::after{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none;mix-blend-mode:overlay}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--monof);font-weight:700;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);border:1px solid rgba(47,227,196,.35);
  background:rgba(47,227,196,.08);padding:5px 10px;border-radius:7px;margin-bottom:15px}
.hero h1{font-size:clamp(28px,4.4vw,46px);line-height:1.03;max-width:17ch;text-wrap:balance}
.hero p{color:var(--txt-dim);max-width:60ch;font-size:14.5px;line-height:1.6;margin:14px 0 0}
.scout{display:flex;gap:9px;margin-top:22px;max-width:560px;background:var(--panel);border:1px solid var(--line2);
  border-radius:13px;padding:6px}
.scout input{flex:1;background:transparent;border:none;padding:11px 12px;font-weight:600;font-size:14px;outline:none;color:var(--txt)}
.scout input::placeholder{color:var(--txt-mute)}
.cta{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 14px}
.sec-head h2{font-size:20px}
.sec-head .count{font-family:var(--monof);font-size:12px;color:var(--txt-dim)}

.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.rcard{position:relative;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);
  overflow:hidden;transition:.15s;box-shadow:0 8px 22px rgba(0,0,0,.25);display:flex;flex-direction:column}
.rcard .foot{margin-top:auto}
.rcard:hover{transform:translateY(-2px);border-color:var(--cyan)}
.rcard .accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc,var(--cyan))}
.rcard .body{padding:14px 14px 14px 18px;display:flex;gap:13px;align-items:flex-start}
.rcard .spr{flex:none;width:74px;height:74px;display:grid;place-items:center;border-radius:12px;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.06),transparent 70%)}
.rcard .spr img{max-width:100%;max-height:100%;image-rendering:pixelated;filter:drop-shadow(0 5px 7px rgba(0,0,0,.5))}
.rcard .meta{flex:1;min-width:0}
.rcard .nm{display:flex;align-items:center;justify-content:space-between;gap:8px}
.rcard .nm h3{font-size:18px}
.rcard .slotno{font-family:var(--monof);font-size:10px;color:var(--txt-mute);letter-spacing:.1em}
.rcard .line{font-size:12px;color:var(--txt-dim);margin-top:5px;line-height:1.5}
.rcard .line b{color:var(--txt);font-weight:700}
.rcard .mvs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.mvtag{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);
  border-left:3px solid var(--mv,var(--txt-mute))}
.rcard .foot{display:flex;gap:8px;padding:0 14px 14px 18px}
.rcard .foot .btn{flex:1}
.icon-x{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:8px;z-index:2;
  background:rgba(255,91,118,.12);border:1px solid rgba(255,91,118,.4);color:var(--red);display:grid;place-items:center;font-size:13px}
.icon-x:hover{background:var(--red);color:#fff}
.rcard.add{border-style:dashed;background:var(--bg2);display:grid;place-items:center;min-height:150px;cursor:pointer;color:var(--txt-dim)}
.rcard.add:hover{border-color:var(--cyan);color:var(--cyan)}
.rcard.add .plus{font-size:30px;font-family:var(--dispf)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.chip .d{width:6px;height:6px;border-radius:50%}
.chip.tera{gap:4px}

/* ---------- ev mini bars ---------- */
.evmini{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:9px}
.evmini .b{height:34px;background:var(--panel2);border-radius:5px;position:relative;overflow:hidden;border:1px solid var(--line)}
.evmini .b i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(47,227,196,.55),rgba(20,140,120,.55));display:block}
.evmini .b span{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-family:var(--monof);font-size:11px;color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.evmini .b em{position:absolute;left:0;right:0;top:3px;text-align:center;font-family:var(--monof);font-size:9.5px;color:#e6edf5;font-style:normal;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.7)}

/* ---------- modal ---------- */
.mbg{position:fixed;inset:0;background:rgba(4,7,12,.8);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{width:min(880px,100%);max-height:92vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);
  border-radius:18px;padding:24px;box-shadow:var(--shadow)}
.modal.wide{width:min(1180px,100%)}
.modal h3{font-size:24px}
.modal .msub{color:var(--txt-dim);font-size:14px;line-height:1.5;margin:4px 0 16px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--txt-dim);margin-bottom:6px}
.field select,.field input,.field textarea,.control{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line2);
  padding:11px 12px;border-radius:10px;font-size:14px;font-weight:500;outline:none}
.field select:focus,.field input:focus,.control:focus{border-color:var(--cyan)}
.field .hint{margin-top:6px;font-size:12px;color:var(--txt-dim);min-height:15px;line-height:1.4}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tabs{display:flex;gap:6px;margin:2px 0 16px;border-bottom:1px solid var(--line)}
.tab{padding:9px 15px;font-weight:700;font-size:13px;color:var(--txt-dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--txt);border-bottom-color:var(--cyan)}
.mact{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}

.tera-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.tsw{aspect-ratio:1;border-radius:9px;border:2px solid transparent;display:grid;place-items:center;
  font-family:var(--monof);font-weight:700;font-size:9.5px;background:var(--sw);color:rgba(0,0,0,.7)}
.tsw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25),0 0 14px var(--sw);color:#fff}

.evrow{display:grid;grid-template-columns:46px 1fr 54px 44px;gap:9px;align-items:center;margin-bottom:7px}
.evrow .lab{font-family:var(--monof);font-weight:700;font-size:12px;color:var(--txt-dim)}
.evrow input[type=range]{width:100%;accent-color:var(--cyan)}
.evrow .num{width:100%;text-align:center;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:5px;
  font-family:var(--monof);font-weight:700;font-size:12px;color:var(--txt)}
.evrow .fin{font-family:var(--monof);font-size:12px;color:var(--cyan);text-align:right;font-weight:700}
.evtot{display:flex;justify-content:space-between;font-family:var(--monof);font-size:12px;font-weight:700;
  padding:8px 12px;background:var(--panel2);border-radius:9px;margin-bottom:10px}
.evtot.over{color:var(--red)}
.ivs{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.ivs label{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;cursor:pointer;color:var(--txt-dim)}

.mvpick{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px;margin:2px 0 16px}
.pick{position:relative;padding:14px 10px;background:var(--panel2);border:2px solid transparent;border-radius:12px;text-align:center;transition:.12s}
.pick:hover{border-color:var(--line2);transform:translateY(-2px)}
.pick.on{border-color:var(--cyan);background:rgba(47,227,196,.12)}
.pick img{width:72px;height:72px;image-rendering:pixelated;filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}
.pick span{display:block;font-size:11.5px;font-weight:700;margin-top:5px}
.pick .ob{position:absolute;top:6px;left:6px;font-family:var(--monof);font-weight:700;font-size:9px;padding:2px 7px;border-radius:999px;background:var(--cyan);color:#04141A}
.pick .ob.bench{background:var(--panel3);color:var(--txt-dim)}
.pick.static:hover{transform:none;border-color:transparent}

.listrow{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;margin-bottom:8px}
.listrow .nm{font-weight:700;font-size:14px;min-width:110px}
.listrow .mini{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.listrow .mini img{width:32px;height:32px;image-rendering:pixelated}

/* stat bars in editor */
.statbars{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.statbars .sb{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center}
.statbars .sb .k{font-family:var(--monof);font-size:11px;color:var(--txt-dim)}
.statbars .sb .track{height:9px;background:var(--panel2);border-radius:5px;overflow:hidden}
.statbars .sb .track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--cyan-deep),var(--cyan))}
.statbars .sb .v{font-family:var(--monof);font-size:11px;color:var(--txt);text-align:right;font-weight:700}

/* =========================================================
   BATTLE
   ========================================================= */
.field-strip{display:flex;flex-wrap:wrap;gap:7px;padding:12px 18px 0;background:var(--bg0)}
.fchip{flex:none;font-family:var(--monof);font-size:10.5px;font-weight:700;padding:6px 11px;border-radius:8px;
  background:var(--panel);border:1px solid var(--line);color:var(--txt-mute);white-space:nowrap}
.fchip.on{border-color:var(--gold);color:var(--gold);background:rgba(255,200,71,.08)}
.fchip.you{border-color:rgba(47,227,196,.4);color:var(--cyan);background:rgba(47,227,196,.07)}
.fchip.foe{border-color:rgba(255,91,118,.4);color:var(--red);background:rgba(255,91,118,.07)}

.stage{position:relative;padding:12px 18px 18px;background:
  radial-gradient(120% 80% at 50% 0%, #16233A 0%, #0C1524 55%, #070C16 100%);}
.fx-layer{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.side-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:2}
.side-row.foes{margin-bottom:2px}
.divider{display:flex;align-items:center;gap:12px;margin:4px 0;color:var(--txt-mute)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.divider .vs{font-family:var(--dispf);font-weight:700;font-size:15px;letter-spacing:.1em;color:var(--gold);
  border:1px solid rgba(255,200,71,.4);border-radius:999px;padding:2px 14px;background:rgba(255,200,71,.06)}

.mon{position:relative;border-radius:16px;padding:8px;display:flex;flex-direction:column;min-height:150px}
.mon.foe{background:linear-gradient(180deg,rgba(255,91,118,.05),transparent)}
.mon.ally{background:linear-gradient(0deg,rgba(47,227,196,.05),transparent)}
.mon.targetable{cursor:pointer}
.mon.targetable::after{content:'';position:absolute;inset:4px;border:2px dashed var(--gold);border-radius:14px;
  animation:reticle 1s infinite;pointer-events:none}
.mon.targetable:hover::after{border-style:solid;box-shadow:0 0 22px rgba(255,200,71,.4) inset}
@keyframes reticle{0%,100%{opacity:.5}50%{opacity:1}}
.mon.acting{box-shadow:0 0 0 2px var(--cyan),0 0 26px rgba(47,227,196,.25)}
.mon.fainted{opacity:.32;filter:grayscale(.85)}

.mon .sprite-wrap{position:relative;flex:1;display:grid;place-items:center;min-height:96px}
.mon .platform{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:120px;height:26px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 70%)}
.mon.ally .platform{background:radial-gradient(ellipse,rgba(47,227,196,.22),transparent 70%)}
.mon.foe .platform{background:radial-gradient(ellipse,rgba(255,91,118,.2),transparent 70%)}
.mon .sprite{position:relative;z-index:1;width:118px;height:118px;object-fit:contain;image-rendering:pixelated;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.55));transition:transform .1s}
.mon.ally .sprite{width:132px;height:132px}

/* retro HUD box */
.hud{background:var(--hud);border:2px solid var(--hud-ink);border-radius:12px;padding:8px 10px 9px;
  box-shadow:0 5px 0 rgba(0,0,0,.35),inset 0 0 0 1px var(--hud-line);position:relative;z-index:3}
.hud .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hud .nm{font-family:var(--dispf);font-weight:700;font-size:15px;color:var(--hud-ink);line-height:1;letter-spacing:0}
.hud .lv{font-family:var(--monof);font-weight:700;font-size:10px;color:#4A5340}
.hud .tera-i{font-size:12px;color:var(--tera);filter:drop-shadow(0 0 3px rgba(255,72,176,.6))}
.hud .row2{display:flex;align-items:center;gap:6px;margin-top:6px}
.hud .hplabel{font-family:var(--monof);font-weight:700;font-size:9px;color:#8A6A1F;background:#F4D06A;border:1px solid #B98F27;
  border-radius:4px;padding:1px 4px;letter-spacing:.05em}
.hud .bar{flex:1;height:9px;background:#3A3F32;border:1px solid var(--hud-ink);border-radius:5px;overflow:hidden;padding:1px}
.hud .bar i{display:block;height:100%;border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1),background-color .3s}
.hud .row3{display:flex;align-items:center;justify-content:space-between;margin-top:5px}
.hud .num{font-family:var(--monof);font-weight:700;font-size:10px;color:#4A5340}
.hud .badges{display:flex;gap:4px}
.hud .types{display:flex;gap:3px}
.hud .stbadge{font-family:var(--monof);font-size:8.5px;font-weight:700;padding:1px 5px;border-radius:4px;letter-spacing:.03em}
.st-BRN{background:#F0554E;color:#fff}.st-PAR{background:#E6B800;color:#3a2a00}.st-PSN,.st-TOX{background:#9B59B6;color:#fff}
.st-SLP{background:#6C7A93;color:#fff}.st-FRZ{background:#67C7E8;color:#06303f}
.stagechip{font-family:var(--monof);font-size:8px;font-weight:700;padding:1px 4px;border-radius:4px;color:#3a3320}
.stagechip.up{background:#8ee6a0}.stagechip.dn{background:#f2a6a0}
.tinytype{font-size:8.5px;font-weight:800;padding:1px 5px;border-radius:4px;color:#fff}

/* damage popup */
.dpop{position:absolute;font-family:var(--dispf);font-weight:700;font-size:26px;color:#fff;
  text-shadow:0 2px 0 #000,0 0 14px rgba(0,0,0,.9);pointer-events:none;z-index:50;animation:dfloat .9s ease-out forwards}
.dpop.crit{color:var(--gold);font-size:32px;text-shadow:0 2px 0 #000,0 0 16px var(--gold)}
.dpop.heal{color:var(--hp-hi)}
@keyframes dfloat{0%{opacity:1;transform:translate(-50%,0) scale(.8)}25%{transform:translate(-50%,-10px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-52px) scale(1)}}

/* announcer */
.announce{display:flex;align-items:flex-start;gap:10px;padding:10px 18px;background:var(--bg0);border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-height:58px}
.announce .tt{font-family:var(--dispf);font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--gold);
  border:1px solid rgba(255,200,71,.35);border-radius:7px;padding:3px 9px;background:rgba(255,200,71,.06);flex:none;margin-top:2px}
.ann-feed{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.aln{font-size:12px;color:var(--txt-mute);line-height:1.35;opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.aln.cur{opacity:1;color:var(--txt);font-weight:600;font-size:13.5px}
.aln.s.cur{color:var(--gold)}.aln.e.cur{color:#ffd2d2}.aln.i.cur{color:var(--hp-hi)}.aln.t.cur{color:var(--tera)}
.aln.turn.cur{color:var(--gold);font-family:var(--dispf);letter-spacing:.04em}

/* command dock */
.dock{padding:14px 18px 18px;background:linear-gradient(180deg,var(--bg1),var(--bg0))}
.who{display:flex;gap:10px;margin-bottom:12px}
.wtab{flex:1;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:13px;background:var(--panel);
  border:1px solid var(--line2);transition:.15s;text-align:left;min-width:0}
.wtab.on{border-color:var(--cyan);background:linear-gradient(180deg,rgba(47,227,196,.1),var(--panel))}
.wtab.done{border-color:rgba(72,208,106,.4)}
.wtab .pf{flex:none;width:38px;height:38px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.wtab .pf img{width:34px;height:34px;image-rendering:pixelated}
.wtab .info{min-width:0;flex:1}
.wtab .info .n{display:block;font-family:var(--dispf);font-weight:700;font-size:14px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtab .info .a{display:block;font-size:11px;color:var(--txt-dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.wtab .info .a.set{color:var(--cyan)}
.wtab .tick{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;
  background:var(--panel2);color:var(--txt-mute);border:1px solid var(--line)}
.wtab.done .tick{background:var(--good);color:#04140a;border:none}

.dock-main{display:grid;grid-template-columns:1fr 190px;gap:12px}
@media(max-width:720px){.dock-main{grid-template-columns:1fr}}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mv{position:relative;display:flex;flex-direction:column;gap:5px;padding:12px 13px;border-radius:13px;text-align:left;
  background:var(--panel);border:1px solid var(--line2);border-left:5px solid var(--mv,var(--txt-mute));transition:.12s;min-height:74px}
.mv:hover:not(:disabled){transform:translateY(-2px);background:var(--panel2)}
.mv:active:not(:disabled){transform:translateY(0) scale(.98)}
.mv.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset,0 8px 20px rgba(0,0,0,.3)}
.mv:disabled{opacity:.32}
.mv .top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.mv .nm{font-family:var(--dispf);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .cat{font-size:12px;opacity:.8}
.mv .sub{display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:var(--monof);font-size:10px;color:var(--txt-dim);font-weight:700}
.mv .sub .t{color:var(--mv)}
.mv .dmg{font-family:var(--monof);font-size:10.5px;font-weight:700;color:var(--hp-mid)}
.mv .dmg.ko{color:var(--hp-lo)}
.mv .dmg.weak{color:var(--txt-mute)}

.side-col{display:flex;flex-direction:column;gap:9px}
.side-col .tera-btn,.side-col .switch-btn{width:100%;padding:12px;border-radius:12px;font-weight:700;font-size:13.5px;
  background:var(--panel);border:1px solid var(--line2);color:var(--txt);transition:.15s;display:flex;align-items:center;justify-content:center;gap:7px}
.side-col .switch-btn:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.side-col .switch-btn.q{border-color:var(--gold);color:var(--gold);background:rgba(255,200,71,.08)}
.side-col .tera-btn.on{background:linear-gradient(135deg,var(--tera),#B31E77);color:#fff;border:none;box-shadow:0 0 16px rgba(255,72,176,.4);animation:teraglow 1.4s infinite alternate}
.side-col .tera-btn:disabled{opacity:.4}
@keyframes teraglow{0%{filter:brightness(1)}100%{filter:brightness(1.3)}}
.side-col .go{flex:1;min-height:56px;font-family:var(--dispf);font-size:19px;letter-spacing:.04em;
  background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));color:#04141A;border:none;border-radius:14px;font-weight:700;
  box-shadow:0 10px 26px rgba(47,227,196,.35);transition:.15s}
.side-col .go:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 32px rgba(47,227,196,.5)}
.side-col .go:disabled{background:var(--panel2);color:var(--txt-mute);box-shadow:none}

.target-banner{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;margin-bottom:12px;border-radius:12px;
  background:rgba(255,200,71,.1);border:1px solid rgba(255,200,71,.4);color:var(--gold);font-weight:700;font-size:13.5px}
.target-banner button{color:var(--txt-dim);font-weight:700;text-decoration:underline;font-size:12px}

/* fx */
@keyframes lungeUp{0%{transform:translateY(0)}45%{transform:translateY(-26px) scale(1.06)}100%{transform:translateY(0)}}
@keyframes lungeDown{0%{transform:translateY(0)}45%{transform:translateY(26px) scale(1.06)}100%{transform:translateY(0)}}
@keyframes hurt{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes faintdrop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(40px);opacity:0}}
.mon.ally .sprite.lunge{animation:lungeUp .34s cubic-bezier(.4,0,.2,1)}
.mon.foe .sprite.lunge{animation:lungeDown .34s cubic-bezier(.4,0,.2,1)}
.sprite.hurt{animation:hurt .38s ease-in-out}
.sprite.faint{animation:faintdrop .5s ease-in forwards}
.flash{position:absolute;inset:0;border-radius:16px;opacity:0;pointer-events:none;mix-blend-mode:screen;z-index:2}
.flash.on{opacity:.5;transition:opacity .1s}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,3px)}50%{transform:translate(4px,-3px)}75%{transform:translate(-3px,-2px)}}
.stage.shake{animation:shake .3s}
@keyframes shakehard{0%,100%{transform:translate(0,0)}15%{transform:translate(-8px,6px)}30%{transform:translate(8px,-6px)}45%{transform:translate(-7px,4px)}60%{transform:translate(6px,-5px)}80%{transform:translate(-4px,3px)}}
.stage.shake-hard{animation:shakehard .44s}
@keyframes teraburst{0%{box-shadow:0 0 0 0 rgba(255,72,176,.6)}100%{box-shadow:0 0 0 40px rgba(255,72,176,0)}}
.mon.teraburst{animation:teraburst .6s}

/* ===== tap-to-command: contextual move menu + turn bar ===== */
.cmd-layer{position:absolute;left:0;right:0;bottom:8px;z-index:70;display:flex;justify-content:center;padding:0 10px;pointer-events:none}
.move-menu{pointer-events:auto;width:min(620px,100%);background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--cyan);
  border-radius:18px;box-shadow:0 -12px 44px rgba(0,0,0,.55),0 0 0 3px rgba(47,227,196,.12);padding:12px;animation:bloomIn .2s ease}
.mm-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.mm-pf{flex:none;width:34px;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--line2);background:var(--panel3);display:grid;place-items:center}
.mm-pf img{width:32px;height:32px;image-rendering:pixelated}
.mm-hn{font-family:var(--dispf);font-weight:700;font-size:16px}
.mm-hs{font-size:11px;color:var(--txt-dim);font-weight:600}
.mm-close{margin-left:auto;flex:none;width:32px;height:32px;border-radius:9px;background:var(--panel3);border:1px solid var(--line2);color:var(--txt-dim);font-size:13px}
.mm-close:hover{color:var(--red);border-color:var(--red)}
.mm-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mm-move{position:relative;display:flex;flex-direction:column;gap:5px;padding:12px 13px;border-radius:13px;text-align:left;
  background:var(--panel);border:1px solid var(--line2);border-left:5px solid var(--mv);min-height:72px;transition:transform .1s,background .12s}
.mm-move:hover:not(:disabled){transform:translateY(-2px);background:var(--panel2)}
.mm-move:active:not(:disabled){transform:scale(.97)}
.mm-move:disabled{opacity:.3}
.mm-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.mm-nm{font-family:var(--dispf);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm-cat{font-size:12px;opacity:.75}
.mm-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:var(--monof);font-size:10px;font-weight:700;color:var(--txt-dim)}
.mm-t{color:var(--mv)}
.mm-dmg{font-family:var(--monof);font-size:10.5px;font-weight:700;color:var(--hp-mid)}
.mm-dmg.ko{color:var(--hp-lo)}.mm-dmg.weak,.mm-dmg.st{color:var(--txt-mute)}
.mm-actions{display:flex;gap:9px;margin-top:10px}
.mm-x{flex:1;padding:11px;border-radius:11px;font-weight:700;font-size:13px;background:var(--panel);border:1px solid var(--line2);color:var(--txt)}
.mm-x:hover:not(:disabled){border-color:var(--blue)}
.mm-x.tera.on{background:linear-gradient(135deg,var(--tera),#B31E77);color:#fff;border:none;box-shadow:0 0 14px rgba(255,72,176,.4)}
.mm-x:disabled{opacity:.4}

.mon.cmd{cursor:pointer}
.mon.cmd::after{content:'';position:absolute;inset:2px;border-radius:14px;box-shadow:0 0 0 2px rgba(47,227,196,.45) inset;animation:cmdpulse 1.7s infinite;pointer-events:none;z-index:1}
.mon.cmd.open::after,.mon.cmd.queued::after{display:none}
@keyframes cmdpulse{0%,100%{opacity:.22}50%{opacity:.7}}
.mon.open{z-index:65}
.qbadge{position:absolute;top:6px;right:6px;z-index:5;width:22px;height:22px;border-radius:50%;background:var(--good);color:#04140a;display:grid;place-items:center;font-size:12px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tap-hint{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);font-family:var(--monof);font-size:9px;font-weight:700;color:var(--cyan);letter-spacing:.03em;opacity:.85;white-space:nowrap;pointer-events:none}
.stage.menuing .side-row{filter:brightness(.5) saturate(.8);transition:filter .2s}
.stage.menuing .mon.open{filter:none}

.turnbar{display:flex;align-items:stretch;gap:10px;padding:12px 16px 16px;background:linear-gradient(180deg,var(--bg1),var(--bg0))}
.tb-chips{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.tb-chip{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:13px;background:var(--panel);border:1px solid var(--line2);text-align:left;min-width:0;transition:.15s}
.tb-chip.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.tb-chip.set{border-color:rgba(72,208,106,.5)}
.tbpf{flex:none;width:34px;height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.tbpf img{width:30px;height:30px;image-rendering:pixelated}
.tbinfo{min-width:0;flex:1}
.tbn{display:block;font-family:var(--dispf);font-weight:700;font-size:13px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tba{display:block;font-size:11px;color:var(--txt-mute);font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tba.yes{color:var(--cyan)}
.tbk{flex:none;width:22px;height:22px;border-radius:50%;background:var(--panel2);color:var(--txt-mute);display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid var(--line)}
.tb-chip.set .tbk{background:var(--good);color:#04140a;border:none}
.tb-go{flex:none;width:118px;font-family:var(--dispf);font-size:20px;letter-spacing:.05em;background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));
  color:#04141A;border:none;border-radius:14px;font-weight:700;box-shadow:0 10px 24px rgba(47,227,196,.32);transition:.15s}
.tb-go:hover:not(:disabled){transform:translateY(-2px)}
.tb-go:disabled{background:var(--panel2);color:var(--txt-mute);box-shadow:none}
.tb-hint{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:13px;background:rgba(255,200,71,.1);border:1px solid rgba(255,200,71,.4);color:var(--gold);font-weight:700;font-size:14px}
.tb-hint.wait{background:rgba(47,227,196,.08);border-color:rgba(47,227,196,.3);color:var(--cyan)}
.tb-hint button{color:var(--txt-dim);font-weight:700;text-decoration:underline;font-size:12px}
@keyframes bloomIn{0%{opacity:0;transform:translateY(14px) scale(.94)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes popIn{0%{opacity:0;transform:scale(.6) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.mm-move{animation:popIn .22s cubic-bezier(.2,1.2,.4,1) backwards;animation-delay:calc(var(--i) * .05s + .05s)}
@media(max-width:640px){
  .mm-grid{gap:7px}.mm-move{min-height:62px;padding:10px}
  .tb-chips{grid-template-columns:1fr}
  .tb-go{width:84px;font-size:16px}
}

/* ===================== POKÉMON SHOWDOWN-STYLE BATTLE ===================== */
.sd-stage{position:relative;padding:16px 14px 20px;min-height:340px;overflow:hidden;
  background:linear-gradient(180deg,#7fbfe6 0%,#a4d4ea 30%,#cbe6b4 44%,#93cf7f 58%,#74b866 100%)}
.bg-scene{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:filter .8s ease}
.bg-sun{transition:opacity .8s ease}
.sd-stage[data-wx="rain"] .bg-scene{filter:brightness(.62) saturate(.7) hue-rotate(-12deg)}
.sd-stage[data-wx="rain"] .bg-sun,.sd-stage[data-wx="sand"] .bg-sun,.sd-stage[data-wx="snow"] .bg-sun{opacity:0}
.sd-stage[data-wx="sand"] .bg-scene{filter:sepia(.55) saturate(1.25) brightness(.9) hue-rotate(-8deg)}
.sd-stage[data-wx="snow"] .bg-scene{filter:saturate(.35) brightness(1.08) hue-rotate(160deg)}
.sd-stage[data-wx="sun"] .bg-scene{filter:saturate(1.25) brightness(1.07)}
.sd-stage[data-tr="1"]::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background-image:linear-gradient(rgba(170,110,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(170,110,255,.16) 1px,transparent 1px);background-size:34px 34px;box-shadow:inset 0 0 70px rgba(140,70,255,.35);animation:trpulse 3.2s ease-in-out infinite}
@keyframes trpulse{0%,100%{opacity:.75}50%{opacity:1}}
.sd-stage::before{content:'';position:absolute;left:-10%;right:-10%;top:40%;height:60%;background:radial-gradient(ellipse at 50% 0,rgba(255,255,255,.22),transparent 60%);pointer-events:none;z-index:1}
.sd-stage.targeting .sd-side.allies{filter:brightness(.85)}
.sd-side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);position:relative;z-index:2;gap:2%}
.sd-side.foes{padding:0 6% 0 14%}
.sd-side.allies{padding:6px 14% 0 4%}
.sd-side.foes .sd-mon:nth-child(2){transform:translateY(-16px)}
.sd-side.allies .sd-mon:nth-child(1){transform:translateY(12px)}
.sd-mon{position:relative;display:flex;flex-direction:column;align-items:center;min-height:150px}
.sd-mon.fainted{opacity:.3;filter:grayscale(.9)}
.sd-mon.targetable{cursor:pointer}
.sd-mon.targetable .sd-slot::after{content:'';position:absolute;inset:2px;border:3px dashed var(--gold);border-radius:12px;animation:reticle 1s infinite}
.sd-mon.targetable:hover .sd-slot::after{border-style:solid;box-shadow:0 0 22px rgba(255,200,71,.5) inset}
@keyframes reticle{0%,100%{opacity:.55}50%{opacity:1}}
.sd-mon.acting .sd-spr{filter:drop-shadow(0 0 7px var(--cyan)) drop-shadow(0 5px 5px rgba(0,0,0,.4))}

.statbar{width:min(250px,96%);min-width:0;box-sizing:border-box;background:rgba(248,250,252,.94);border:1px solid rgba(0,0,0,.28);border-radius:9px;
  padding:4px 9px 5px;box-shadow:0 3px 7px rgba(0,0,0,.3);color:#151c28;margin-bottom:5px;z-index:3}
.statbar .sb-top{display:flex;align-items:center;gap:5px}
.sb-name{font-family:var(--dispf);font-weight:700;font-size:15px;color:#0e1420;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-lv{margin-left:auto;font-family:var(--monof);font-size:11px;color:#5a6472;font-weight:700}
.sb-tera{color:var(--tera);font-size:12px}
.sb-track{height:9px;background:#2f3540;border-radius:4px;overflow:hidden;margin:3px 0}
.sb-fill{display:block;height:100%;border-radius:4px;transition:width 1.15s cubic-bezier(.35,0,.2,1),background-color .3s}
.sb-bot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.sb-num{font-family:var(--monof);font-size:12.5px;font-weight:700;color:#2a3140}
.sb-badges{display:flex;gap:3px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.sb-type{font-size:10px;font-weight:800;color:#fff;padding:1px 5px;border-radius:3px;letter-spacing:.02em}
.sb-st{font-family:var(--monof);font-size:10.5px;font-weight:700;padding:1px 4px;border-radius:3px}
.sb-stg{font-family:var(--monof);font-size:10.5px;font-weight:700;padding:1px 4px;border-radius:3px}
.sb-stg.up{background:#8ee6a0;color:#123}.sb-stg.dn{background:#f2a6a0;color:#311}

.sd-slot{position:relative;display:flex;align-items:flex-end;justify-content:center;height:122px;width:100%}
.sd-plat{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:132px;height:36px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 30%, #d7f2bd 0%, #97d47b 42%, #6cbb5b 70%, rgba(108,187,91,0) 78%);
  box-shadow:0 10px 14px rgba(0,0,0,.2)}
.sd-plat::after{content:'';position:absolute;left:50%;bottom:3px;transform:translateX(-50%);width:86%;height:60%;border-radius:50%;background:radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.18),transparent 70%)}
.sd-mon.foe .sd-plat{width:104px;height:28px;background:radial-gradient(ellipse at 50% 30%, #d3ecd8 0%, #9ccaa6 42%, #79b6a2 70%, rgba(121,182,162,0) 78%)}
.sd-spr{position:relative;z-index:1;image-rendering:pixelated;filter:drop-shadow(0 5px 5px rgba(0,0,0,.4))}
.sd-spr.foe{width:98px;height:98px;object-fit:contain}
.sd-spr.ally{width:122px;height:122px;object-fit:contain}
.sd-check{position:absolute;top:0;right:14%;z-index:4;width:22px;height:22px;border-radius:50%;background:var(--good);color:#04140a;display:grid;place-items:center;font-size:12px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.sd-arrow{position:absolute;top:-4px;left:50%;transform:translateX(-50%);color:#0e6b5c;font-size:16px;animation:bob 1s infinite;z-index:4;text-shadow:0 1px 2px rgba(255,255,255,.6)}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(4px)}}
.sd-slot .flash{position:absolute;inset:0;border-radius:12px;opacity:0;pointer-events:none;mix-blend-mode:screen;z-index:2}

.controls{padding:12px 14px 16px;background:linear-gradient(180deg,var(--bg1),var(--bg0))}
.sd-chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.sd-chip{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:11px;background:var(--panel);border:1px solid var(--line2);text-align:left;min-width:0;transition:.15s}
.sd-chip img{width:30px;height:30px;image-rendering:pixelated;flex:none}
.sd-chip .sc-i{min-width:0;flex:1}
.sd-chip .sc-i b{display:block;font-family:var(--dispf);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd-chip .sc-i em{display:block;font-style:normal;font-size:11px;color:var(--txt-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.sd-chip.set{border-color:rgba(72,208,106,.45)}.sd-chip.set .sc-i em{color:var(--cyan)}
.sd-chip.cur{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.sc-k{margin-left:auto;color:var(--txt-mute);font-size:12px}
.sd-ask{font-size:14.5px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sd-ask b{color:var(--cyan)}
.sd-held{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 10px;font-family:var(--monof);font-size:11px;font-weight:700}
.sd-held .held-ab{color:var(--txt-mute)}
.sd-held .held-it{color:var(--gold);background:rgba(255,200,71,.12);border:1px solid rgba(255,200,71,.35);border-radius:6px;padding:2px 8px}
.sd-held .held-warn{color:var(--red);background:rgba(255,91,118,.1);border:1px solid rgba(255,91,118,.35);border-radius:6px;padding:2px 8px}
.sd-step{margin-left:auto;font-family:var(--monof);font-size:11px;color:var(--txt-dim)}
.sd-moves{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sd-move{position:relative;display:flex;flex-direction:column;gap:3px;padding:11px 12px;border-radius:12px;text-align:left;min-height:64px;
  background:var(--tc);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);border:1px solid rgba(0,0,0,.35);
  box-shadow:0 3px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .1s,filter .1s}
.sd-move:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.09)}
.sd-move:active:not(:disabled){transform:scale(.97)}
.sd-move:disabled{opacity:.4;filter:grayscale(.4)}
.sd-move .mv-name{font-family:var(--dispf);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd-move .mv-aim{font-size:11px;opacity:.85}
.sd-move .mv-line{display:flex;justify-content:space-between;font-family:var(--monof);font-size:9.5px;font-weight:700;opacity:.96}
.sd-move .mv-type{text-transform:uppercase}
.sd-move .mv-dmg{font-family:var(--monof);font-size:10px;font-weight:700}
.sd-move .mv-dmg .ko{background:rgba(0,0,0,.32);padding:0 4px;border-radius:3px}
.sd-extra{display:flex;gap:9px;margin-top:10px}
.sd-ex{flex:1;padding:11px;border-radius:11px;background:var(--panel);border:1px solid var(--line2);color:var(--txt);font-weight:700;font-size:13px}
.sd-ex:hover:not(:disabled){border-color:var(--blue)}
.sd-ex.tera.on{background:linear-gradient(135deg,var(--tera),#B31E77);color:#fff;border:none;box-shadow:0 0 14px rgba(255,72,176,.4)}
.sd-ex:disabled{opacity:.4}
.sd-targets{display:flex;gap:10px;flex-wrap:wrap}
.sd-tgt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--gold);color:var(--txt);font-weight:700;font-size:12.5px}
.sd-tgt.ally{border-color:var(--cyan);background:rgba(47,227,196,.08)}
.sd-tgt img{width:54px;height:54px;image-rendering:pixelated}
.sd-tgt:hover{background:rgba(255,200,71,.12);transform:translateY(-2px)}
.sd-back{margin-top:10px;color:var(--txt-dim);font-weight:700;text-decoration:underline;font-size:13px}
.sd-go{width:100%;padding:15px;border-radius:13px;font-family:var(--dispf);font-size:21px;letter-spacing:.05em;background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));color:#04141A;border:none;font-weight:700;box-shadow:0 8px 22px rgba(47,227,196,.32);transition:.15s}
.sd-go:hover{transform:translateY(-2px)}
.sd-hint{text-align:center;color:var(--txt-mute);font-size:12px;margin-top:8px}
.sd-wait{padding:18px;text-align:center;color:var(--cyan);font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.sd-spin{width:15px;height:15px;border:2px solid var(--cyan);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:560px){
  .sd-spr.ally{width:104px;height:104px}.sd-spr.foe{width:84px;height:84px}
  .statbar{width:98%}.sd-side.foes{padding:0 2% 0 8%}.sd-side.allies{padding:6px 8% 0 2%}
  .sd-move{min-height:58px;padding:9px 10px}
}

/* impact FX, callouts, weather overlays */
.fx-ring{position:absolute;width:20px;height:20px;border:3px solid #fff;border-radius:50%;transform:translate(-50%,-50%) scale(.3);opacity:.9;animation:ringExpand .55s ease-out forwards;pointer-events:none}
@keyframes ringExpand{to{transform:translate(-50%,-50%) scale(4.4);opacity:0}}
.fx-pt{position:absolute;width:7px;height:7px;border-radius:50%;animation:ptFly .5s ease-out forwards;pointer-events:none;box-shadow:0 0 6px currentColor}
@keyframes ptFly{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3)}}
.dpop{position:absolute;transform:translate(-50%,0);font-family:var(--dispf);font-weight:700;font-size:30px;color:#fff;text-shadow:0 2px 0 #000,0 0 14px rgba(0,0,0,.9);pointer-events:none;animation:dfloat 1.15s ease-out forwards;z-index:50}
.dpop.crit{color:var(--gold);font-size:38px;text-shadow:0 2px 0 #000,0 0 18px var(--gold)}
@keyframes dfloat{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}18%{opacity:1;transform:translate(-50%,-6px) scale(1.25)}40%{transform:translate(-50%,-14px) scale(1)}100%{opacity:0;transform:translate(-50%,-48px) scale(.95)}}
.callout{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--dispf);font-weight:700;letter-spacing:.03em;font-size:clamp(26px,6vw,46px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 22px rgba(0,0,0,.55);pointer-events:none;z-index:55;white-space:nowrap;animation:calloutPop 1.15s cubic-bezier(.2,1.4,.4,1) forwards}
.callout.se{color:var(--gold)}
.callout.crit{color:#ff5b76}
.callout.tera{color:var(--tera)}
.callout.weak,.callout.miss{color:#cdd6e6;font-size:clamp(20px,4vw,30px)}
.callout.faint{color:#ff9aa8}
@keyframes calloutPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-4deg)}22%{opacity:1;transform:translate(-50%,-50%) scale(1.14) rotate(-2deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-2deg)}100%{opacity:0;transform:translate(-50%,-58%) scale(1)}}
.turn-banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-family:var(--dispf);font-weight:700;letter-spacing:.08em;font-size:15px;color:var(--gold);background:rgba(10,14,22,.82);border:1px solid rgba(255,200,71,.5);border-radius:999px;padding:6px 18px;z-index:55;pointer-events:none;animation:tban 1.4s ease forwards;text-transform:uppercase}
@keyframes tban{0%{opacity:0;transform:translateX(-50%) translateY(-8px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-6px)}}
.wx{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.wx.w-rain{background:rgba(20,40,80,.16)}
.wx.w-rain::before{content:'';position:absolute;inset:-30%;background-image:repeating-linear-gradient(108deg,rgba(210,228,255,.7) 0 1.5px,transparent 1.5px 11px);animation:wxfall .45s linear infinite;opacity:.55}
.wx.w-sand{background:rgba(200,168,104,.2)}
.wx.w-sand::before{content:'';position:absolute;inset:-30%;background-image:repeating-linear-gradient(100deg,rgba(214,182,120,.3) 0 2px,transparent 2px 11px);animation:wxfall .7s linear infinite}
.wx.w-sun{background:radial-gradient(circle at 72% 6%,rgba(255,224,130,.4),transparent 55%)}
.wx.w-snow::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,#fff 1.3px,transparent 1.8px);background-size:24px 24px;animation:wxsnow 3s linear infinite;opacity:.6}
@keyframes wxfall{to{transform:translateY(46px)}}
@keyframes wxsnow{to{background-position:8px 44px}}
.wx.t-grassy{box-shadow:inset 0 -70px 60px -34px rgba(60,200,90,.45)}
.wx.t-electric{box-shadow:inset 0 -70px 60px -34px rgba(255,220,60,.45)}
.wx.t-psychic{box-shadow:inset 0 -70px 60px -34px rgba(230,80,200,.42)}
.wx.t-misty{box-shadow:inset 0 -70px 60px -34px rgba(255,150,220,.42)}
/* projectile / slash / hit-flash */
.fx-proj{position:absolute;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);animation:projFly linear forwards;z-index:48;pointer-events:none}
@keyframes projFly{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)))}}
.fx-slash{position:absolute;width:78px;height:78px;z-index:49;pointer-events:none;border-radius:50%;mix-blend-mode:screen;
  background:linear-gradient(115deg,transparent 34%,#fff 47%,var(--c) 52%,transparent 66%);animation:slashFx .32s ease-out forwards}
@keyframes slashFx{0%{opacity:0;transform:translate(-50%,-50%) rotate(-28deg) scale(.4)}45%{opacity:1;transform:translate(-50%,-50%) rotate(-28deg) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(-28deg) scale(1.35)}}
.sd-spr.whiteflash{animation:whiteHit .28s ease-out}
@keyframes whiteHit{0%,32%{filter:brightness(6) saturate(.15) drop-shadow(0 5px 5px rgba(0,0,0,.4))}100%{filter:drop-shadow(0 5px 5px rgba(0,0,0,.4))}}

/* ===== VGC polish: tera, speed tiers, party bars, move tags ===== */
.tera-gem{display:inline-block;color:var(--tg);font-size:11px;line-height:1;text-shadow:0 0 5px var(--tg);opacity:.9}
.tera-gem.on{opacity:1;font-size:13px;animation:gemPulse 1.4s infinite;text-shadow:0 0 8px var(--tg),0 0 16px var(--tg)}
@keyframes gemPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
.statbar.tera-on{box-shadow:0 3px 7px rgba(0,0,0,.3),0 0 0 2px var(--tg),0 0 14px -2px var(--tg)}
.sb-spe{font-family:var(--monof);font-size:10.5px;font-weight:700;padding:1px 4px;border-radius:3px;background:#dfe6ef;color:#2a3140}
.sb-spe.fast{background:#4ec36a;color:#06240f}
.sb-spe.mid{background:#f0c040;color:#3a2c00}
.sb-spe.slow{background:#e97b7b;color:#3a0d0d}
.sb-item-row{margin-top:3px;text-align:right;line-height:1}
.sb-item{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;font-family:var(--monof);font-size:11px;font-weight:700;color:#3a4350;background:#eef2f7;border:1px solid #d7dee7;border-radius:4px;padding:1px 6px}
.party{display:flex;gap:5px;position:relative;z-index:3;padding:0 6px}
.party.foe{justify-content:flex-end;margin-bottom:3px}
.party.ally{justify-content:flex-start;margin-top:5px}
.pb{width:26px;height:26px;border-radius:50%;position:relative;background:rgba(255,255,255,.8);border:2px solid rgba(0,0,0,.28);box-shadow:0 2px 4px rgba(0,0,0,.25)}
.pb-img{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.pb-img img{width:100%;height:100%;object-fit:contain}
.pb-tera{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--bg0);transform:rotate(45deg);box-shadow:0 0 3px rgba(0,0,0,.45);z-index:2}
.pb img{width:24px;height:24px;image-rendering:pixelated;object-fit:contain}
.pb.ko{filter:grayscale(1);opacity:.35}
.pb.act{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(47,227,196,.55)}
.party.foe .pb.act{border-color:var(--red);box-shadow:0 0 0 2px rgba(255,91,118,.55)}
.mv-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.mv-tags{display:flex;gap:4px}
.mv-tag{font-family:var(--monof);font-size:8.5px;font-weight:700;background:rgba(0,0,0,.3);padding:1px 4px;border-radius:3px}
.sd-move .mv-dmg .mko{background:rgba(0,0,0,.2);padding:0 4px;border-radius:3px;opacity:.95}
.sd-ex.tera.on{background:var(--tg);color:#fff;border:none;text-shadow:0 1px 2px rgba(0,0,0,.5);box-shadow:0 0 16px -2px var(--tg)}
.sd-keys{margin-top:10px;font-family:var(--monof);font-size:10px;color:var(--txt-mute);text-align:center}
.sd-keys b{color:var(--txt-dim)}
@media(max-width:640px){.sd-keys{display:none}}
.fchip.tera.you{border-color:rgba(47,227,196,.5);color:var(--cyan);background:rgba(47,227,196,.08)}
.fchip.tera.foe{border-color:rgba(255,91,118,.5);color:var(--red);background:rgba(255,91,118,.08)}
.fchip.tera.spent{opacity:.5;color:var(--txt-mute);border-color:var(--line)}
/* bench / preview cards */
.pick.bench,.pick.pv{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px}
.pick .bp-nm{display:flex;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:800;margin-top:6px;line-height:1.2;text-align:center}
.pick .bp-hp{display:block;width:100%;height:5px;background:var(--panel3);border-radius:3px;overflow:hidden;margin-top:3px}
.pick .bp-hp i{display:block;height:100%;border-radius:3px}
.pick .bp-meta{display:block;font-family:var(--monof);font-size:11px;color:var(--txt-dim);margin-top:4px;font-weight:700}
.pick .bp-item{display:block;font-family:var(--monof);font-size:11px;color:var(--gold);margin-top:4px;max-width:100%;white-space:normal;line-height:1.3;text-overflow:ellipsis;font-weight:400}
.pick .bp-moves{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;width:100%}
.pick .bp-mv{font-family:var(--monof);font-size:10px;font-weight:700;color:var(--txt);background:var(--panel);border-left:3px solid var(--mc);border-radius:4px;padding:3px 5px;line-height:1.15;white-space:normal;text-align:left;overflow:hidden}
/* game over */
.ov-stats{display:flex;justify-content:center;gap:18px;margin:4px 0 14px;font-family:var(--monof);font-size:11.5px;color:var(--txt-dim);flex-wrap:wrap}
.ov-stats b{color:var(--txt);font-size:15px}
.ov-surv{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.ov-lb{font-family:var(--monof);font-size:10px;color:var(--txt-mute);text-transform:uppercase;letter-spacing:.08em}
.ov-s{width:34px;height:34px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;overflow:hidden}
.ov-s img{width:30px;height:30px;image-rendering:pixelated}
/* builder */
.tera-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--monof);font-size:9.5px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--tg);padding:2px 7px;border-radius:5px;text-shadow:0 1px 2px rgba(0,0,0,.45);box-shadow:0 0 10px -3px var(--tg)}
.ty-set{opacity:.85;margin-left:3px}
.icon-dup{position:absolute;top:10px;right:42px;width:26px;height:26px;border-radius:8px;z-index:2;background:rgba(61,139,255,.12);border:1px solid rgba(61,139,255,.4);color:var(--blue);display:grid;place-items:center;font-size:12px}
.icon-dup:hover{background:var(--blue);color:#fff}
.warn-chip{display:inline-block;font-size:10.5px;font-weight:700;color:#ffca6b;background:rgba(255,200,71,.12);border:1px solid rgba(255,200,71,.4);padding:2px 7px;border-radius:5px;margin-left:6px}
.warn-chip.soft{color:var(--txt-dim);background:var(--panel2);border-color:var(--line2)}
.tcov-wrap{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:14px}
.tcov{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:7px}
.tc{display:flex;align-items:center;gap:5px;padding:5px 7px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.tc.danger{border-color:rgba(255,91,118,.6);background:rgba(255,91,118,.1)}
.tc.safe{opacity:.5}
.tc-t{font-family:var(--monof);font-size:8.5px;font-weight:800;color:#fff;padding:2px 4px;border-radius:4px;text-shadow:0 1px 1px rgba(0,0,0,.45)}
.tc-n{font-family:var(--monof);font-size:11px;font-weight:700}
.tc-n.weak{color:var(--red);margin-left:auto}
.tc-n.res{color:var(--hp-hi)}
.tcov-key{display:flex;align-items:center;gap:14px;margin-top:11px;font-size:11px;color:var(--txt-mute);flex-wrap:wrap}
.tcov-key i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle}
.k-weak{background:var(--red)}.k-res{background:var(--hp-hi)}
.k-note{margin-left:auto}
.ev-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.evp{padding:7px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);color:var(--txt-dim);font-size:11.5px;font-weight:700}
.evp:hover{border-color:var(--cyan);color:var(--cyan)}
.evp.clr:hover{border-color:var(--red);color:var(--red)}

/* ===== scouting report, target damage, move info ===== */
.sd-mon.scoutable{cursor:help}
.sd-mon.scoutable:hover .statbar{box-shadow:0 3px 7px rgba(0,0,0,.3),0 0 0 2px var(--blue)}
.sb-prot{font-size:11px;padding:1px 3px;border-radius:3px;background:#cfe0f5;color:#1d3c63}
.sc-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sc-spr{width:76px;height:76px;image-rendering:pixelated;filter:drop-shadow(0 4px 5px rgba(0,0,0,.4))}
.sc-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:10px}

  if(!soundEnabled) return; initAudio(); if(!audioCtx) return;

}

/* ---- move fetch/cache for anything not curated ---- */
const moveCache = {};
function moveKeyFromName(name){ return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function findMoveIdByName(name){
  const target = name.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  for(const id in MOVES_DB){ if(MOVES_DB[id].name.toLowerCase().replace(/[^a-z0-9]/g,'')===target) return id; }
  return null;
}
async function fetchMoveData(slug){
  slug = moveKeyFromName(slug);
  if(moveCache[slug]) return moveCache[slug];
  try{
    const r = await fetchWithTimeout('https://pokeapi.co/api/v2/move/'+slug);
    if(!r.ok) throw 0;
    const d = await r.json();
    const cat = d.damage_class.name === 'status' ? 'status' : (d.damage_class.name==='physical'?'physical':'special');
    const m = {
      name: d.names.find(n=>n.language.name==='en')?.name || cap(slug.replace(/-/g,' ')),
      type: d.type.name, cat, pow: d.power||0, acc: d.accuracy||100, pr: d.priority||0,
      contact: (d.meta && d.meta.flinch_chance!=null) ? false : false
    };
    if(d.meta){
      if(d.meta.drain>0) m.drain = d.meta.drain/100;
      if(d.meta.drain<0) m.recoil = Math.abs(d.meta.drain)/100;
      if(d.meta.healing>0) { m.statusMove='heal'; m.heal=d.meta.healing/100; }
      if(d.meta.flinch_chance>0) m.flinch = d.meta.flinch_chance/100;
      if(d.meta.max_hits) m.multi = d.meta.max_hits;
      if(d.meta.crit_rate>0) m.highCrit = true;
      if(d.meta.ailment && d.meta.ailment.name!=='none'){
        const map={paralysis:'PAR',burn:'BRN',poison:'PSN','toxic':'TOX',freeze:'FRZ',sleep:'SLP',confusion:'confuse'};
        const st = map[d.meta.ailment.name];
        if(st){
          if(cat==='status'){ m.statusMove='inflict'; m.infStatus= st==='confuse'?'PSN':st; }
          else if(d.meta.ailment_chance>0) m.sec={chance:d.meta.ailment_chance/100, status:st};
        }
      }
    }
    if(d.stat_changes && d.stat_changes.length && cat==='status'){
      const sb={}; const smap={attack:'atk',defense:'def','special-attack':'spa','special-defense':'spd',speed:'spe'};
      d.stat_changes.forEach(sc=>{ const k=smap[sc.stat.name]; if(k) sb[k]=sc.change; });
      if(Object.keys(sb).length){ m.statusMove='setup'; m.selfBoost=sb; }
    }
    const tgt=d.target.name;
    if(tgt==='all-opponents') m.spread=true;
    if(tgt==='all-other-pokemon') m.spreadAll=true;
    if(!m.statusMove && cat==='status') m.statusMove='nothing';
    moveCache[slug]=m; return m;
  }catch(e){ return null; }
}

const FALLBACK_SPRITE = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#F5EFDE" stroke="#241A2E" stroke-width="4"/><path d="M4 50a46 46 0 0 1 92 0z" fill="#E6483F" stroke="#241A2E" stroke-width="4"/><line x1="4" y1="50" x2="96" y2="50" stroke="#241A2E" stroke-width="4"/><circle cx="50" cy="50" r="13" fill="#F5EFDE" stroke="#241A2E" stroke-width="4"/><circle cx="50" cy="50" r="5" fill="#241A2E"/></svg>`);
function spriteFallback(img){ if(img.dataset.fb) return; img.dataset.fb='1'; img.src=FALLBACK_SPRITE; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function fetchWithTimeout(url, ms=7000){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),ms);
  try{ return await fetch(url,{signal:ctrl.signal}); } finally{ clearTimeout(t); }
}
function resolveSpriteUrl(d){

function highestStat(base){ const keys=['atk','def','spa','spd','spe']; let best='atk',bv=-1; keys.forEach((k,i)=>{ if(base[i+1]>bv){bv=base[i+1];best=k;} }); return best; }

function sideOf(m){ return playerTeam.includes(m) ? 'p' : 'a'; }

   ============================================================ */
function stageMult(s){ return s>=0 ? (2+s)/2 : 2/(2-s); }

  if(k==='spe' && u.item==='Choice Scarf') v=Math.floor(v*1.5);
  if(k==='spa' && u.item==='Choice Specs') v=Math.floor(v*1.5);
  if(k==='atk' && u.item==='Choice Band') v=Math.floor(v*1.5);
  if(k==='spd' && u.item==='Assault Vest') v=Math.floor(v*1.5);
  if((k==='def'||k==='spd') && u.item==='Eviolite') v=Math.floor(v*1.5);
  if(k==='atk' && (u.ability==='Huge Power'||u.ability==='Pure Power')) v*=2;
  if(k==='atk' && u.ability==='Guts' && u.status) v=Math.floor(v*1.5);
  if(k==='atk' && u.ability==='Orichalcum Pulse' && curWeather()==='sun') v=Math.floor(v*1.3333);
  if(k==='spa' && u.ability==='Hadron Engine' && terrain==='electric') v=Math.floor(v*1.3333);
  if(k==='spa' && u.ability==='Solar Power' && curWeather()==='sun') v=Math.floor(v*1.5);
  if((u.ability==='Protosynthesis' && (curWeather()==='sun'||u.item==='Booster Energy')) ||

    if(k===u.boostStat) v=Math.floor(v*(k==='spe'?1.5:1.3));
  }
  if(k==='atk' && ruinActive('Tablets of Ruin',u)) v=Math.floor(v*0.75);
  if(k==='def' && ruinActive('Sword of Ruin',u)) v=Math.floor(v*0.75);
  if(k==='spa' && ruinActive('Vessel of Ruin',u)) v=Math.floor(v*0.75);
  if(k==='spd' && ruinActive('Beads of Ruin',u)) v=Math.floor(v*0.75);
  if(k==='spe'){
    if(u.ability==='Chlorophyll'&&curWeather()==='sun')v*=2;
    if(u.ability==='Swift Swim'&&curWeather()==='rain')v*=2;
    if(u.ability==='Sand Rush'&&curWeather()==='sand')v*=2;
    if(u.ability==='Slush Rush'&&curWeather()==='snow')v*=2;

function statForDamage(m, k, crit, offensive){
  if(!crit) return getStat(m,k);

}

/* ============================================================
   TYPE EFFECTIVENESS + DAMAGE
   ============================================================ */
// items that can't be knocked off / tricked away (form-defining)
function canLoseItem(m){ return !!(m && m.item && m.item!=='No Item' && !m.usedItem && !/Mask|Rusted/.test(m.item)); }
// -ate abilities & Liquid Voice: change a move's type before damage/effectiveness are figured
function effectiveMoveType(move, attacker){
  const ab=attacker.ability;
  // Ivy Cudgel takes its type from Ogerpon's held mask
  if(move.teraBlast && attacker.isTera) return attacker.teraType;
  if(move.maskMove){ return {'Wellspring Mask':'water','Hearthflame Mask':'fire','Cornerstone Mask':'rock','Teal Mask':'grass'}[attacker.item] || 'grass'; }
  if(ab==='Liquid Voice' && move.sound) return 'water';
  if(move.type==='normal'){
    if(ab==='Pixilate') return 'fairy';
    if(ab==='Refrigerate') return 'ice';
    if(ab==='Aerilate') return 'flying';
    if(ab==='Galvanize') return 'electric';
  }

}
function ateBoosted(move, attacker){
  return move.type==='normal' && ['Pixilate','Refrigerate','Aerilate','Galvanize'].includes(attacker.ability);
}
function effMult(move, attacker, defender){
  const _et=effectiveMoveType(move,attacker);
  if(_et!==move.type) move={...move,type:_et};
  const scrappy = attacker.ability==='Scrappy'||attacker.ability==="Mind's Eye";
  let mult=1;
  for(const t of defender.types){
    let m;
    if(move.freezeDry && t==='water') m=2;
    else { m=(TYPE_CHART[move.type]||{})[t]; if(m===undefined)m=1; }

}

  if(move.teraBlast && attacker.isTera && getStat(attacker,'atk')>getStat(attacker,'spa')) move={...move,cat:'physical'};

  if(move.acrobatics && (attacker.item==='No Item'||attacker.usedItem)) power*=2;
  if(attacker.ability==='Technician' && power<=60) power=Math.floor(power*1.5);
  if(grounded(attacker)){
    if(terrain==='grassy'&&move.type==='grass') power=Math.floor(power*1.3);
    if(terrain==='electric'&&move.type==='electric') power=Math.floor(power*1.3);
    if(terrain==='psychic'&&move.type==='psychic') power=Math.floor(power*1.3);
  }
  if(terrain==='misty'&&move.type==='dragon'&&grounded(defender)) power=Math.floor(power*0.5);

  if(defender.ability==='Multiscale'&&defender.hp===defender.maxHp && attacker.ability!=='Mold Breaker') mod*=0.5;
  if(defender.ability==='Thick Fat'&&(move.type==='fire'||move.type==='ice')) mod*=0.5;
  if(defender.ability==='Ice Scales'&&move.cat==='special') mod*=0.5;

  if(attacker.item==='Wise Glasses'&&move.cat==='special') mod*=1.1;

}
function damageRange(attacker, defender, move, spread){

   STATUS

const STATUS_NAME={BRN:'was burned!',PAR:'is paralyzed!',PSN:'was poisoned!',TOX:'was badly poisoned!',SLP:'fell asleep!',FRZ:'was frozen solid!'};
const STATUS_ICON={BRN:'🔥',PAR:'⚡',PSN:'☠️',TOX:'☠️',SLP:'😴',FRZ:'❄️'};
function statusBlocked(target, status, attacker, powder){
  if(!target||target.hp<=0) return true;
  if(status!=='confuse' && target.status) return true;
  if(target.ability==='Purifying Salt') return true;
  if(target.ability==='Comatose') return true;
  if(powder && (target.types.includes('grass')||target.item==='Safety Goggles'||target.ability==='Overcoat')) return true;
  if(terrain==='misty' && grounded(target)) return true;
  if((status==='SLP') && terrain==='electric' && grounded(target)) return true;
  if(status==='BRN' && (target.types.includes('fire')||target.ability==='Water Veil'||target.ability==='Thermal Exchange')) return true;
  if(status==='PAR' && target.types.includes('electric')) return true;
  if((status==='PSN'||status==='TOX') && (target.types.includes('poison')||target.types.includes('steel')) && (!attacker||attacker.ability!=='Corrosion')) return true;
  if(status==='FRZ' && (target.types.includes('ice')||curWeather()==='sun')) return true;
  if(target.ability==='Limber' && status==='PAR') return true;
  if((target.ability==='Insomnia'||target.ability==='Vital Spirit'||target.ability==='Sweet Veil') && status==='SLP') return true;
  return false;
}
function inflictStatus(target, status, attacker, powder){
  if(status==='confuse'){ if(target.confuse>0||target.ability==='Own Tempo'||(terrain==='misty'&&grounded(target))){ return false; } target.confuse=Math.floor(Math.random()*4)+2; logMsg(`${target.name} became confused!`,'s'); return true; }
  if(statusBlocked(target,status,attacker,powder)){ return false; }
  target.status=status; target.toxicN = status==='TOX'?1:0; target.sleepT = status==='SLP'?(Math.floor(Math.random()*3)+1):0;
  sfx.stat(); logMsg(`${STATUS_ICON[status]} ${target.name} ${STATUS_NAME[status]}`,'s');
  if(target.item==='Lum Berry' || (target.item==='Chesto Berry'&&status==='SLP')){ target.status=null; target.toxicN=0; target.sleepT=0; logMsg(`🍓 ${target.name}'s ${target.item} cured it!`,'i'); target.item='No Item'; target.usedItem=true; }
  if(target.ability==='Synchronize' && attacker && (status==='BRN'||status==='PSN'||status==='TOX'||status==='PAR')) inflictStatus(attacker,status==='TOX'?'PSN':status,target);
  return true;
}
function tryBoost(target, boosts, source, silent){
  let changed=false;
  for(const k in boosts){
    let d=boosts[k];
    if(d<0 && target!==source){
      if(target.item==='Clear Amulet'){ if(!silent)logMsg(`${target.name}'s Clear Amulet blocks stat drops!`,'i'); continue; }
      if(['Clear Body','White Smoke','Full Metal Body'].includes(target.ability)){ if(!silent)logMsg(`${target.name}'s ${target.ability} prevents stat loss!`,'i'); continue; }
      if(target.ability==='Defiant'){ target.stages.atk=Math.min(6,target.stages.atk+2); logMsg(`${target.name}'s Defiant sharply raised Attack!`,'i'); }
      if(target.ability==='Competitive'){ target.stages.spa=Math.min(6,target.stages.spa+2); logMsg(`${target.name}'s Competitive sharply raised Sp. Atk!`,'i'); }
    }
    const before=target.stages[k]||0;
    target.stages[k]=Math.max(-6,Math.min(6,before+d));
    if(target.stages[k]!==before){ changed=true; }
  }
  if(changed && !silent){ sfx.stat(); }
  return changed;
}

/* ============================================================

   ============================================================ */
function setWeather(w, turns, who){ if(weather===w) return; weather=w; weatherT=turns||5; const names={sun:'The sunlight turned harsh!',rain:'It started to rain!',sand:'A sandstorm kicked up!',snow:'It started to snow!'}; logMsg('🌤️ '+(names[w]||''), 'i'); }
function setTerrain(t, turns){ if(terrain===t) return; terrain=t; terrainT=turns||5; const names={grassy:'Grass sprouted across the field!',electric:'Electricity crackled across the field!',psychic:'The field became weird!',misty:'Mist swirled around the field!'}; logMsg('🌐 '+(names[t]||''),'i'); }
function triggerEntry(m){
  if(!m||m.hp<=0) return;
  const foes = activeMons(oppSide(sideOf(m)));
  if(m.ability==='Intimidate'){ logMsg(`${m.name}'s Intimidate cuts foes' Attack!`,'i'); foes.forEach(f=>{ if(f&&f.hp>0 && !['Inner Focus','Own Tempo','Oblivious','Scrappy','Clear Body','White Smoke','Full Metal Body'].includes(f.ability) && f.item!=='Clear Amulet') tryBoost(f,{atk:-1},m,true); }); }
  const wmap={Drought:'sun',Drizzle:'rain','Sand Stream':'sand','Snow Warning':'snow','Orichalcum Pulse':'sun'};
  if(wmap[m.ability]){ if(weather!==wmap[m.ability]) logMsg(`[${m.name}'s ${m.ability}]`,'i'); setWeather(wmap[m.ability],5); }
  const tmap={'Grassy Surge':'grassy','Electric Surge':'electric','Psychic Surge':'psychic','Misty Surge':'misty','Hadron Engine':'electric'};
  if(tmap[m.ability]){ if(terrain!==tmap[m.ability]) logMsg(`[${m.name}'s ${m.ability}]`,'i'); setTerrain(tmap[m.ability],5); }
  if(m.ability==='Air Lock'||m.ability==='Cloud Nine'){ if(weather!=='clear') logMsg(`${m.name}'s ${m.ability}: the effects of the weather disappeared.`,'i'); }

/* ============================================================
   TURN ORDER
   ============================================================ */
function getPriority(act){
  if(act.action.type==='switch') return 6;
  const m=act.unit.moves[act.action.move]; if(!m) return 0;
  let p=m.pr||0;
  if(act.unit.ability==='Prankster'&&m.cat==='status') p+=1;
  if(act.unit.ability==='Gale Wings'&&m.type==='flying'&&act.unit.hp===act.unit.maxHp) p+=1;
  if(m.grassyPriority&&terrain==='grassy'&&grounded(act.unit)) p+=1;
  if(act.unit.ability==='Quick Draw'&&Math.random()<0.3) p+=0; // cosmetic
  return p;
}
function orderActions(){
  const actions=[];
  [0,1].forEach(slot=>{ if(pendingActions[slot]) actions.push({side:'p',slot,unit:playerTeam[pActive[slot]],action:pendingActions[slot]}); });
  aiPlan=null;
  let aiActs={};
  [0,1].forEach(slot=>{ const u=aiTeam[aActive[slot]]; if(u&&u.hp>0){ const a=aiChoose(u,slot); if(a) aiActs[slot]=a; } });
  try{ aiActs=aiLookahead(aiActs); }catch(e){ /* fall back to the heuristic choice */ }
  [0,1].forEach(slot=>{ const u=aiTeam[aActive[slot]]; if(u&&u.hp>0&&aiActs[slot]) actions.push({side:'a',slot,unit:u,action:aiActs[slot]}); });
  actions.sort((a,b)=>{
    const pa=getPriority(a), pb=getPriority(b);
    if(pa!==pb) return pb-pa;
    const sa=getStat(a.unit,'spe')*(tailwind[a.side]?2:1);
    const sb=getStat(b.unit,'spe')*(tailwind[b.side]?2:1);
    if(sa===sb) return Math.random()-0.5;
    return trickRoom ? sa-sb : sb-sa;
  });
  return actions;
}
// AI helper: the most damage a foe's best damaging move could deal to a target
function foeBestDamageVs(foe, target){
  let mx=0, koMove=null;
  foe.moves.forEach(mv=>{ if(mv.cat==='status'||!mv.pow||mv.pp<=0) return; const r=damageRange(foe,target,mv,false); if(r.max>mx){ mx=r.max; koMove=mv; } });
  return {dmg:mx, ko:mx>=target.hp};
}

function aiImmune(f, mv, u){

  const t=effectiveMoveType(mv,u), ab=f.ability;
  if(t==='ground' && (ab==='Levitate'||ab==='Earth Eater'||f.item==='Air Balloon')) return true;
  if(t==='water' && ['Water Absorb','Storm Drain','Dry Skin'].includes(ab)) return true;
  if(t==='electric' && ['Volt Absorb','Lightning Rod','Motor Drive'].includes(ab)) return true;
  if(t==='fire' && ['Flash Fire','Well-Baked Body'].includes(ab)) return true;
  if(t==='grass' && ab==='Sap Sipper') return true;
  return false;
}
function aiPriorityBlocked(u, mv, f){
  if(movePriority(u,mv)<=0 || u.ability==='Mold Breaker') return false;
  if(terrain==='psychic' && grounded(f)) return true;
  return activeMons('p').some(x=>x&&x.hp>0&&['Armor Tail','Queenly Majesty','Dazzling'].includes(x.ability));
}
function aiStatusFits(u, mv, f){
  if(!f||f.hp<=0||f.status) return false;
  if(f.ability==='Good as Gold'&&u.ability!=='Mold Breaker') return false;
  if(u.ability==='Prankster'&&f.types.includes('dark')) return false;
  if(mv.powder && (f.types.includes('grass')||f.item==='Safety Goggles'||f.ability==='Overcoat')) return false;

  if(st==='SLP' && ((terrain==='electric'||terrain==='misty')&&grounded(f) || ['Insomnia','Vital Spirit','Sweet Veil','Purifying Salt'].includes(f.ability))) return false;

  if(st==='BRN' && (f.types.includes('fire')||['Water Veil','Thermal Exchange'].includes(f.ability))) return false;
  if((st==='PSN'||st==='TOX') && (f.types.includes('poison')||f.types.includes('steel'))) return false;

function aiChoose(u, slot){

      else if(sm==='helpinghand'){ s = partner&&partner.moves.some(m=>m.cat!=='status')?18:0; }
      else if(sm==='tailwind'){ s = (tailwind.a||trickRoom)?0:(mySpeedAvg<=foeSpeedAvg*1.15?40:18); }
      else if(sm==='trickroom'){ s = trickRoom?0:(mySpeedAvg<foeSpeedAvg?44:2); }

      else if(sm==='screen'){ s = screens.a[mv.screen]?0:20; }
      else if(sm==='weather'){ s = curWeather()===mv.weather?0:22; }
      else if(sm==='terrain'){ s = terrain===mv.terrain?0:20; }
      else if(sm==='partingshot'){ s = threatened?30:10; }

      else if(sm==='trick'){ s = CHOICE_ITEMS.includes(u.item)?24:6; tgt='p'+activeIndex('p',foes[0]); }

// Predict what each of the player's Pokémon will most likely do (public info: their moves, the board).

// Simulate one turn with expected damage and score it from the rival's point of view.
function aiSimulate(plans){

      if(sm==='setup'){ bonus+=sign*0.22; continue; }
      if(sm==='screen'){ if(!screens[side][mv.screen]) bonus+=sign*0.3; continue; }
      if(sm==='taunt'||sm==='encore'){ const t=x.target&&x.target!=='all'?x.target:null; if(t&&t.moves.some(m=>m.cat==='status')) bonus+=sign*0.15; continue; }

    if(defender.protect){ logMsg(`${defender.name} protected itself!`,'s'); if(move.contact&&defender.protectSpiky){ const r=Math.floor(attacker.maxHp/8); attacker.hp=Math.max(0,attacker.hp-r); logMsg(`${attacker.name} was hurt by Spiky Shield!`,'e'); if(attacker.hp<=0)onFaint(attacker);} return {hit:false}; }

  // priority block

  const accMod=stageMult(attacker.stages.acc||0)/stageMult(defender.stages.eva||0);
  if(!(move.noMiss) && Math.random()*100 > acc*accMod){ logMsg(`💨 ${attacker.name}'s ${move.name} missed!`,'s'); return {hit:false}; }

    const roll=0.85+Math.random()*0.15;

  const dmgDealtEff=effMult(move,attacker,defender);

    if(defender.item==='Rocky Helmet'){ const r=Math.floor(attacker.maxHp/6); attacker.hp=Math.max(0,attacker.hp-r); logMsg(`${attacker.name} was hurt by the Rocky Helmet! (-${r})`,'e'); }
    if(defender.hp>0 && !attacker.status){
      if(defender.ability==='Flame Body'&&Math.random()<0.3) inflictStatus(attacker,'BRN',defender);
      else if(defender.ability==='Static'&&Math.random()<0.3) inflictStatus(attacker,'PAR',defender);
      else if(defender.ability==='Poison Point'&&Math.random()<0.3) inflictStatus(attacker,'PSN',defender);
      else if(defender.ability==='Effect Spore'&&Math.random()<0.3){ inflictStatus(attacker,['PAR','PSN','SLP'][Math.floor(Math.random()*3)],defender); }

  if(defender.hp>0 && move.sec && defender.ability!=='Shield Dust' && defender.item!=='Covert Cloak' && attacker.ability!=='Sheer Force'){
    if(Math.random()<move.sec.chance){

    }
  }
  // flinch
  if(defender.hp>0 && move.flinch && defender.item!=='Covert Cloak' && defender.ability!=='Inner Focus'){ if(Math.random()<move.flinch) defender.flinched=true; }
  // weakness policy / stamina / weakness reactions on defender

    if(dmgDealtEff>1 && defender.item==='Weakness Policy'){ tryBoost(defender,{atk:2,spa:2},defender,true); logMsg(`${defender.name}'s Weakness Policy activated!`,'i'); defender.item='No Item'; defender.usedItem=true; }
    if(defender.ability==='Stamina'){ tryBoost(defender,{def:1},defender,true); }
    if(defender.ability==='Thermal Exchange' && move.type==='fire'){ tryBoost(defender,{atk:1},defender,true); logMsg(`${defender.name}'s Thermal Exchange raised its Attack!`,'i'); }
    if(defender.ability==='Anger Point'&&false){}
  }

  const _mt=effectiveMoveType(move,attacker);
  if(defender.hp>0 && dmgDealtEff>1 && ITEM_RESIST_BERRY[defender.item]===_mt){ logMsg(`${defender.name}'s ${defender.item} weakened the damage!`,'i'); defender.item='No Item'; defender.usedItem=true; }
  // sitrus / berry after damage
  postDamageBerries(defender);
