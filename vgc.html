  return {hit:true, ko};
}
function absorbCheck(defender, move, attacker){
  if(attacker.ability==='Mold Breaker') return false;
  const t=move.type;
  if(t==='ground' && defender.ability==='Levitate'){ logMsg(`${defender.name} is unaffected (Levitate)!`,'i'); return true; }
  if(t==='ground' && defender.ability==='Earth Eater'){ heal(defender,0.25,'Earth Eater'); return true; }
  if(t==='fire' && defender.ability==='Flash Fire'){ defender.flashFire=true; logMsg(`${defender.name}'s Flash Fire powered it up!`,'i'); return true; }
  if(t==='fire' && defender.ability==='Well-Baked Body'){ tryBoost(defender,{def:2},defender); logMsg(`${defender.name}'s Well-Baked Body raised Defense!`,'i'); return true; }
  if(t==='water' && ['Water Absorb','Dry Skin'].includes(defender.ability)){ heal(defender,0.25,defender.ability); return true; }
  if(t==='electric' && ['Volt Absorb'].includes(defender.ability)){ heal(defender,0.25,'Volt Absorb'); return true; }
  if(t==='electric' && defender.ability==='Motor Drive'){ tryBoost(defender,{spe:1},defender); logMsg(`${defender.name}'s Motor Drive kicked in!`,'i'); return true; }
  if(t==='water' && defender.ability==='Storm Drain'){ tryBoost(defender,{spa:1},defender); logMsg(`${defender.name} drew in the Water move!`,'i'); return true; }
  if(t==='electric' && defender.ability==='Lightning Rod'){ tryBoost(defender,{spa:1},defender); logMsg(`${defender.name} drew in the Electric move!`,'i'); return true; }
  if(t==='grass' && defender.ability==='Sap Sipper'){ tryBoost(defender,{atk:1},defender); logMsg(`${defender.name}'s Sap Sipper kicked in!`,'i'); return true; }
  return false;
}
function heal(m, frac, src){ const before=m.hp; m.hp=Math.min(m.maxHp,m.hp+Math.floor(m.maxHp*frac)); if(m.hp>before) logMsg(`${m.name} restored HP${src?' ('+src+')':''}!`,'i'); }
function postDamageBerries(m){
  if(m.hp<=0) return;

function doSwitch(side, slot, newIdx){
  const T=side==='p'?playerTeam:aiTeam, A=side==='p'?pActive:aActive;
  const otherSlot=slot===0?1:0;
  // guard: the other slot may already hold (or have just taken) this Pokémon this turn
  if(A[otherSlot]===newIdx || T[newIdx]==null || T[newIdx].hp<=0){
    const bring=side==='p'?pBring:aBring;
    const alt=(bring||T.map((_,i)=>i)).find(i=>i!==A[slot]&&i!==A[otherSlot]&&T[i]&&T[i].hp>0);
    if(alt==null) return; // nothing valid to bring in — keep current Pokémon out
    newIdx=alt;
  }
  const out=T[A[slot]];
  if(out && out.ability==='Regenerator' && out.hp>0 && out.hp<out.maxHp){ out.hp=Math.min(out.maxHp,out.hp+Math.floor(out.maxHp/3)); logMsg(`${out.name}'s Regenerator restored HP as it left!`,'i'); }
  if(out){ out.choiceLock=null; out.helpingHand=false; out._proteanUsed=false; out._disguiseBusted=false; out._charging=null; if(out.hp>0){ out.stages={atk:0,def:0,spa:0,spd:0,spe:0,acc:0,eva:0}; out.isTera=out.isTera; out.turnsActive=0; out.taunt=0; out.encore=0; out.confuse=0; } }
  // Zero to Hero: Palafin transforms into Hero form the first time it leaves the field
  if(out && out.ability==='Zero to Hero' && !out._heroed){ const hb=POKEDEX[out.key]&&POKEDEX[out.key].heroBase; if(hb){ out._heroed=true; out.base=hb; const ns=computeStats(hb,out.evs,out.ivs,out.nature); const ratio=out.hp/out.maxHp; out.stats=ns; out.maxHp=ns.hp; out.hp=Math.max(1,Math.round(ns.hp*ratio)); out.name='Palafin-Hero'; logMsg(`⚡ Palafin's Zero to Hero transformed it into its Hero form!`,'i'); } }
  A[slot]=newIdx; const inc=T[newIdx]; inc.turnsActive=0; inc.choiceLock=null;
  logMsg(`${side==='p'?'Go!':'The foe sent out'} ${inc.name}!`, side==='p'?'i':'e');
  triggerEntry(inc);
}
async function aiOrPlayerPivot(act){
  const side=act.side, slot=act.slot;
  const T=side==='p'?playerTeam:aiTeam, A=side==='p'?pActive:aActive, bring=side==='p'?pBring:aBring;
  const avail=bring.filter(i=>!A.includes(i)&&T[i].hp>0);
  if(!avail.length) return;
  if(act.unit.hp<=0) return; // fainted pivots don't switch (except memento handled elsewhere)
  if(side==='a'){ const idx=avail.reduce((b,i)=>T[i].hp>T[b].hp?i:b,avail[0]); doSwitch('a',slot,idx); }
  else { const idx=await promptPivotSwitch(slot,avail); if(idx!=null) doSwitch('p',slot,idx); }
}

async function endTurn(){
  // speed boost & end-of-turn
  const order=allActive().slice().sort((a,b)=>getStat(b,'spe')-getStat(a,'spe'));
  // weather residual
  if(curWeather()==='sand'){ order.forEach(m=>{ if(m.hp>0 && !m.types.includes('rock')&&!m.types.includes('ground')&&!m.types.includes('steel')&&m.item!=='Safety Goggles'&&!['Sand Force','Sand Rush','Sand Veil','Overcoat','Magic Guard'].includes(m.ability)){ const d=Math.max(1,Math.floor(m.maxHp/16)); m.hp=Math.max(0,m.hp-d); } }); }
  order.forEach(m=>{
    if(m.hp<=0) return;
    if(m._roost){ m._roost=false; }
    // terrain heal
    if(terrain==='grassy'&&grounded(m)&&m.hp<m.maxHp){ m.hp=Math.min(m.maxHp,m.hp+Math.floor(m.maxHp/16)); }
    // leftovers
    if(m.item==='Leftovers'&&m.hp<m.maxHp){ m.hp=Math.min(m.maxHp,m.hp+Math.floor(m.maxHp/16)); logMsg(`${m.name} restored a little HP using its Leftovers!`,'i'); }
    // status
    if(m.ability!=='Magic Guard'){
      if(m.status==='BRN'){ m.hp=Math.max(0,m.hp-Math.floor(m.maxHp/16)); }
      else if(m.status==='PSN'){ m.hp=Math.max(0,m.hp-Math.floor(m.maxHp/8)); }
      else if(m.status==='TOX'){ m.hp=Math.max(0,m.hp-Math.floor(m.maxHp*m.toxicN/16)); m.toxicN=Math.min(15,m.toxicN+1); }
    }
    if(m.item==='Flame Orb' && !m.status && !m.types.includes('fire') && m.ability!=='Water Veil' && m.ability!=='Water Bubble'){ m.status='BRN'; logMsg(`${m.name} was burned by its Flame Orb!`,'e'); }
    if(m.ability==='Solar Power'&&curWeather()==='sun'){ m.hp=Math.max(0,m.hp-Math.floor(m.maxHp/8)); }
    if(m.ability==='Speed Boost'&&m.turnsActive>0){ tryBoost(m,{spe:1},m,true); }
    if(m.status==='FRZ'&&Math.random()<0.2){ m.status=null; }
    m.turnsActive++;
    m.protect=false; m.protectSpiky=false; m.wideGuard=false; m.flinched=false; m.helpingHand=false;
    if(m.taunt>0)m.taunt--; if(m.encore>0)m.encore--;
    if(m.protectStreak>0 && !m.protect) { /* reset if didn't protect this turn: handled at selection */ }
  });
  // decay field
  if(weatherT>0){ weatherT--; if(weatherT<=0){ logMsg(`The ${weather} subsided.`,'i'); weather='clear'; } }
  if(terrainT>0){ terrainT--; if(terrainT<=0){ logMsg(`The terrain faded.`,'i'); terrain='none'; } }
  if(trickRoom>0){ trickRoom--; if(trickRoom<=0) logMsg(`Dimensions returned to normal.`,'i'); }
  ['p','a'].forEach(s=>{ if(tailwind[s]>0){ tailwind[s]--; if(tailwind[s]<=0) logMsg(`${s==='p'?'Your':'The rival'} Tailwind petered out.`,'i'); } for(const k in screens[s]){ if(screens[s][k]>0) screens[s][k]--; } });
  // reset protect streaks for those that didn't protect
  allActive().forEach(m=>{ if(m && !m.protectedThisTurn) {} });
  updateBattleUI();
  if(checkGameOver()) return;
  await handleFaintReplacements();
}

const el=id=>document.getElementById(id);
const _createMon=createMon;
createMon=function(k,o){const m=_createMon(k,o);if(m&&typeof SPR!=="undefined"&&SPR[m.key])m.sprite=SPR[m.key].f;if(m)m._origItem=m.item;return m;};
// consumed items (Focus Sash, berries, herbs) come back for the next battle, like a real VGC game
function restoreItem(m){if(m&&m._origItem!==undefined)m.item=m._origItem;}
const _loadSprite=loadSprite;
loadSprite=async function(key){if(typeof SPR!=="undefined"&&SPR[key])return SPR[key].f;return _loadSprite(key);};
// wrap the engine's impact so we can fly a move from attacker → target before it lands
const _applyMoveImpact=applyMoveImpact;
applyMoveImpact=async function(attacker,defender,move,side,isSpread){try{await flyMove(attacker,defender,move);}catch(e){}return _applyMoveImpact(attacker,defender,move,side,isSpread);};
function slotOf(mon){let s=pActive.indexOf(playerTeam.indexOf(mon));if(s>=0)return['p',s];s=aActive.indexOf(aiTeam.indexOf(mon));if(s>=0)return['a',s];return null;}
async function flyMove(attacker,defender,move){
  if(!move||move.cat==='status'||!move.pow)return;
  const fx=el('fx-layer'),stage=el('stage');if(!fx||!stage)return;
  const aS=slotOf(attacker),dS=slotOf(defender);if(!aS||!dS)return;
  const aEl=el('sprite-'+aS[0]+aS[1]),dEl=el('slot-'+dS[0]+dS[1]);if(!aEl||!dEl)return;
  const sr=stage.getBoundingClientRect(),ar=aEl.getBoundingClientRect(),dr=dEl.getBoundingClientRect();
  const x1=ar.left-sr.left+ar.width/2,y1=ar.top-sr.top+ar.height*0.45;
  const x2=dr.left-sr.left+dr.width/2,y2=dr.top-sr.top+dr.height*0.5;
  const col=TYPE_COLORS[move.type]||'#fff';
  const raw=ms=>new Promise(r=>setTimeout(r,ms));
  const contact=move.contact||(move.cat==='physical');
  if(!contact){ // special / ranged → projectile
    const pr=document.createElement('div');pr.className='fx-proj';
    pr.style.background=`radial-gradient(circle at 40% 40%, #fff, ${col} 72%)`;
    pr.style.boxShadow=`0 0 12px ${col},0 0 26px ${col}`;
    pr.style.left=x1+'px';pr.style.top=y1+'px';
    pr.style.setProperty('--dx',(x2-x1)+'px');pr.style.setProperty('--dy',(y2-y1)+'px');
    pr.style.animationDuration='300ms';
    fx.appendChild(pr);await raw(275);pr.remove();
  }else{ // physical → slash on target
    await raw(150);
    const sl=document.createElement('div');sl.className='fx-slash';sl.style.left=x2+'px';sl.style.top=y2+'px';sl.style.setProperty('--c',col);fx.appendChild(sl);setTimeout(()=>sl.remove(),320);
    await raw(70);
  }
}
function hexA(hex,a){const c=(hex||'#888').replace('#','');const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);return `rgba(${r},${g},${b},${a})`;}
function typeChip(t){const c=TYPE_COLORS[t]||'#888';return `<span class="chip" style="color:${c};background:${hexA(c,.14)};border-color:${hexA(c,.4)}"><span class="d" style="background:${c}"></span>${t}</span>`;}
function tinyType(t){const c=TYPE_COLORS[t]||'#888';return `<span class="tinytype" style="background:${c}">${t.slice(0,3).toUpperCase()}</span>`;}
function catIcon(c){return c==='physical'?'⚔':c==='special'?'✦':'◈';}
function natureAbbr(n){const a=NATURES[n]||[];return a.length?`${n} (+${STAT_LABEL[a[0]]}/−${STAT_LABEL[a[1]]})`:`${n}`;}
function spreadSummary(m){const p=STAT_KEYS.filter(k=>m.evs[k]>0).map(k=>`${m.evs[k]} ${STAT_LABEL[k]}`);return (p.join(' / ')||'No EVs')+' · '+m.nature;}

/* ---------- VGC helpers ---------- */
function teraGem(type,active,label){return `<span class="tera-gem ${active?'on':''}" style="--tg:${TYPE_COLORS[type]}" title="${label||((active?'Terastallized: ':'Tera type: ')+type)}">◆</span>`;}
function effSpeed(m){let s=getStat(m,'spe');const sd=sideOf(m);if(tailwind[sd])s*=2;return s;}
function speedChip(m){
  if(m.hp<=0)return '';
  const my=effSpeed(m);
  const mods=[trickRoom?'Trick Room is up':'',tailwind[sideOf(m)]?'Tailwind is up':'',m.status==='PAR'?'Paralysed':''].filter(Boolean).join(', ');
  const boosted=!!(tailwind[sideOf(m)]||m.stages.spe>0),cut=!!(m.status==='PAR'||m.stages.spe<0);
  return `<span class="sb-spe ${boosted&&!cut?'up':cut?'down':''}" title="Your current Speed: ${my}${mods?' — '+mods:''}">⚡${my}</span>`;
}

function moveDesc(mv){
  if(!mv)return '—';
  const d=[];
  const sm=mv.statusMove;
  const smMap={protect:'Protects the user from attacks this turn',wideguard:'Blocks spread moves aimed at your side',taunt:'Target can only use damaging moves',encore:'Locks the target into its last move',tailwind:"Doubles your side's Speed for 4 turns",trickroom:'Slower Pokémon move first for 5 turns',weather:'Changes the weather',terrain:'Changes the terrain',screen:'Halves damage taken on your side',redirect:'Draws in single-target attacks aimed at your ally',helpinghand:"Boosts your ally's move by 50% this turn",heal:'Restores HP',partingshot:"Lowers the target's Attack and Sp. Atk, then switches out",sap:"Drains the target's Attack to heal",haze:'Resets every stat change on the field',ally:'Boosts your ally',setup:"Raises the user's own stats",inflict:'Inflicts a status condition',substitute:'Sacrifices HP to create a substitute'};
  if(sm&&smMap[sm])d.push(smMap[sm]);
  if(mv.infStatus)d.push('Causes '+(STATUS_WORD[mv.infStatus]||mv.infStatus));

  else if(mv.spread)d.push('Hits both opposing Pokémon');
  if(mv.pr)d.push(`Priority ${mv.pr>0?'+':''}${mv.pr}`);

  if(mv.multi)d.push(`Hits ${mv.multi} times`);

  if(mv.sec&&mv.sec.stat)d.push(`${Math.round(mv.sec.chance*100)}% chance to ${mv.sec.stg>0?'raise':'lower'} ${STAT_LABEL[mv.sec.stat]}`);
  if(mv.selfBoost)d.push('User: '+Object.entries(mv.selfBoost).map(([k,v])=>`${v>0?'+':''}${v} ${STAT_LABEL[k]}`).join(', '));
  if(mv.knock)d.push("Knocks off the target's held item");
  if(mv.pivot)d.push('User switches out afterwards');
  if(mv.fakeout)d.push('Only works the turn it switches in');
  if(mv.useDef)d.push('Uses Defense for damage instead of Attack');
  if(mv.physDef)d.push("Hits the target's Defense");
  if(mv.foulPlay)d.push("Uses the target's Attack");
  if(mv.hpScaled)d.push("Weaker as the user's HP falls");
  if(mv.freezeDry)d.push('Super effective against Water');
  if(mv.ignoreDef)d.push("Ignores the target's stat changes");
  if(mv.acrobatics)d.push('Doubles in power with no held item');

function createVariedMon(key,used){

// re-roll an existing team's SETS in place (keeps species & sprites) — used for the build-mode rival

  updateBattleUI();
}

function spriteBack(m){return (typeof SPR!=='undefined'&&SPR[m.key]&&SPR[m.key].b)||m.sprite||FALLBACK_SPRITE;}
function spriteFront(m){return (typeof SPR!=='undefined'&&SPR[m.key]&&SPR[m.key].f)||m.sprite||FALLBACK_SPRITE;}
function foeName(t){if(!t||t==='all')return '';const sl=parseInt(t[1]);const m=aiTeam[aActive[sl]];return m?m.name:'—';}
function activeCount(){return [0,1].filter(needsAction).length;}
function actionReady(s){const pa=pendingActions[s];if(!pa)return false;if(pa.type==='move'&&(pa.target===null||pa.target===undefined))return false;return true;}
function chosenCount(){return [0,1].filter(s=>needsAction(s)&&actionReady(s)).length;}
function allChosen(){return activeCount()>0&&[0,1].every(s=>!needsAction(s)||actionReady(s));}
function advanceStep(){const nx=[0,1].find(s=>needsAction(s)&&!actionReady(s));if(nx!=null)cmdStep=nx;}

function monCard(side,slot){
  const T=side==='p'?playerTeam:aiTeam,A=side==='p'?pActive:aActive,m=T[A[slot]];
  const cls=side==='p'?'ally':'foe';
  if(!m)return `<div class="sd-mon ${cls}" id="slot-${side}${slot}"></div>`;
  const pct=Math.max(0,m.hp/m.maxHp*100);
  const hpcol=pct>50?'var(--hp-hi)':pct>20?'var(--hp-mid)':'var(--hp-lo)';
  const isAlly=side==='p';
  const targetable=targetMode&&side==='a'&&m.hp>0;
  const acting=isAlly&&!locked&&!targetMode&&!allChosen()&&cmdStep===slot&&needsAction(slot);
  const queued=isAlly&&pendingActions[slot];
  const img=isAlly?spriteBack(m):spriteFront(m);
  const statusB=m.status?`<span class="sb-st st-${m.status}">${m.status}</span>`:'';
  // your own Tera type is always visible so you know what you're holding; the rival's only shows once they use it
  const showTera=isAlly||m.isTera;
  const teraB=showTera?teraGem(m.teraType,m.isTera):'';
  const speB=isAlly?speedChip(m):'';
  const protB=(!isAlly&&m.protectStreak>0)?`<span class="sb-prot" title="Used Protect last turn — it is less likely to work again">🛡</span>`:'';
  const rv=(!isAlly&&m._rev&&(m._rev.ability||m._rev.item))?`<span class="sb-item rev" title="Revealed in battle">${m._rev.ability||'?'} · @${revItemText(m)||'?'}</span>`:'';
  const itemB=isAlly?`<span class="sb-item" title="Ability: ${m.ability} · Held item: ${m.item}">${m.ability}${m.item&&m.item!=='No Item'?' · @'+m.item:''}</span>`:'';
  const stgs=Object.entries(m.stages).filter(([k,v])=>v!==0&&['atk','def','spa','spd','spe'].includes(k)).map(([k,v])=>`<span class="sb-stg ${v>0?'up':'dn'}" title="${STAT_LABEL[k]} ${v>0?'+':''}${v}">${v>0?'+':''}${v} ${STAT_LABEL[k]}</span>`).join('');
  const scoutable=!isAlly&&!targetMode&&m.hp>0;
  const clickAttr=targetable?`onclick="fieldTap('a',${slot})"`:(scoutable?`onclick="openScout(${slot})" title="Tap for a scouting report"`:'');
  return `<div class="sd-mon ${cls} ${m.hp<=0?'fainted':''} ${acting?'acting':''} ${targetable?'targetable':''} ${scoutable?'scoutable':''} ${queued?'queued':''} ${m.isTera?'is-tera':''}" id="slot-${side}${slot}" ${clickAttr}>
    <div class="statbar ${cls} ${m.isTera?'tera-on':''}" ${m.isTera?`style="--tg:${TYPE_COLORS[m.teraType]}"`:''}>
      <div class="sb-top"><span class="sb-name">${m.name}</span>${teraB}<span class="sb-lv">L50</span></div>
      <div class="sb-track"><i class="sb-fill" id="hpfill-${side}${slot}" style="width:${pct}%;background:${hpcol}"></i></div>
      <div class="sb-bot"><span class="sb-num">${Math.round(pct)}%</span><span class="sb-badges">${speB}${protB}${statusB}${m.types.map(t=>`<span class="sb-type" style="background:${TYPE_COLORS[t]}">${t.slice(0,3).toUpperCase()}</span>`).join('')}${stgs}</span></div>
      ${itemB?`<div class="sb-item-row">${itemB}</div>`:''}${rv?`<div class="sb-item-row">${rv}</div>`:''}
    </div>
    <div class="sd-slot">
      <div class="flash" id="flash-${side}${slot}"></div>
      <div class="sd-plat"></div>
      <img class="sd-spr ${cls}" id="sprite-${side}${slot}" src="${img}" onerror="spriteFallback(this)" alt="${m.name}">
      ${queued?'<span class="sd-check">✓</span>':''}
      ${acting?'<span class="sd-arrow">▼</span>':''}
    </div>
  </div>`;
}
function animateHp(side,slot){
  const T=side==='p'?playerTeam:aiTeam,A=side==='p'?pActive:aActive,m=T[A[slot]];if(!m)return;
  const fill=el(`hpfill-${side}${slot}`);if(!fill)return;
  const pct=Math.max(0,m.hp/m.maxHp*100),prev=(m._pct==null?pct:m._pct);
  fill.style.width=prev+'%';requestAnimationFrame(()=>{fill.style.width=pct+'%';});
  fill.style.background=pct>50?'var(--hp-hi)':pct>20?'var(--hp-mid)':'var(--hp-lo)';m._pct=pct;
}
function renderFieldStrip(){
  const s=el('field-strip');if(!s)return;const c=[];
  // active field conditions come FIRST so they're always visible
  const WI={sun:'☀',rain:'🌧',sand:'🌪',snow:'❄'};
  if(weather!=='clear')c.push(`<div class="fchip on" title="Weather — ${weatherT||'?'} turn(s) left${curWeather()!==weather?' (suppressed by Air Lock)':''}">${WI[weather]||'☁'} ${cap(weather)} · ${weatherT||'?'}${curWeather()!==weather?' · negated':''}</div>`);
  if(terrain!=='none')c.push(`<div class="fchip on" title="Terrain — ${terrainT||'?'} turn(s) left">▲ ${cap(terrain)} Terrain · ${terrainT||'?'}</div>`);
  if(trickRoom)c.push(`<div class="fchip on" title="Speed order is reversed — ${trickRoom} turn(s) left">🔄 Trick Room · ${trickRoom}</div>`);
  if(tailwind.p)c.push(`<div class="fchip you" title="Your side's Speed is doubled — ${tailwind.p} turn(s) left">➤ Your Tailwind · ${tailwind.p}</div>`);
  if(tailwind.a)c.push(`<div class="fchip foe" title="The rival's Speed is doubled — ${tailwind.a} turn(s) left">➤ Foe Tailwind · ${tailwind.a}</div>`);
  ['reflect','lightscreen','auroraveil'].forEach(k=>{const lbl={reflect:'Reflect',lightscreen:'Light Screen',auroraveil:'Aurora Veil'}[k];if(screens.p[k])c.push(`<div class="fchip you" title="Your side — ${screens.p[k]} turn(s) left">🛡 ${lbl} · ${screens.p[k]}</div>`);if(screens.a[k])c.push(`<div class="fchip foe" title="Rival side — ${screens.a[k]} turn(s) left">🛡 Foe ${lbl} · ${screens.a[k]}</div>`);});
  if(!c.length)c.push(`<div class="fchip"><span style="opacity:.6">Field:</span> Clear</div>`);
  // Tera status chips last
  c.push(`<div class="fchip tera ${teraUsed.p?'spent':'you'}" title="${teraUsed.p?'You have already Terastallized this battle':'You still have your Terastallization available'}">◆ You: ${teraUsed.p?'Tera used':'Tera ready'}</div>`);
  c.push(`<div class="fchip tera ${teraUsed.a?'spent':'foe'}" title="${teraUsed.a?'The rival has used their Terastallization':'The rival still has their Terastallization'}">◆ Foe: ${teraUsed.a?'Tera used':'Tera ready'}</div>`);
  s.innerHTML=c.join('');
}
function updateBattleUI(){
  if(!el('foes'))return;
  el('foes').innerHTML=monCard('a',0)+monCard('a',1);
  el('allies').innerHTML=monCard('p',0)+monCard('p',1);
  [['a',0],['a',1],['p',0],['p',1]].forEach(([s,sl])=>animateHp(s,sl));
  renderParty('p');renderParty('a');
  const st=el('stage');if(st)st.classList.toggle('targeting',!!targetMode);
  const wx=el('wx');if(wx)wx.className='wx '+(curWeather()!=='clear'?'w-'+curWeather():'')+' '+(terrain!=='none'?'t-'+terrain:'');
  if(st){st.dataset.wx=curWeather();st.dataset.tr=trickRoom?'1':'0';}
  if(el('ann-turn'))el('ann-turn').textContent='T'+turn;
  renderFieldStrip();renderControls();
}

   SHOWDOWN-STYLE CONTROLS  (bottom move panel, steps per Pokémon)

function heldInfo(m){
  const it=(m.item&&m.item!=='No Item')?m.item:'No item';
  const isChoice=CHOICE_ITEMS.includes(m.item), locked=isChoice&&m.choiceLock!=null;
  const warn=locked?`<span class="held-warn" title="Choice item — locked until you switch out">🔒 locked: ${m.moves[m.choiceLock].name}</span>`
    :isChoice?`<span class="held-warn" title="A Choice item locks you into the first move you pick, until you switch out">🔒 will lock to your first move</span>`
    :(m.item==='Assault Vest')?`<span class="held-warn" title="Assault Vest blocks status moves">🚫 no status moves</span>`:'';
  return `<span class="held-ab" title="Ability">✦ ${m.ability}</span><span class="held-it" title="Held item">@ ${it}</span>${warn}`;
}
function renderControls(){
  const c=el('controls');if(!c)return;
  if(locked){c.innerHTML=`<div class="sd-wait"><span class="sd-spin"></span> Resolving turn…</div>`;return;}
  if(targetMode){cmdStep=targetMode.slot;}
  else if(!allChosen()){const nx=[0,1].find(s=>needsAction(s)&&!actionReady(s));if(nx!=null)cmdStep=nx;}
  const chips=`<div class="sd-chips">${[0,1].filter(needsAction).map(s=>{
      const m=playerTeam[pActive[s]],pa=pendingActions[s],ready=actionReady(s);
      let t=ready?(pa.type==='switch'?'⇄ '+playerTeam[pa.index].name:m.moves[pa.move].name+(pa.target&&pa.target!=='all'?' ▸ '+(pa.target[0]==='p'?playerTeam[pActive[+pa.target[1]]].name+' (ally)':foeName(pa.target)):'')):((targetMode&&targetMode.slot===s)?'pick a target…':'choosing…');
      const cur=targetMode?targetMode.slot===s:cmdStep===s;
      return `<button class="sd-chip ${ready?'set':''} ${cur?'cur':''}" onclick="editStep(${s})"><img src="${spriteFront(m)}"><span class="sc-i"><b>${m.name}</b><em>${t}</em></span>${ready?'<span class="sc-k">✎</span>':''}</button>`;
    }).join('')}</div>`;
  let body;
  if(targetMode){
    const s=targetMode.slot,m=playerTeam[pActive[s]],foes=aliveFoeSlots(),tmv=m.moves[targetMode.move];
    body=`<div class="sd-panel"><div class="sd-ask">Who should <b>${tmv.name}</b> hit? <span class="sd-step">tap a foe on the field, or below</span></div>
      <div class="sd-targets">${foes.map(fi=>{const f=aiTeam[aActive[fi]];
        const hp=Math.round(f.hp/f.maxHp*100);
        return `<button class="sd-tgt" onclick="pickTarget(${fi})" title="${f.name} — ${hp}% HP · ${f.types.join('/')}"><img src="${spriteFront(f)}"><span class="tgt-n">${f.name}</span><span class="tgt-hp">${hp}% HP · ${f.types.map(t=>t.slice(0,3).toUpperCase()).join('/')}</span></button>`;}).join('')}</div>
      ${(canTargetAlly(tmv)&&allyAlive(s))?(()=>{const a=playerTeam[pActive[s===0?1:0]];const hp=Math.round(a.hp/a.maxHp*100);return `<div class="sd-targets"><button class="sd-tgt ally" onclick="pickAlly()" title="Heal ${a.name} for half its HP"><img src="${spriteFront(a)}"><span class="tgt-n">🌼 ${a.name} (ally)</span><span class="tgt-hp">${hp}% HP · heals 50%</span></button></div>`;})():''}
      <button class="sd-back" onclick="cancelTarget()">← back to moves</button></div>`;
  }else if(allChosen()){
    body=`<div class="sd-panel"><button class="sd-go" onclick="confirmTurn()">▶ GO</button><div class="sd-hint">Both locked in — tap a Pokémon above to change.</div></div>`;
  }else{
    const s=cmdStep,m=playerTeam[pActive[s]];
    const choiceLock=CHOICE_ITEMS.includes(m.item)&&m.choiceLock!=null;
    const moves=m.moves.map((mv,i)=>{
      const why=mv.pp<=0?'No PP left':(m.taunt>0&&mv.cat==='status')?'Taunted — status moves blocked':(m.item==='Assault Vest'&&mv.cat==='status')?'Assault Vest blocks status moves':(mv.fakeout&&m.turnsActive>0)?'Only works on the turn it switches in':(choiceLock&&i!==m.choiceLock)?`Locked into ${m.moves[m.choiceLock].name} by ${m.item}`:(m._charging&&mv.id!==m._charging)?`Charging ${(m.moves.find(x=>x.id===m._charging)||{}).name} — it fires this turn`:(m.encore>0&&m.lastMoveId&&mv.id!==m.lastMoveId)?`Encored into ${(m.moves.find(x=>x.id===m.lastMoveId)||{}).name}`:(mv.noConsec&&m.lastMoveId===mv.id)?`${mv.name} can't be used twice in a row`:'';
      const dis=!!why;
      const sp=!!(mv.spread||mv.spreadAll);
      const dtype=effectiveMoveType(mv,m); const tc=TYPE_COLORS[dtype];
      const needsT=needsTarget(mv)&&aliveFoeSlots().length>1;
      const tags=[];
      if(sp)tags.push(`<span class="mv-tag" title="Hits both opposing Pokémon">⇶ spread</span>`);
      if(mv.pr)tags.push(`<span class="mv-tag" title="Move priority ${mv.pr>0?'+':''}${mv.pr}">⚡${mv.pr>0?'+':''}${mv.pr}</span>`);
      if((mv.acc??100)<100)tags.push(`<span class="mv-tag" title="Accuracy ${mv.acc}%">◎${mv.acc}%</span>`);
      const tip=moveTip(mv,dtype)+(why?'\n⚠ '+why:'');
      return `<button class="sd-move" style="--tc:${tc}" ${dis?'disabled':''} title="${tip}" onclick="chooseMove(${s},${i})">
        <span class="mv-name">${mv.name}${needsT?' <span class="mv-aim" title="You choose the target">◎</span>':''}</span>
        <span class="mv-line"><span class="mv-type">${dtype}${mv.pow?' · '+mv.pow:''}</span><span class="mv-pp">PP ${mv.pp}/${mv.maxPp}</span></span>
        <span class="mv-foot"><span class="mv-cat">${catIcon(mv.cat)} ${mv.cat}</span><span class="mv-tags">${tags.join('')}</span></span>
      </button>`;
    }).join('');
    const avail=pBring.filter(i=>!pActive.includes(i)&&playerTeam[i].hp>0);
    const tOn=teraIntent[s],tSpent=teraUsed.p;
    const teraLbl=tSpent?'◆ Tera already used':(tOn?`◆ Tera: ${m.teraType.toUpperCase()} ✓`:`◆ Terastallize → ${m.teraType.toUpperCase()}`);
    body=`<div class="sd-panel">
      <div class="sd-ask">What will <b>${m.name}</b> do? <span class="sd-step">${chosenCount()+1} / ${activeCount()}</span></div>
      <div class="sd-held">${heldInfo(m)}</div>
      <div class="sd-moves">${moves}</div>
      <div class="sd-extra">
        <button class="sd-ex tera ${tOn?'on':''}" style="--tg:${TYPE_COLORS[m.teraType]}" ${tSpent&&!tOn?'disabled':''} title="${tSpent?'You have already Terastallized this battle':'Terastallize '+m.name+' into '+m.teraType+' this turn (once per battle)'}" onclick="toggleTera(${s})">${teraLbl}</button>
        <button class="sd-ex" ${avail.length?'':'disabled'} title="${avail.length?'Switch to a benched Pokémon':'No benched Pokémon available'}" onclick="openSwitch(${s})">⇄ Switch out</button>
      </div>
      <div class="sd-keys">Keys: <b>1–4</b> move · <b>T</b> tera · <b>S</b> switch · <b>Enter</b> go</div>
    </div>`;
  }
  c.innerHTML=chips+body;
}
function editStep(s){if(locked||!needsAction(s))return;sfx.click();pendingActions[s]=null;targetMode=null;cmdStep=s;updateBattleUI();}
function chooseMove(slot,i){
  if(locked)return;sfx.click();
  const m=playerTeam[pActive[slot]],mv=m.moves[i],wasTera=teraIntent[slot];
  if(needsTarget(mv)){
    const foes=aliveFoeSlots();
    const allyOk=canTargetAlly(mv)&&allyAlive(slot);
    if(foes.length<=1&&!allyOk){pendingActions[slot]={type:'move',move:i,target:'a'+(foes[0]??0),tera:wasTera};targetMode=null;advanceStep();}
    else{pendingActions[slot]={type:'move',move:i,target:null,tera:wasTera};targetMode={slot,move:i};}
  }else{pendingActions[slot]={type:'move',move:i,target:'all',tera:wasTera};targetMode=null;advanceStep();}
  updateBattleUI();
}
function canTargetAlly(mv){return mv&&mv.id==='pollenPuff';}
function allyAlive(slot){const o=slot===0?1:0;const a=playerTeam[pActive[o]];return !!(a&&a.hp>0);}
function pickAlly(){if(!targetMode)return;sfx.click();const s=targetMode.slot;pendingActions[s].target='p'+(s===0?1:0);targetMode=null;advanceStep();updateBattleUI();}
function fieldTap(side,slot){if(targetMode&&side==='a')pickTarget(slot);else if(targetMode&&side==='p'&&slot!==targetMode.slot&&canTargetAlly(playerTeam[pActive[targetMode.slot]].moves[targetMode.move]))pickAlly();}
function pickTarget(foeSlot){if(!targetMode)return;sfx.click();const s=targetMode.slot;pendingActions[s].target='a'+foeSlot;targetMode=null;advanceStep();updateBattleUI();}
function cancelTarget(){if(!targetMode)return;const s=targetMode.slot;pendingActions[s]=null;cmdStep=s;targetMode=null;updateBattleUI();}
function toggleTera(slot){if(locked||teraUsed.p)return;sfx.click();teraIntent[slot]=!teraIntent[slot];if(teraIntent[slot]){const o=slot===0?1:0;teraIntent[o]=false;}if(pendingActions[slot]&&pendingActions[slot].type==='move')pendingActions[slot].tera=teraIntent[slot];updateBattleUI();}
function openSwitch(slot){
  if(locked)return;
  const other=slot===0?1:0,oq=(pendingActions[other]&&pendingActions[other].type==='switch')?pendingActions[other].index:null;
  const avail=pBring.filter(i=>!pActive.includes(i)&&playerTeam[i].hp>0&&i!==oq);
  if(!avail.length){toast('No bench available.');return;}
  sfx.click();document.querySelectorAll('#switch-modal').forEach(x=>x.remove());
  document.body.insertAdjacentHTML('beforeend',`<div class="mbg" id="switch-modal"><div class="modal"><div class="eyebrow">Bench swap</div><h3>Switch out ${playerTeam[pActive[slot]].name}</h3><p class="msub">The switch happens before any attacks this turn.</p><div class="pick-grid">${avail.map(i=>benchPick(i,`queueSwitch(${slot},${i})`)).join('')}</div><div class="mact"><button class="btn ghost" onclick="el('switch-modal').remove()">Cancel</button></div></div></div>`);
}
function queueSwitch(slot,idx){sfx.click();el('switch-modal')?.remove();pendingActions[slot]={type:'switch',index:idx};targetMode=null;advanceStep();updateBattleUI();}
function canGo(){return allChosen();}
function confirmTurn(){if(!allChosen()||locked)return;sfx.click();[0,1].forEach(s=>{if(pendingActions[s]&&pendingActions[s].type==='move')pendingActions[s].tera=teraIntent[s];});locked=true;targetMode=null;updateBattleUI();executeTurn();}

/* ============================================================
   LOG / POPUPS / FAINT / GAME OVER
   ============================================================ */
function logMsg(msg,cls='p'){try{revealFromLog(msg);}catch(e){}battleLog.push({msg,cls});renderAnnFeed();fxFromMessage(msg,cls);}
function renderAnnFeed(){const f=el('ann-feed');if(!f)return;const last=battleLog.slice(-3);f.innerHTML=last.map((l,i)=>`<div class="aln ${l.cls} ${i===last.length-1?'cur':''}">${l.msg}</div>`).join('');}
function fxFromMessage(msg,cls){
  if(cls==='turn'&&/turn/i.test(msg)){showTurnBanner(msg);return;}
  if(/critical/i.test(msg))showCallout('CRITICAL HIT!','crit');
  else if(/super effective/i.test(msg))showCallout('SUPER EFFECTIVE!','se');
  else if(/not very effective|doesn't affect|unaffected/i.test(msg))showCallout('resisted…','weak');
  else if(/terastallized/i.test(msg))showCallout('TERASTALLIZE!','tera');
  else if(/missed/i.test(msg))showCallout('MISS','miss');
  else if(/fainted/i.test(msg))showCallout('DOWN!','faint');
}
function showCallout(text,kind){const fx=el('fx-layer');if(!fx)return;document.querySelectorAll('#fx-layer .callout').forEach(x=>x.remove());const d=document.createElement('div');d.className='callout '+kind;d.textContent=text;fx.appendChild(d);setTimeout(()=>d.remove(),1150);}
function showTurnBanner(text){const fx=el('fx-layer');if(!fx)return;const d=document.createElement('div');d.className='turn-banner';d.textContent=text.replace(/[—-]/g,'').trim();fx.appendChild(d);setTimeout(()=>d.remove(),1400);}
function openLog(){
  document.querySelectorAll('#log-modal').forEach(x=>x.remove());
  const rows=battleLog.slice().reverse().map(l=>`<div style="padding:7px 10px;border-left:3px solid ${logColor(l.cls)};background:var(--panel2);border-radius:7px;margin-bottom:5px;font-size:12.5px">${l.msg}</div>`).join('')||'<p class="msub">No events yet.</p>';
  document.body.insertAdjacentHTML('beforeend',`<div class="mbg" id="log-modal"><div class="modal"><div class="eyebrow">Battle log</div><h3>Turn ${turn}</h3><div style="max-height:60vh;overflow:auto;margin-top:10px">${rows}</div><div class="mact"><button class="btn ghost" onclick="el('log-modal').remove()">Close</button></div></div></div>`);
}
function logColor(c){return {p:'var(--cyan)',e:'var(--red)',s:'var(--gold)',i:'var(--hp-hi)',t:'var(--tera)',turn:'var(--gold)'}[c]||'var(--line2)';}
function showDamagePopup(cardEl,dmg,crit){
  const fx=el('fx-layer'),stage=el('stage');if(!fx||!stage||!cardEl)return;
  const cr=cardEl.getBoundingClientRect(),sr=stage.getBoundingClientRect();
  const cx=cr.left-sr.left+cr.width/2, cy=cr.top-sr.top+cr.height*0.5;
  let col='#ffffff';const fl=cardEl.querySelector('.flash');if(fl&&fl.style.backgroundColor)col=fl.style.backgroundColor;
  const tspr=cardEl.querySelector('.sd-spr');if(tspr){tspr.classList.remove('whiteflash');void tspr.offsetWidth;tspr.classList.add('whiteflash');setTimeout(()=>tspr.classList.remove('whiteflash'),280);}
  // impact shockwave
  const ring=document.createElement('div');ring.className='fx-ring';ring.style.left=cx+'px';ring.style.top=cy+'px';ring.style.borderColor=col;fx.appendChild(ring);setTimeout(()=>ring.remove(),620);
  // burst particles
  const n=crit?14:9;for(let i=0;i<n;i++){const pt=document.createElement('div');pt.className='fx-pt';const ang=(Math.PI*2*i/n)+Math.random()*0.6;const dist=28+Math.random()*46;pt.style.left=cx+'px';pt.style.top=cy+'px';pt.style.background=col;pt.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(1)+'px');pt.style.setProperty('--dy',(Math.sin(ang)*dist).toFixed(1)+'px');fx.appendChild(pt);setTimeout(()=>pt.remove(),540);}
  // damage number
  const p=document.createElement('div');p.className='dpop'+(crit?' crit':'');p.style.left=cx+'px';p.style.top=(cy-14)+'px';p.textContent='-'+dmg+(crit?'!':'');fx.appendChild(p);setTimeout(()=>p.remove(),1250);
  // screen shake scaled to hit strength
  const hard=crit||dmg>=110;stage.classList.remove('shake','shake-hard');void stage.offsetWidth;stage.classList.add(hard?'shake-hard':'shake');setTimeout(()=>stage.classList.remove('shake','shake-hard'),hard?470:300);
}
function promptReplace(slot,avail){return new Promise(res=>{document.querySelectorAll('#replace-modal').forEach(x=>x.remove());document.body.insertAdjacentHTML('beforeend',`<div class="mbg" id="replace-modal"><div class="modal"><div class="eyebrow">Fainted</div><h3>Send in a replacement</h3><p class="msub">Choose who takes the empty slot.</p><div class="pick-grid">${avail.map(i=>benchPick(i,`window.__rep(${i})`)).join('')}</div></div></div>`);window.__rep=idx=>{el('replace-modal')?.remove();delete window.__rep;res(idx);};});}
function promptPivotSwitch(slot,avail){return new Promise(res=>{document.querySelectorAll('#pivot-modal').forEach(x=>x.remove());document.body.insertAdjacentHTML('beforeend',`<div class="mbg" id="pivot-modal"><div class="modal"><div class="eyebrow">Pivot</div><h3>Send in a Pokémon</h3><p class="msub">The move pivots you out — pick who comes in.</p><div class="pick-grid">${avail.map(i=>benchPick(i,`window.__piv(${i})`)).join('')}</div></div></div>`);window.__piv=idx=>{el('pivot-modal')?.remove();delete window.__piv;res(idx);};});}
async function handleFaintReplacements(){
  for(let s=0;s<2;s++){if(aiTeam[aActive[s]].hp<=0){const n=aBring.find(i=>!aActive.includes(i)&&aiTeam[i].hp>0);if(n!==undefined){aActive[s]=n;aiTeam[n]._pct=null;logMsg(`The rival sent out ${aiTeam[n].name}!`,'e');triggerEntry(aiTeam[n]);}}}
  updateBattleUI();
  for(let s=0;s<2;s++){if(playerTeam[pActive[s]].hp<=0){const avail=pBring.filter(i=>!pActive.includes(i)&&playerTeam[i].hp>0);if(avail.length){const idx=await promptReplace(s,avail);pActive[s]=idx;playerTeam[idx]._pct=null;logMsg(`Go! ${playerTeam[idx].name}!`,'i');triggerEntry(playerTeam[idx]);}}}
  if(checkGameOver())return;
  pendingActions={0:null,1:null};teraIntent={0:false,1:false};targetMode=null;activeMenu=null;commandFocus=aliveSlot();locked=false;turn++;
  logMsg(`— Turn ${turn} —`,'turn');updateBattleUI();
}
function recLoad(){try{const r=JSON.parse(localStorage.getItem('arena_record_v1')||'null');if(r&&typeof r.w==='number')return r;}catch(e){}return {w:0,l:0,streak:0,best:0};}
function recSave(r){try{localStorage.setItem('arena_record_v1',JSON.stringify(r));}catch(e){}}
function recAdd(win){const r=recLoad();if(win){r.w++;r.streak=r.streak>0?r.streak+1:1;}else{r.l++;r.streak=r.streak<0?r.streak-1:-1;}r.best=Math.max(r.best||0,r.streak);recSave(r);return r;}
function recText(r){r=r||recLoad();if(!r.w&&!r.l)return '';const st=r.streak>1?` · 🔥 ${r.streak} win streak`:r.streak<-1?` · ${-r.streak} losses in a row`:'';return `Record ${r.w}–${r.l}${st}`;}
// same teams again: random battles go back to team preview with the same twelve Pokémon
function rematch(){el('over-modal')?.remove();pBring=[];aBring=aiChooseBring();if(gameMode==='random')openPreview();else startTeamPreview();}
function showGameOver(win){
  win?sfx.win():sfx.lose();
  const rec=recAdd(win);
  const acc=win?'var(--hp-hi)':'var(--red)';
  const mine=pBring.filter(i=>playerTeam[i].hp>0),theirs=aBring.filter(i=>aiTeam[i].hp>0);
  const survivors=mine.map(i=>`<span class="ov-s" title="${playerTeam[i].name} — ${Math.round(playerTeam[i].hp/playerTeam[i].maxHp*100)}%"><img src="${spriteFront(playerTeam[i])}" onerror="spriteFallback(this)"></span>`).join('')||'<em style="color:var(--txt-mute);font-size:12px">none</em>';
  document.body.insertAdjacentHTML('beforeend',`<div class="mbg" id="over-modal"><div class="modal" style="text-align:center;border-color:${acc}">
    <div class="eyebrow" style="margin:0 auto 12px;color:${acc};border-color:${acc}">Match result</div>
    <h2 style="font-size:52px;color:${acc}">${win?'VICTORY':'DEFEAT'}</h2>
    <p class="msub" style="margin:10px 0 16px">${win?'You read the field and took the double. Nicely done.':'The rival edged it out — run it back.'}</p>
    <div class="ov-stats"><span><b>${turn}</b> turns</span><span><b>${mine.length}</b> of yours standing</span><span><b>${theirs.length}</b> of theirs</span></div>
    <div class="ov-surv"><span class="ov-lb">Survivors</span>${survivors}</div>
    ${(()=>{const myKO=pBring.reduce((a,i)=>a+(playerTeam[i]._kos||0),0),thKO=aBring.reduce((a,i)=>a+(aiTeam[i]._kos||0),0);
      const mvp=pBring.map(i=>playerTeam[i]).sort((a,b)=>(b._kos||0)-(a._kos||0))[0];
      return `<div class="ov-stats"><span><b>${myKO}</b> KOs by you</span><span><b>${thKO}</b> KOs by the rival</span>${mvp&&mvp._kos?`<span>MVP <b>${mvp.name}</b> (${mvp._kos} KO${mvp._kos>1?'s':''})</span>`:''}</div>
      <div class="ov-rec">${recText(rec)}</div>`;})()}
    <details class="ov-reveal"><summary>What the rival was running</summary><div class="ov-rv-grid">${aiTeam.map((m,i)=>`<div class="ov-rv ${aBring.includes(i)?'':'benched'}"><img src="${spriteFront(m)}" onerror="spriteFallback(this)"><div><b>${m.name}</b>${aBring.includes(i)?'':' <em>(not brought)</em>'}<span>${m.ability} · @${m._origItem||m.item}</span><span>Tera ${m.teraType} · ${m.nature}</span><span class="ov-mv">${m.moves.map(x=>x.name).join(' · ')}</span></div></div>`).join('')}</div></details>
    <div class="mact" style="justify-content:center">
      <button class="btn primary" onclick="rematch()">↻ Rematch (same teams)</button>
      <button class="btn rose" onclick="el('over-modal').remove();startRandomDoubles()">⚡ Random battle</button>
      <button class="btn ghost" onclick="el('over-modal').remove();renderHome()">Team builder</button>
    </div></div></div>`);
}

/* ============================================================
   INIT
   ============================================================ */
/* keyboard shortcuts — 1-4 moves, T tera, S switch, Enter go, Esc back */
document.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  if(/INPUT|TEXTAREA|SELECT/.test(tag))return;
  if(!el('controls')||locked)return;
  if(document.querySelector('.mbg'))return;
  const k=e.key;
  if(targetMode){
    const foes=aliveFoeSlots();
    if(k==='1'&&foes.length){pickTarget(foes[0]);e.preventDefault();}
    else if(k==='2'&&foes.length>1){pickTarget(foes[1]);e.preventDefault();}
    else if(k==='Escape'){cancelTarget();e.preventDefault();}
    return;
  }
  if(allChosen()){
    if(k==='Enter'||k===' '){confirmTurn();e.preventDefault();}
    else if(k==='Escape'){editStep(cmdStep);e.preventDefault();}
    return;
  }
  const s=cmdStep,m=playerTeam[pActive[s]];if(!m)return;
  if(['1','2','3','4'].includes(k)){const i=+k-1;if(m.moves[i]){chooseMove(s,i);e.preventDefault();}}
  else if(k==='t'||k==='T'){toggleTera(s);e.preventDefault();}
  else if(k==='s'||k==='S'){openSwitch(s);e.preventDefault();}
});

function defaultTeam(keys){return keys.map(k=>createMon(k)).filter(Boolean);}
playerTeam=defaultTeam(['incineroar','rillaboom','urshifu_rs','flutter_mane','farigiraf','amoonguss']);
aiTeam=defaultTeam(['tornadus','gholdengo','ogerpon_h','chien_pao','kingambit','landorus_t']);
renderHome();

</script>
